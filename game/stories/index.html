<title>Impossible Live Stories</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a desk app. Library (left) | Stage (center) | Inspector (right), scene strip along the bottom. Phone: stage on top, tabbed panels below. */
:root{
  --bg:#efe4d2; --panel:#fbf5ea; --panel2:#f3e8d6; --ink:#3a2410; --muted:#8a6e52; --line:#e0cfb4;
  --accent:#e2742b; --accent2:#2f8fa8; --sel:#2f8fa8; --stage:#1d1610;
  --disp:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c140e; --panel:#271c14; --panel2:#30241a; --ink:#f6e8d4; --muted:#b89d80; --line:#45362a;
  --accent:#f08a42; --accent2:#58b6cf; --sel:#58b6cf; --stage:#0f0b08; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c140e; --panel:#271c14; --panel2:#30241a; --ink:#f6e8d4; --muted:#b89d80; --line:#45362a;
  --accent:#f08a42; --accent2:#58b6cf; --sel:#58b6cf; --stage:#0f0b08; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:272px 1fr 268px;grid-template-rows:auto 1fr auto;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.5px;line-height:1;display:flex;flex-direction:column}
.brand small{font-family:var(--body);font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:lowercase}
#title{flex:1;min-width:120px;max-width:340px;font-family:var(--disp);font-size:17px;font-weight:600;border:2px solid transparent;background:transparent;border-radius:10px;padding:6px 8px}
#title:hover,#title:focus{border-color:var(--line);background:var(--panel)}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:16px;height:16px}
.grow{flex:1}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;gap:4px;padding:8px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tab{border:none;background:transparent;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;color:var(--muted)}
.tab.on{background:var(--panel2);color:var(--ink)}
#libSearch{margin:8px 8px 0;border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);font-size:13px}
#cats{display:flex;gap:4px;overflow-x:auto;padding:8px;scrollbar-width:thin}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.scroll{overflow:auto;flex:1;min-height:0;padding:8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.th{background:var(--bg);border:2px solid transparent;border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1;min-width:0}
.th:hover{border-color:var(--accent)}
.th img{width:100%;height:64px;object-fit:contain;pointer-events:none}
.th span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bgth{grid-column:auto}
.bgth img,.bgth canvas{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
#stageWrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
#stageBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--stage);border-radius:18px;position:relative;overflow:hidden}
#stage{display:block;touch-action:none;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#stageBar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#hint{font-size:12px;color:var(--muted);font-weight:700}
#insp .sec{padding:10px;border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
#insp h3{margin:0;font-family:var(--disp);font-weight:600;font-size:15px}
#insp label{font-size:12px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
#insp input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap}
#animCats{display:flex;gap:4px;flex-wrap:wrap}
#animGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.ab{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 4px;font-size:12px;font-weight:800;text-align:center}
.ab.on{border-color:var(--accent);background:var(--accent);color:#fff}
#holdGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#holdGrid button{background:var(--bg);border:2px solid transparent;border-radius:8px;padding:2px}
#holdGrid button.on{border-color:var(--accent)}
#holdGrid img{width:100%;height:36px;object-fit:contain}
textarea{border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;font-size:14px;resize:vertical;min-height:54px}
select{border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:6px 8px;font-weight:700;font-size:13px}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:4px 2px}
#scenes{grid-column:1/-1;display:flex;gap:10px;align-items:stretch;min-width:0}
#strip{flex:1;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;min-width:0}
.sc{flex:0 0 auto;width:150px;border:3px solid var(--line);border-radius:12px;background:var(--panel);padding:4px;display:flex;flex-direction:column;gap:3px;position:relative}
.sc.on{border-color:var(--accent)}
.sc canvas{width:100%;aspect-ratio:16/9;border-radius:8px;display:block;background:#000}
.sc .meta{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.addSc{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;justify-content:center}
#sceneOpts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--muted)}
#player{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#pcv{max-width:100%;max-height:calc(100% - 64px)}
#pbar{display:flex;gap:10px;align-items:center;width:min(900px,92%);padding:10px 0;color:#fff}
#pprog{flex:1;height:6px;background:#ffffff33;border-radius:3px;overflow:hidden}
#pprog i{display:block;height:100%;width:0;background:var(--accent)}
#pbar .btn{background:#ffffff1a;border-color:#ffffff33;color:#fff}
#menu{position:fixed;inset:0;z-index:40;background:rgba(20,12,6,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#menuCard{background:var(--panel);border-radius:18px;padding:16px;width:min(460px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
#menuCard h2{margin:0;font-family:var(--disp);font-weight:600}
.storyRow{display:flex;gap:8px;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.storyRow b{font-family:var(--disp);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#mtabs{display:none}
@media (max-width:980px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr;gap:8px;height:100%}
  #stageWrap{grid-row:2}
  #stageBox{flex:none;aspect-ratio:16/9;width:100%}
  #mtabs{display:flex;gap:4px;grid-row:3}
  #lib,#insp,#scenes{grid-row:4;grid-column:1;min-height:0}
  #scenes{flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px;overflow:auto}
  .mhide{display:none!important}
  .brand{font-size:18px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <header>
    <div class="brand">IMPOSSIBLE LIVE<small>make it possible · stories</small></div>
    <input id="title" aria-label="Story title" value="The Plane on Day 100">
    <div class="grow"></div>
    <button class="btn" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn" id="bRedo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="btn" id="bStories">My stories</button>
    <button class="btn pri" id="bPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>Play story</button>
  </header>

  <section class="panel" id="lib" aria-label="Library">
    <div class="ph"><button class="tab on" data-lt="s">Stickers</button><button class="tab" data-lt="b">Backgrounds</button><button class="tab" data-lt="t">Text</button></div>
    <input id="libSearch" placeholder="Search stickers…" aria-label="Search stickers">
    <div id="cats"></div>
    <div class="scroll"><div id="grid"></div></div>
  </section>

  <section id="stageWrap">
    <div id="stageBox"><canvas id="stage" width="1600" height="900" aria-label="Scene stage"></canvas></div>
    <div id="stageBar">
      <button class="btn on" id="bAnim">Animations on</button>
      <button class="btn" id="bPlayScene">Play this scene</button>
      <span id="hint">Tap a sticker to add it. Drag to move, corner dot to resize, top dot to rotate.</span>
    </div>
  </section>

  <div id="mtabs"><button class="tab on" data-mt="lib">Add</button><button class="tab" data-mt="insp">Edit</button><button class="tab" data-mt="scenes">Scenes</button></div>

  <section class="panel" id="insp" aria-label="Inspector"><div class="scroll" id="inspBody" style="padding:0"></div></section>

  <section id="scenes" aria-label="Scenes">
    <div class="addSc">
      <button class="btn pri" id="bNext" title="Copies this scene so you can move things to show what happens next">+ Next moment</button>
      <button class="btn" id="bBlank">+ Empty scene</button>
    </div>
    <div id="strip"></div>
    <div class="addSc" id="sceneOpts"></div>
  </section>
</div>

<div id="player" hidden><canvas id="pcv" width="1600" height="900"></canvas>
  <div id="pbar"><button class="btn" id="pPause">Pause</button><div id="pprog"><i></i></div><span id="pnum" style="font-weight:800;font-variant-numeric:tabular-nums"></span><button class="btn" id="pClose">Close</button></div></div>
<div id="menu" hidden><div id="menuCard"></div></div>
<div id="toast"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const W=1600,H=900,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const S=Math.sin,C=Math.cos,abs=Math.abs;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eob=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eel=t=>t===0?0:t===1?1:Math.pow(2,-10*t)*S((t*10-.75)*TAU/3)+1;
const cyc=(t,p)=>((t%p)+p)%p/p;
const rnd=(i)=>{const x=S(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
let toastT=0;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1600)}
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ===================== assets ===================== */
const CATN={heroes:'Game heroes',faces:'Faces',actions:'Actions',animals:'Animals',items:'Items',bubbles:'Frames',football:'Football',sports:'Sports',scientists:'Scientists',inventors:'Inventors',musicians:'Music',actors:'Actors',photographers:'Photographers',historical:'History',youtubers:'Creators',astronauts:'Space',explorers:'Explorers',artists:'Artists',writers:'Writers',fiction:'Fiction',story:'Story'};
let ST=[],BGI=[];const IMG={};
function img(fn,dir='a/'){const k=dir+fn;if(IMG[k])return IMG[k];const i=new Image();i.decoding='async';i.src=k;i.onload=()=>{dirty=true;thumbDirty=true};IMG[k]=i;return i}
const ready=i=>i&&i.complete&&i.naturalWidth>0;

/* ===================== procedural backgrounds ===================== */
const PB={};
function grad(x,y0,y1,stops){const g=x.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));return g}
function hills(x,y,amp,col,seed,n=5){x.fillStyle=col;x.beginPath();x.moveTo(0,H);x.lineTo(0,y);for(let i=0;i<=n;i++){const px=i*W/n,cx=px-W/n/2;x.quadraticCurveTo(cx,y-amp*(.6+rnd(seed+i)*.8),px,y+amp*(rnd(seed+i*3)-.5)*.4)}x.lineTo(W,H);x.fill()}
function cloud(x,cx,cy,s,a=.95){x.fillStyle=`rgba(255,255,255,${a})`;x.beginPath();[[0,0,60],[55,-20,52],[110,0,58],[50,18,55],[-45,12,40],[150,15,40]].forEach(([dx,dy,r])=>{x.moveTo(cx+dx*s+r*s,cy+dy*s);x.arc(cx+dx*s,cy+dy*s,r*s,0,TAU)});x.fill()}
function sun(x,cx,cy,r,col){const g=x.createRadialGradient(cx,cy,r*.2,cx,cy,r*3);g.addColorStop(0,col);g.addColorStop(.3,col+'88');g.addColorStop(1,col+'00');x.fillStyle=g;x.fillRect(cx-r*3,cy-r*3,r*6,r*6);x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,TAU);x.fill()}
function stars(x,n,ymax,seed=1){for(let i=0;i<n;i++){x.fillStyle=`rgba(255,255,240,${.4+rnd(seed+i)*.6})`;const r=rnd(i*7+seed)*2.2+.6;x.beginPath();x.arc(rnd(i*3+seed)*W,rnd(i*5+seed)*ymax,r,0,TAU);x.fill()}}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function tree(x,tx,ty,s,col='#3f8a3a'){x.fillStyle='#6a4426';rr(x,tx-10*s,ty-60*s,20*s,70*s,6*s);x.fill();x.fillStyle=col;[[0,-120,70],[-45,-80,55],[45,-80,55],[0,-60,60]].forEach(([dx,dy,r])=>{x.beginPath();x.arc(tx+dx*s,ty+dy*s,r*s,0,TAU);x.fill()});x.fillStyle='rgba(255,255,255,.12)';x.beginPath();x.arc(tx-20*s,ty-140*s,30*s,0,TAU);x.fill()}
function pine(x,tx,ty,s,col){x.fillStyle=col;for(let i=0;i<3;i++){x.beginPath();x.moveTo(tx,ty-(170-i*45)*s);x.lineTo(tx-(55+i*18)*s,ty-(60-i*35)*s);x.lineTo(tx+(55+i*18)*s,ty-(60-i*35)*s);x.fill()}x.fillStyle='#5a3a22';x.fillRect(tx-8*s,ty-30*s,16*s,30*s)}
function building(x,bx,by,w,h,col,win,lit,seed){x.fillStyle=col;x.fillRect(bx,by-h,w,h);for(let r=0;r<Math.floor((h-30)/44);r++)for(let c=0;c<Math.floor((w-16)/34);c++){x.fillStyle=lit&&rnd(seed+r*9+c)>.45?'#ffd56a':win;rr(x,bx+12+c*34,by-h+18+r*44,20,26,4);x.fill()}}
const PROC={
 'Sunny meadow':x=>{x.fillStyle=grad(x,0,H,['#6ec3f0','#bfe6f7','#e8f6fb']);x.fillRect(0,0,W,H);sun(x,1320,150,60,'#fff4b0');cloud(x,260,170,1);cloud(x,900,110,.8);hills(x,560,90,'#8fcf6a',3);hills(x,660,70,'#6db84f',7);tree(x,300,690,1.1);tree(x,1300,680,.9,'#4f9a40');x.fillStyle='#5aa83f';x.fillRect(0,720,W,H);for(let i=0;i<40;i++){x.fillStyle=['#ffd84a','#ff7a8a','#ffffff'][i%3];x.beginPath();x.arc(rnd(i)*W,740+rnd(i+9)*150,5,0,TAU);x.fill()}},
 'Beach':x=>{x.fillStyle=grad(x,0,520,['#4fb3ea','#a9def5']);x.fillRect(0,0,W,520);sun(x,260,140,55,'#fff3a0');cloud(x,1000,140,.9);x.fillStyle=grad(x,420,620,['#1f8fc0','#3fb5d8']);x.fillRect(0,420,W,200);x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=5;for(let i=0;i<14;i++){x.beginPath();x.arc(rnd(i)*W,460+rnd(i+3)*130,40,Math.PI*1.1,Math.PI*1.9);x.stroke()}x.fillStyle='#f4dca0';x.beginPath();x.moveTo(0,620);x.bezierCurveTo(500,580,1100,640,W,600);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(0,620);x.bezierCurveTo(500,580,1100,640,W,600);x.lineTo(W,612);x.bezierCurveTo(1100,652,500,594,0,632);x.fill();x.save();x.translate(1250,700);x.fillStyle='#e04a3a';x.beginPath();x.moveTo(-140,0);x.quadraticCurveTo(0,-110,140,0);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(-50,-38);x.quadraticCurveTo(0,-110,50,-38);x.lineTo(0,0);x.fill();x.fillStyle='#7a5a3a';x.fillRect(-4,-10,8,160);x.restore()},

const A={},ACATS=['Idle','Move','Jump','Feel','Act','Hold','Enter','Exit','Fall','Fun'];
function def(cat,name,f,extra){A[name]=Object.assign({cat,f},extra||{})}
const o0=()=>({dx:0,dy:0,sx:1,sy:1,r:0,a:1,fx:[],tint:null,flip:0,hold:{dx:0,dy:0,r:0,s:1,hide:0}});
const breathe=(o,t,k=1)=>{o.sy*=1+.025*k*S(t*2.4);o.sx*=1-.012*k*S(t*2.4)};
const hop=(t,p,hgt)=>{const c=cyc(t,p);if(c<.15){const k=c/.15;return{y:0,sy:1-.16*S(k*Math.PI/2),sx:1+.1*S(k*Math.PI/2)}}if(c<.75){const k=(c-.15)/.6;return{y:-hgt*S(k*Math.PI),sy:1+.12*(1-abs(k-.5)*2)*.8,sx:1-.06*(1-abs(k-.5)*2)}}const k=(c-.75)/.25;return{y:0,sy:1-.14*S(k*Math.PI),sx:1+.09*S(k*Math.PI)}};
// IDLE
def('Idle','Idle',(o,t)=>{breathe(o,t)});
def('Idle','Bounce',(o,t)=>{const h=hop(t,.8,40);o.dy=h.y;o.sx=h.sx;o.sy=h.sy});
def('Idle','Wobble',(o,t)=>{o.r=.09*S(t*4);o.sx=1+.05*S(t*8);o.sy=1-.05*S(t*8)});
def('Idle','Jelly',(o,t)=>{const k=S(t*6)*Math.exp(-cyc(t,1.6)*3);o.sx=1+.14*k;o.sy=1-.14*k});
def('Idle','Sway',(o,t)=>{o.r=.07*S(t*1.6);breathe(o,t)});
def('Idle','Float',(o,t)=>{o.dy=-20+16*S(t*1.8);o.r=.03*S(t*1.2)});
def('Idle','Pulse',(o,t)=>{const k=1+.06*S(t*3.2);o.sx=k;o.sy=k});
def('Idle','Nod',(o,t)=>{const k=Math.max(0,S(t*4));o.r=.05*k;o.dy=4*k;breathe(o,t)});
def('Idle','Shake head',(o,t)=>{o.r=.08*S(t*14)*(.5+.5*S(t*1.5))});
def('Idle','Look around',(o,t)=>{o.flip=cyc(t,2.4)>.5?1:0;breathe(o,t);o.r=.02*S(t*3)});
def('Idle','Tap foot',(o,t)=>{o.dy=-3*abs(S(t*9));o.r=.015*S(t*9);breathe(o,t)});
def('Idle','Breathe deep',(o,t)=>{o.sy=1+.06*S(t*1.3);o.sx=1+.03*S(t*1.3)});
def('Idle','Still',()=>{});

def('Move','Walk',(o,t)=>{o.dy=-14*abs(S(t*6));o.r=.06*S(t*6);o.sy=1+.03*S(t*12)});

/* ===================== FX drawing (in sticker-local space, origin at feet center, y up negative) ===================== */
function fxDraw(x,name,t,w,h,seed){
  const hy=-h*.72,ey=-h*.66;// head center, eyes
  x.save();
  switch(name){
  case 'tears':case 'tearsBig':{const big=name==='tearsBig';for(let s of[-1,1])for(let i=0;i<(big?4:2);i++){const k=cyc(t*(big?1.8:1.2)+i/(big?4:2)+(s>0?.3:0),1);x.globalAlpha=1-k;x.fillStyle='#5ab4ff';const px=s*w*.17+s*k*w*.06*(big?2:1),py=ey+h*.04+k*h*.45;x.beginPath();x.moveTo(px,py-12);x.quadraticCurveTo(px+9,py+4,px,py+9);x.quadraticCurveTo(px-9,py+4,px,py-12);x.fill()}break}
  case 'sweat':{const k=cyc(t*.8,1);x.globalAlpha=1-k*.6;x.fillStyle='#7cd0ff';const px=w*.36,py=-h*.9+k*h*.2;x.beginPath();x.moveTo(px,py-16);x.quadraticCurveTo(px+12,py+6,px,py+12);x.quadraticCurveTo(px-12,py+6,px,py-16);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(px-3,py+3,4,Math.PI,Math.PI*1.6);x.stroke();break}

   <label>Camera <select id="sCam">${['None','Slow zoom in','Slow zoom out','Pan left','Pan right','Dramatic zoom','Shake'].map(n=>`<option ${n===sc.cam?'selected':''}>${n}</option>`).join('')}</select></label>
   <div class="row"><button class="btn" id="sL" aria-label="Move scene left">◀</button><button class="btn" id="sR" aria-label="Move scene right">▶</button><button class="btn" id="sDel">Delete scene</button></div>`;
  $('#sDur').onchange=e=>{sc.dur=+e.target.value;commit();renderStrip()};$('#sTr').onchange=e=>{sc.trans=e.target.value;commit()};$('#sCam').onchange=e=>{sc.cam=e.target.value;commit()};
  $('#sL').onclick=()=>moveScene(-1);$('#sR').onclick=()=>moveScene(1);$('#sDel').onclick=()=>{if(story.scenes.length<2){toast('A story needs at least one scene');return}story.scenes.splice(cur,1);cur=Math.max(0,cur-1);sel=null;commit();renderAll()};
  drawThumbs()}
function moveScene(d){const j=cur+d;if(j<0||j>=story.scenes.length)return;const L=story.scenes;[L[cur],L[j]]=[L[j],L[cur]];cur=j;commit();renderAll()}
function drawThumbs(){$$('#strip canvas').forEach((c,i)=>{const x=c.getContext('2d');x.setTransform(c.width/W,0,0,c.height/H,0,0);renderScene(x,i,.9,{editor:true})})}
$('#bNext').onclick=()=>{const sc=story.scenes[cur];const c=JSON.parse(JSON.stringify(sc));c.id=nid();c.trans='smooth';c.items.forEach(i=>{if(A[i.anim]&&A[i.anim].once&&A[i.anim].cat==='Enter')i.anim='Idle'});story.scenes.splice(cur+1,0,c);cur++;et=0;commit();renderAll();toast('Next moment: move things to show what happens')};
$('#bBlank').onclick=()=>{story.scenes.splice(cur+1,0,{id:nid(),bg:story.scenes[cur].bg,dur:4,trans:'fade',cam:'None',items:[]});cur++;sel=null;commit();renderAll()};

/* ===================== player ===================== */
const pcv=$('#pcv'),pctx=pcv.getContext('2d');let P=null;
function play(from=0,only=false){P={si:from,t:0,paused:false,only};$('#player').hidden=false;$('#pPause').textContent='Pause';sizePlayer();try{pcv.requestFullscreen&&innerWidth>700&&0}catch(e){}}
function sizePlayer(){const k=Math.min(innerWidth/W,(innerHeight-70)/H);pcv.style.width=W*k+'px';pcv.style.height=H*k+'px'}
addEventListener('resize',()=>{if(P)sizePlayer()});
function total(){return story.scenes.reduce((a,s)=>a+s.dur,0)}
function playerTick(dt){if(!P)return;if(!P.paused)P.t+=dt;const sc=story.scenes[P.si];if(P.t>=sc.dur){if(P.only||P.si>=story.scenes.length-1){P.t=sc.dur;P.paused=true;$('#pPause').textContent='Replay';P.end=true}else{P.t-=sc.dur;P.si++}}
  pctx.setTransform(pcv.width/W,0,0,pcv.height/H,0,0);renderScene(pctx,P.si,P.t);const before=story.scenes.slice(0,P.si).reduce((a,s)=>a+s.dur,0);$('#pprog i').style.width=((before+P.t)/total()*100)+'%';$('#pnum').textContent=`${P.si+1} / ${story.scenes.length}`}
$('#bPlay').onclick=()=>play(0);$('#bPlayScene').onclick=()=>play(cur,true);
$('#pPause').onclick=()=>{if(P.end){P.end=false;P.paused=false;P.si=P.only?P.si:0;P.t=0;$('#pPause').textContent='Pause';return}P.paused=!P.paused;$('#pPause').textContent=P.paused?'Play':'Pause'};
$('#pClose').onclick=()=>{$('#player').hidden=true;P=null;dirty=true};
addEventListener('keydown',e=>{if(e.key==='Escape'&&P)$('#pClose').onclick();if(e.key===' '&&P){e.preventDefault();$('#pPause').onclick()}});
pcv.onclick=()=>$('#pPause').onclick();

/* ===================== stories menu ===================== */
$('#bStories').onclick=openStories;
function openStories(){const all=store.get('ils-stories')||{};const keys=Object.keys(all).sort((a,b)=>all[b].at-all[a].at);const m=$('#menu'),c=$('#menuCard');
  c.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><h2>My stories</h2><button class="btn" id="mClose">Close</button></div>
   <p class="empty" style="margin:0">Stories save by themselves in this browser as you work.</p>
   <button class="btn pri" id="mNew">+ New story</button>
   ${keys.map(k=>`<div class="storyRow"><div><b>${esc(all[k].title||'Untitled')}</b><div class="empty" style="padding:0">${all[k].story.scenes.length} scenes · ${new Date(all[k].at).toLocaleDateString()}</div></div><div class="row"><button class="btn" data-open="${k}">Open</button><button class="btn" data-del="${k}" data-armed="0">Delete</button></div></div>`).join('')||'<p class="empty">No saved stories yet.</p>'}`;
  m.hidden=false;
  c.querySelector('#mClose').onclick=()=>m.hidden=true;m.onclick=e=>{if(e.target===m)m.hidden=true};
  c.querySelector('#mNew').onclick=()=>{saveNow();storyKey=null;story={title:'Untitled story',scenes:[{id:nid(),bg:{t:'i',v:'bg-golden-dunes.jpg'},dur:4,trans:'cut',cam:'None',items:[]}]};cur=0;sel=null;$('#title').value=story.title;hist=[];commit();renderAll();m.hidden=true;toast('New story')};
  c.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{saveNow();storyKey=b.dataset.open;story=all[storyKey].story;cur=0;sel=null;$('#title').value=story.title;hist=[];commit();renderAll();m.hidden=true});
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Tap again';b.classList.add('pri');return}delete all[b.dataset.del];store.set('ils-stories',all);if(storyKey===b.dataset.del)storyKey=null;openStories()})}

/* ===================== misc UI ===================== */
$('#bAnim').onclick=()=>{animOn=!animOn;$('#bAnim').classList.toggle('on',animOn);$('#bAnim').textContent=animOn?'Animations on':'Animations paused';dirty=true};
function mtab(n){$$('[data-mt]').forEach(b=>b.classList.toggle('on',b.dataset.mt===n));for(const id of['lib','insp','scenes'])$('#'+id).classList.toggle('mhide',id!==n&&innerWidth<=980)}
$$('[data-mt]').forEach(b=>b.onclick=()=>mtab(b.dataset.mt));
addEventListener('resize',()=>{if(innerWidth>980)for(const id of['lib','insp','scenes'])$('#'+id).classList.remove('mhide');else mtab(($$('[data-mt].on')[0]||{dataset:{mt:'lib'}}).dataset.mt)});
function renderAll(){renderLib();renderInsp();renderStrip();dirty=true;thumbDirty=true}

/* ===================== boot ===================== */
async function boot(){try{const r=await fetch('assets.json');const d=await r.json();ST=d.s;BGI=d.b}catch(e){toast('Could not load the sticker library')}
  const last=store.get('ils-last'),all=store.get('ils-stories')||{};
  if(last&&all[last]){storyKey=last;story=all[last].story}else story=sampleStory();
  $('#title').value=story.title;commit();hist=[hist[hist.length-1]];hi=0;updUndo();
  fitStage();renderAll();if(innerWidth<=980)mtab('lib');
  for(const sc of story.scenes){for(const it of sc.items){if(it.type==='s')img(it.src);if(it.hold)img(it.hold.src)}if(sc.bg.t==='i')img(sc.bg.v,'bg/')}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true;thumbDirty=true});
  requestAnimationFrame(frame)}
boot();
})();
</script>
