<title>مصر المهزوزة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@500;700;900&display=swap">
<style>
/* Full-screen 3D game. HUD floats on the edges; panels are sand-and-papyrus cards over the scene. Single warm "Cairo afternoon" look. */
:root{
  --bg:#1a120c; --card:#fff6e4; --card2:#f3e4c4; --ink:#2b1a0e; --muted:#7a5f45; --line:#d9c19a;
  --gold:#f2a516; --gold2:#ffcf4a; --nile:#1f8fbf; --red:#d8432e; --green:#3f9b4a; --glass:rgba(24,16,10,.62);
  --disp:'Lalezar','Cairo',system-ui,sans-serif; --body:'Cairo',system-ui,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5}
.pill{background:var(--glass);color:#fff;border-radius:14px;padding:5px 11px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap;font-variant-numeric:tabular-nums}
#top{top:calc(env(safe-area-inset-top,0px) + 8px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:flex-start;direction:rtl;pointer-events:none}
#top .grow{flex:1}
#top button{pointer-events:auto}
.ib{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(30,40,60,.55);display:flex;align-items:center;justify-content:center;padding:0;color:#fff;font-size:21px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#stars{color:var(--gold2);letter-spacing:2px}
#obj{top:calc(env(safe-area-inset-top,0px) + 60px);left:50%;transform:translateX(-50%);max-width:min(80vw,560px);background:var(--glass);color:#fff;border-radius:14px;padding:7px 14px;font-weight:700;font-size:14px;text-align:center;direction:rtl;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#joy{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:max(18px,env(safe-area-inset-left,0px));width:var(--js,128px);height:var(--js,128px);border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#pad{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:max(14px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(3,var(--bs,58px));grid-template-rows:repeat(3,var(--bs,58px));gap:8px;direction:ltr}
.rb{border:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(90,110,150,.75),rgba(25,32,50,.75));color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.7),0 3px 6px rgba(0,0,0,.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
.rb:active,.rb.on{filter:brightness(1.35)}
#bAct{grid-column:2/4;grid-row:1;border-radius:30px;font-size:17px;background:linear-gradient(#ffd25a,#f2a516);color:#3a2408;box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.8),0 3px 0 #9a6406;padding:0 12px}
#bAct.idle{opacity:0;pointer-events:none}
#bJump{grid-column:3;grid-row:3;background:radial-gradient(circle at 35% 30%,#7fd36a,#2f9a3a)}
#bGrab{grid-column:1;grid-row:1}
#bGrab.on{background:radial-gradient(circle at 35% 30%,#ffd25a,#e8901a)}
#bRun{grid-column:2;grid-row:3}
#bRag{grid-column:3;grid-row:2}
#bEmo{grid-column:2;grid-row:2}
#bRun{grid-column:2;grid-row:3}
#bCam{grid-column:1;grid-row:2}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:4}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border-radius:12px;padding:3px 9px;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);direction:rtl}
.bub::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.mark{position:absolute;transform:translate(-50%,-50%);font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.edge{position:absolute;width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:22px solid var(--gold2);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));transform-origin:50% 50%}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 104px);left:50%;transform:translateX(-50%);z-index:30;background:var(--card);color:var(--ink);border-radius:14px;padding:8px 16px;font-weight:900;direction:rtl;pointer-events:none;opacity:0;transition:opacity .25s;max-width:84vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#toast.on{opacity:1}
#banner{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);z-index:29;text-align:center;pointer-events:none;color:#fff;font-family:var(--disp);font-size:36px;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.4);opacity:0;transition:opacity .5s;direction:rtl}
#banner.on{opacity:1}
#banner small{display:block;font-family:var(--body);font-size:16px;font-weight:700}
#money{color:#ffe08a}
#float{position:fixed;inset:0;pointer-events:none;z-index:6}
.fl{position:absolute;font-weight:900;font-size:20px;color:#ffe08a;text-shadow:0 2px 0 rgba(0,0,0,.5);transform:translate(-50%,-50%);animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
/* panels */
#panel{position:fixed;inset:0;z-index:50;background:rgba(20,12,6,.55);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px))}
#card{background:var(--card);border-radius:20px;width:min(680px,100%);max-height:100%;overflow:auto;direction:rtl;padding:16px 18px;position:relative;box-sizing:border-box;box-shadow:0 14px 40px rgba(0,0,0,.4);border:3px solid var(--line)}
#card h2{font-family:var(--disp);font-weight:400;font-size:30px;margin:0 0 8px;color:#8a3c12;text-wrap:balance;padding-left:46px}
#card h3{font-family:var(--disp);font-weight:400;font-size:21px;margin:14px 0 6px;color:#8a3c12}
#card p{line-height:1.7;margin:6px 0}
.x{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:12px;border:none;background:var(--card2);font-size:18px;font-weight:900}
.btn{border:none;border-radius:14px;padding:11px 16px;font-size:16px;font-weight:900;background:var(--card2);color:var(--ink)}
.btn.pri{background:var(--gold);box-shadow:0 3px 0 #9a6406}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding-left:46px}
.tab{border:none;background:var(--card2);border-radius:20px;padding:7px 13px;font-weight:900;font-size:14px}
.tab.on{background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--card2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;border:2px solid transparent;text-align:right}
.tile b{font-size:16px}
.tile span{font-size:12px;color:var(--muted)}
.tile.lock{opacity:.5}
.tile.on{border-color:var(--gold)}
.set{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:10px 12px;align-items:center}
.set label{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:none;border-radius:10px;padding:7px 11px;background:var(--card2);font-weight:900;font-size:13px}
.seg button.on{background:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--gold)}
.big{font-family:var(--disp);font-size:46px;color:#8a3c12;text-align:center;margin:0;line-height:1.2}
.muted{color:var(--muted)}
#mapc{width:100%;border-radius:14px;background:#7cc6e6;touch-action:manipulation}
/* minigame */
#mini{position:fixed;left:50%;bottom:28%;transform:translateX(-50%);z-index:20;width:min(80vw,420px);background:var(--card);border-radius:16px;padding:12px;direction:rtl;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#mbar{position:relative;height:26px;border-radius:13px;background:#d7c9ae;overflow:hidden;margin:8px 0}
#mzone{position:absolute;top:0;bottom:0;background:var(--green)}
#mneedle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
#load{position:fixed;inset:0;z-index:60;background:linear-gradient(#f6d58a,#e9a34f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#5a2a0a;direction:rtl}
#load .veh{font-size:64px;animation:drive 1s linear infinite}
@keyframes drive{0%{transform:translateX(30px) rotate(-2deg)}50%{transform:translateX(-30px) rotate(2deg)}100%{transform:translateX(30px) rotate(-2deg)}}
#load b{font-family:var(--disp);font-size:34px;font-weight:400}
#fps{bottom:calc(env(safe-area-inset-bottom,0px) + 4px);left:50%;transform:translateX(-50%);color:#fff;font-size:11px;opacity:.7}
@media (prefers-reduced-motion:reduce){#load .veh,.fl{animation:none}}
</style>

  <button class="ib" id="bMap" aria-label="خريطة مصر"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></button>
  <button class="ib" id="bMenu" aria-label="الإعدادات"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
</div>
<div class="hud" id="obj" hidden></div>

  <button class="rb idle" id="bAct">تفاعل</button>
  <button class="rb" id="bGrab" aria-label="امسك"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V11M16 11V8.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L3.6 14a1.6 1.6 0 0 1 2.6-1.9L7 13.5"/></svg></button>
  <button class="rb" id="bEmo" aria-label="حركات"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="9"/><path d="M8 14.5s1.5 2.5 4 2.5 4-2.5 4-2.5"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3.4"/></svg></button>
  <button class="rb" id="bRag" aria-label="وقّع نفسك"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="2"/><path d="M12 4a8 8 0 1 1-7.4 5M12 7a5 5 0 1 1-4.6 3"/></svg></button>
  <button class="rb" id="bCam" aria-label="الكاميرا"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="rb" id="bRun" aria-label="جري"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:40% 0 auto;text-align:center;color:#fff">مش قادر أحمّل محرك الرسم. اتأكد إن النت شغال وافتح الصفحة تاني.</p>');return}
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a=0,b=1)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const angWrap=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};

/* ---------------- settings & save ---------------- */
const MOBILE=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)||Math.min(innerWidth,innerHeight)<600;
const DEF={q:MOBILE?'med':'high',shadow:true,npc:1,far:1,fps:false,cam:'third',dist:4.6,sens:1,inv:false,js:128,bs:58,autorun:true,vol:.8,sfx:.9,amb:.6,day:24,hints:true,voices:true,
  look:{skin:1,outfit:'tshirt',shirt:'#2f7fbf',pants:'#3a3a48',hair:'short',hairC:'#1d140c',hat:'none'}};
let SET=JSON.parse(JSON.stringify(DEF));
let G={money:150,region:'cairo',time:9,day:1,earned:0,prayers:0,fish:0,rides:0,deliv:0,steals:0,tours:0,harvest:0,visited:{}};
function saveAll(){try{localStorage.setItem('masr1',JSON.stringify({SET,G}))}catch(e){}}
function loadAll(){try{const d=JSON.parse(localStorage.getItem('masr1')||'null');if(d){SET=Object.assign(JSON.parse(JSON.stringify(DEF)),d.SET||{});SET.look=Object.assign({},DEF.look,(d.SET||{}).look||{});G=Object.assign(G,d.G||{});return true}}catch(e){}return false}
const QL={low:{pr:.65,sh:0,npc:9},med:{pr:1,sh:1024,npc:16},high:{pr:1.5,sh:2048,npc:24},ultra:{pr:2,sh:4096,npc:32}};

/* ---------------- renderer ---------------- */
const canvas=$('#c');
const R3=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
R3.outputEncoding=THREE.sRGBEncoding;R3.toneMapping=THREE.ACESFilmicToneMapping;R3.toneMappingExposure=1.0;R3.shadowMap.enabled=true;R3.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfe3ee,60,220);
const cam=new THREE.PerspectiveCamera(60,1,.08,900);
const hemi=new THREE.HemisphereLight(0xe8f4ff,0xb89a74,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d6,2.2);sun.castShadow=true;scene.add(sun,sun.target);
const amb=new THREE.AmbientLight(0xffffff,.08);scene.add(amb);
function applyQuality(){const q=QL[SET.q];R3.setPixelRatio(Math.min(window.devicePixelRatio||1,q.pr));R3.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  const on=SET.shadow&&q.sh>0;R3.shadowMap.enabled=on;sun.castShadow=on;if(on){sun.shadow.mapSize.set(q.sh,q.sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  const sc=sun.shadow.camera;const S2=SET.q==='ultra'?42:32;sc.left=-S2;sc.right=S2;sc.top=S2;sc.bottom=-S2;sc.near=1;sc.far=160;sc.updateProjectionMatrix();sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
  scene.traverse(o=>{if(o.material&&o.material.needsUpdate!==undefined)o.material.needsUpdate=true});
  document.documentElement.style.setProperty('--js',SET.js+'px');document.documentElement.style.setProperty('--bs',SET.bs+'px');$('#fps').hidden=!SET.fps}
addEventListener('resize',()=>{R3.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

/* ---------------- colors / materials ---------------- */
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const MC={};
function M(hex,rough=.85,metal=0,extra){const k=hex+rough+metal+(extra?JSON.stringify(Object.keys(extra)):'');if(!extra&&MC[k])return MC[k];const m=new THREE.MeshStandardMaterial(Object.assign({color:C(hex),roughness:rough,metalness:metal},extra||{}));if(!extra)MC[k]=m;return m}
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=Math.min(8,R3.capabilities.getMaxAnisotropy());if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
function noiseFill(x,w,h,base,vars,n=2200,sz=3){x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<n;i++){x.fillStyle=vars[i%vars.length];x.globalAlpha=.15+Math.random()*.25;const s=1+Math.random()*sz;x.fillRect(Math.random()*w,Math.random()*h,s,s)}x.globalAlpha=1}
const TEX={};

function propsTick(dt){for(const p of PROPS){if(p.held)continue;p.vy-=18*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;const g=groundAt(p.x,p.z,p.y+.3)+p.r;if(p.y<g){p.y=g;if(p.vy<-1.5&&p.kind==='ball')SFX.step();p.vy*=p.kind==='ball'?-.55:-.15;const f=p.kind==='ball'?.985:.9;p.vx*=f;p.vz*=f}
    const o={x:p.x,y:p.y,z:p.z};pushOutPt(o,p.r);if(o.x!==p.x)p.vx*=-.6;if(o.z!==p.z)p.vz*=-.6;p.x=o.x;p.z=o.z;p.x=clamp(p.x,-HS+1,HS-1);p.z=clamp(p.z,-HS+1,HS-1);
    for(const c of CHARS){if(c.hidden)continue;for(const i of[0,11,14]){const q=c.pts[i];const dx=p.x-q.x,dy=p.y-q.y,dz=p.z-q.z,d=Math.hypot(dx,dy,dz);const rr=p.r+(i?.12:.35);if(d<rr&&d>0){const qv=Math.hypot(q.x-q.px,q.z-q.pz)*60;const k=Math.max(2.5,qv*1.4);p.vx=dx/d*k;p.vz=dz/d*k;p.vy=Math.max(p.vy,p.kind==='ball'?2+qv*.3:.5);p.x=q.x+dx/d*rr;p.z=q.z+dz/d*rr}}}
    p.m.position.set(p.x,p.y,p.z);if(p.kind==='ball'){p.m.rotation.x+=p.vz*dt/p.r;p.m.rotation.z-=p.vx*dt/p.r}}}

function vehUpdate(v,dt){if(v.ai)return trafficTick(v,dt);const drv=v.driver===PL;const iv=drv?inputVec():{x:0,y:0};const max=v.kind==='jeep'?17:12.5;const thr=-iv.y;

function placeAIKeep(v){const d=v.dir;if(d===0)v.z=v.line+LN;else if(d===2)v.z=v.line-LN;else if(d===1)v.x=v.line-LN;else v.x=v.line+LN;v.yaw=[Math.PI/2,0,-Math.PI/2,Math.PI][d]}
