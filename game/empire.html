<title>كوّن إمبراطوريتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700;800&display=swap">
<style>
/* Layout: full-screen pixel city canvas; thin HUD on the edges; sheets & panels slide over it. Single dark "mud-brick at dusk" look. */
:root{
  --bg:#17120d; --panel:#251d15; --panel2:#31261b; --line:#4d3c2a;
  --ink:#f4e8d0; --muted:#b8a487; --gold:#e3a63b; --gold2:#ffd27a; --blood:#c9442f; --ok:#79b553;
  --disp:'Reem Kufi','Tajawal',system-ui,sans-serif; --body:'Tajawal',system-ui,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#arrow{position:fixed;z-index:4;width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:24px solid #3d8bff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));pointer-events:none}
.hud{position:fixed;z-index:5}
#stats{top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center;direction:rtl;flex-wrap:wrap;max-width:60vw}
.chip{background:rgba(23,18,13,.82);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;white-space:nowrap}
#flagMini{width:30px;height:20px;image-rendering:pixelated;border:1px solid var(--line);border-radius:2px;display:block}
#menuBtn{top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));width:44px;height:40px;border-radius:8px;background:rgba(23,18,13,.85);border:1px solid var(--line);font-size:22px}
#mini{top:calc(env(safe-area-inset-top,0px) + 58px);right:max(10px,env(safe-area-inset-right,0px));width:116px;height:84px;border:2px solid var(--line);border-radius:6px;image-rendering:pixelated;background:#000;cursor:pointer}
#mission{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);max-width:min(56vw,520px);background:rgba(23,18,13,.86);border:1px solid var(--line);border-right:3px solid var(--gold);border-radius:6px;padding:7px 12px;font-size:14px;direction:rtl;text-align:right;line-height:1.4}
#joy{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));width:120px;height:120px;border-radius:50%;background:rgba(244,232,208,.06);border:2px solid rgba(244,232,208,.16);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(244,232,208,.22);border:2px solid rgba(244,232,208,.35)}
#actBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 30px);right:max(18px,env(safe-area-inset-right,0px));min-width:96px;height:64px;padding:0 14px;border-radius:32px;background:var(--gold);color:#2a1a08;border:none;font-weight:800;font-size:17px;box-shadow:0 3px 0 #8a5a14}
#actBtn.idle{background:rgba(244,232,208,.12);color:var(--muted);box-shadow:none}
#bagBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 104px);right:max(26px,env(safe-area-inset-right,0px));width:50px;height:50px;border-radius:50%;background:rgba(23,18,13,.85);border:1px solid var(--line);font-size:22px}
#spdBtn{top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,env(safe-area-inset-right,0px));height:40px;padding:0 14px;border-radius:8px;background:rgba(23,18,13,.85);border:1px solid var(--line);font-weight:800;font-size:15px}
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:360px}
.fgrid button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:#0e0b08;font-size:20px}
.fgrid button.lk{opacity:.35}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);z-index:30;background:rgba(23,18,13,.92);border:1px solid var(--gold);color:var(--gold2);padding:8px 16px;border-radius:6px;font-weight:800;direction:rtl;pointer-events:none;opacity:0;transition:opacity .25s;max-width:80vw;text-align:center}
#toast.on{opacity:1}
/* dialog sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(transparent,rgba(10,7,4,.96) 26%);padding:40px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));direction:rtl}
#sheet .in{max-width:720px;margin:0 auto}
#who{font-family:var(--disp);color:var(--gold2);font-size:20px;margin-bottom:4px}
#sayT{font-size:17px;line-height:1.6;white-space:pre-line;min-height:2.6em}
#choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 16px;font-size:16px;font-weight:700}
.btn.pri{background:var(--gold);color:#2a1a08;border-color:var(--gold);box-shadow:0 3px 0 #8a5a14}
.btn.red{background:var(--blood);border-color:var(--blood)}
.btn:disabled{opacity:.45;cursor:default}
/* panels */
#panel{position:fixed;inset:0;z-index:50;background:rgba(8,6,4,.72);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
#card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);max-height:100%;overflow:auto;direction:rtl;padding:16px 18px;position:relative;box-sizing:border-box}
#card h2{font-family:var(--disp);color:var(--gold2);margin:0 0 10px;font-size:24px;text-wrap:balance}
#card h3{font-family:var(--disp);color:var(--gold);margin:14px 0 6px;font-size:17px}
#card p{line-height:1.6;margin:6px 0}
.x{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding-left:44px}
.tab{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-weight:700;font-size:14px}
.tab.on{background:var(--gold);color:#2a1a08;border-color:var(--gold)}
.tab.lock{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv b{color:var(--muted);font-weight:700}
.bar{height:10px;background:#0e0b08;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.job{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.job .t{font-weight:800}
.job .s{color:var(--muted);font-size:13px}
.path{display:grid;gap:6px}
.path div{display:flex;gap:8px;align-items:center;font-size:15px}
.muted{color:var(--muted)}
.big{font-family:var(--disp);font-size:34px;color:var(--gold2);margin:0;text-align:center;text-wrap:balance}
/* flag editor */
#flagEd{display:grid;gap:10px}
#fcv{width:min(100%,420px,calc(46vh * 1.5));aspect-ratio:3/2;image-rendering:pixelated;border:2px solid var(--line);border-radius:4px;touch-action:none;background:#000;justify-self:center}
.pal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sw{width:34px;height:34px;border-radius:6px;border:2px solid transparent}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.tool.on{background:var(--gold);color:#2a1a08}
input[type=text]{background:#0e0b08;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;font-family:var(--body);font-size:16px;width:100%;box-sizing:border-box;direction:rtl}
/* build mode */
#build{position:fixed;inset:0;z-index:20;background:#120e0a;display:grid;grid-template-rows:auto 1fr auto;direction:rtl;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#btop{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#bpThumb{height:56px;border:2px solid var(--gold);border-radius:4px;cursor:zoom-in;background:#000}
#btitle{flex:1;min-width:120px}
#btitle b{display:block;font-family:var(--disp);color:var(--gold2);font-size:16px}
#btitle span{font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);border:none;padding:9px 14px;font-weight:800;font-size:15px}
.seg button.on{background:var(--gold);color:#2a1a08}
#bmatch{text-align:center;min-width:64px}
#bmatch b{display:block;font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums}
#bmatch span{font-size:11px;color:var(--muted)}
#bwrap{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
#bgrid{touch-action:none}
#bpal{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
.mat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;font-weight:700;min-width:62px}
.mat canvas{width:30px;height:30px;border-radius:3px}
.mat.on{border-color:var(--gold);background:#3e2f1f}
#bpBig canvas{width:100%;border:2px solid var(--line);border-radius:4px;background:#000}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols div{display:grid;gap:4px;text-align:center;font-weight:700}
@media (max-width:520px){.cols{grid-template-columns:1fr}#mission{max-width:70vw;font-size:13px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:40% 0 auto;text-align:center;color:#f4e8d0">مش قادر أحمّل محرك الرسم. اتأكد إن النت شغال وافتح الصفحة تاني.</p>');return}
'use strict';
const $=s=>document.querySelector(s);
/* ---------------- utils ---------------- */
let seedR=1;function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));const pick=a=>a[Math.floor(R()*a.length)];
const rnd=Math.random;const rpick=a=>a[Math.floor(rnd()*a.length)];const rri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- data ---------------- */
const EMP=[
  {n:'مملكة النيل',c:'#2f7fbf',k:'الملك أمنحتب',city:'طيبة'},
  {n:'إمبراطورية الرمال',c:'#d99a2b',k:'الإمبراطور صخر',city:'وادي الذهب'},
  {n:'سلطنة الجبل',c:'#7b5aa8',k:'السلطان برقوق',city:'قلعة الصخر'},
  {n:'مملكة البحر',c:'#2f9e8a',k:'الملكة نفرتاري',city:'مرسى الريح'}
];
const PAL=['#f4f0e6','#151515','#c62f2f','#e3a63b','#f2d54a','#3f8f3a','#2f7fbf','#1f3f80','#7b5aa8','#8b5a2b','#e07ab0','#7fd0e0'];
const NAMES=['حسن','سعيد','مرزوق','كريمة','زينب','عتمان','فتحي','نعيمة','صابر','بهية','رمضان','عزيزة','شلبي','وهدان','سنية','فرج'];
const ROLES=['تاجر','فلاح','ظابط','صاحب فرن','حدّاد','كاهن','صياد','نجّار'];
const TYPES=[['بيت صغير',0],['دكان',0],['مخزن غلال',1],['فرن',1],['بيت عيلة',2],['برج حراسة',2],['بيت كبير',3],['قاعة السوق',3]];
const ARANKS=[[0,'عسكري'],[30,'عريف'],[80,'رقيب'],[150,'ملازم'],[250,'نقيب'],[380,'رائد'],[540,'عقيد'],[750,'لواء']];
const SLOTS=[0,0,0,6,10,14,18,18];
const UT={inf:{n:'مشاة',e:'🗡️',hp:30,atk:6,range:.9,spd:1.4,rate:.9,cost:20},arc:{n:'رماة',e:'🏹',hp:18,atk:5,range:6,spd:1.2,rate:1.4,cost:30},cav:{n:'فرسان',e:'🐎',hp:42,atk:8,range:1,spd:2.6,rate:1,cost:50}};
const RANKS=[[0,'صبي بنّاء'],[25,'عامل بناء'],[70,'بنّاء ماهر'],[130,'أسطى'],[180,'معلّم']];
const MATS={
  brick:{n:'طوب أحمر',c:'#a4462f',l:'out',k:'wall'}, lime:{n:'حجر جيري',c:'#d6c08c',l:'out',k:'wall'},
  granite:{n:'جرانيت',c:'#77707c',l:'out',k:'wall'}, marble:{n:'رخام',c:'#ebe6dc',l:'out',k:'wall'},
  wood:{n:'خشب',c:'#8b5a2b',l:'out',k:'wall'}, door:{n:'باب',c:'#4f2c12',l:'out',k:'door'},
  window:{n:'شباك',c:'#86c9dc',l:'out',k:'win'}, rtile:{n:'سقف قرميد',c:'#b5532f',l:'out',k:'roof'},
  rwood:{n:'سقف خشب',c:'#6b4724',l:'out',k:'roof'}, rstone:{n:'سقف حجر',c:'#8f8b80',l:'out',k:'roof'},
  fwood:{n:'أرضية خشب',c:'#a9763f',l:'in'}, ftile:{n:'بلاط',c:'#c4bba5',l:'in'},
  fmarble:{n:'أرضية رخام',c:'#efe9de',l:'in'}, carpet:{n:'سجادة',c:'#8d2b3b',l:'in'},
  iwall:{n:'حيطة جوه',c:'#4e3e30',l:'in'}, idoor:{n:'باب جوه',c:'#7b4b22',l:'in'}
};
const OUTM=Object.keys(MATS).filter(k=>MATS[k].l==='out'),INM=Object.keys(MATS).filter(k=>MATS[k].l==='in');

/* ---------------- save ---------------- */
let S=null;
function newSave(){return{v:1,seed:(Math.random()*1e9)|0,name:'',flag:null,emp:rri(0,3),money:20,rep:0,hp:100,t:30,offers:[],active:null,builds:{},done:0,kingCalled:false,title:'',sfx:true,tts:true,nid:1,nextOffer:4,px:0,py:0,tip:false,army:newArmy(),lastDay:0}}
function newArmy(){return{in:false,rank:0,xp:0,troops:{inf:0,arc:0,cav:0},form:Array(18).fill(null),mission:null,wins:0,done:false}}
function save(){try{localStorage.setItem('empire1',JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('empire1')||'null');if(s&&s.v===1&&s.flag){if(!s.army)s.army=newArmy();if(s.lastDay==null)s.lastDay=Math.floor(s.t/240);return s}}catch(e){}return null}

/* ---------------- audio ---------------- */
let AC=null;function aInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f,d=.08,type='square',v=.06,f2){if(!AC||!S||!S.sfx)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={tap:()=>tone(520,.04,'square',.03),place:()=>{tone(180,.05,'square',.05);tone(120,.06,'triangle',.05)},coin:()=>{tone(988,.07,'square',.05);setTimeout(()=>tone(1318,.12,'square',.05),70)},ui:()=>tone(660,.05,'triangle',.05),bad:()=>tone(160,.25,'sawtooth',.05,90),fan:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.05),i*120))}};
function speak(t){if(!S||!S.tts||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[«»()…]/g,' '));u.lang='ar-EG';const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));if(v)u.voice=v;u.pitch=.7;u.rate=.92;speechSynthesis.speak(u)}catch(e){}}

/* ---------------- material drawing ---------------- */
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>clamp(Math.round(k<0?v*(1+k):v+(255-v)*k),0,255);return`rgb(${f(r)},${f(g)},${f(b)})`}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawMat(g,key,x,y,s,cx=0,cy=0){
  const m=MATS[key];if(!m)return;const p=Math.max(1,s*.04),r=s*.14,X=x+p,Y=y+p,W=s-2*p;
  g.save();rrect(g,X,Y,W,W,r);const gr=g.createLinearGradient(0,Y,0,Y+W);gr.addColorStop(0,shade(m.c,.18));gr.addColorStop(1,shade(m.c,-.14));g.fillStyle=gr;g.fill();g.clip();
  const d=shade(m.c,-.3),l=shade(m.c,.35);g.lineWidth=Math.max(1,s*.045);g.lineCap='round';g.strokeStyle=d;

const ROADX=[8,22,36,50,64],ROADY=[6,18,30,42];

  for(const ry of ROADY)for(let x=0;x<MW;x++)for(let k=0;k<2;k++)setT(x,ry+k,tAt(x,ry+k)===T_WATER?T_BRIDGE:T_ROAD);

      palace={x,y,w,h,gx:x+4,door:{x:x+5,y:y+5}};

      for(let yy=y+1;yy<y+h-1;yy++){objs.push({k:'pwall',x,y:yy,w:1,h:1});objs.push({k:'pwall',x:x+w-1,y:yy,w:1,h:1})}

      objs.push({k:'banner',x:x+3,y:y+h-1,w:1,h:1,solid:false},{k:'banner',x:x+6,y:y+h-1,w:1,h:1,solid:false});

      const cs=['#c62f2f','#2f7fbf','#3f8f3a','#e3a63b'];[[x+1,y+1],[x+5,y+1],[x+1,y+4],[x+5,y+4]].forEach(([a,b],i)=>objs.push({k:'stall',x:a,y:b,w:3,h:1,c:cs[i]}));

      dummies=[[x+7,y+2],[x+8,y+4],[x+7,y+6],[x+2,y+6]].map(([a,b])=>{const o={k:'dummy',x:a,y:b,w:1,h:1,hit:0};objs.push(o);return o});

function inBlock(x,y){for(const bx of BX)for(const by of[...BY,44])if(x>=bx&&x<bx+12&&y>=by&&y<by+(by===44?8:10))return true;return false}

function npcTick(n,dt){

function genBP(w,h,lvl){
  const walls=['brick','lime','granite','marble','wood'],roofs=['rtile','rwood','rstone'],floors=['fwood','ftile','fmarble','carpet'];
  const wall=rpick(walls),wall2=lvl>=2&&rnd()<.75?rpick(walls.filter(x=>x!==wall)):null,roof=rpick(roofs),roof2=lvl>=3?rpick(roofs.filter(x=>x!==roof)):null;

    out.push(per?(corner&&wall2?wall2:wall):(roof2&&y===(h>>1)?roof2:roof));inn.push(per?null:fA)}

  for(let x=2;x<w-2;x+=3)out[I(x,0)]='window';
  for(let x=1;x<w-1;x++)if(Math.abs(x-dx)>1&&(x%3===1)&&x!==1&&x!==w-2)out[I(x,h-1)]='window';
  if(h>=5){out[I(0,h>>1)]='window';out[I(w-1,h>>1)]='window'}
  const iw=w-2,ih=h-2;
  if(lvl>=1&&iw>=4){const vx=1+(iw>>1);for(let y=1;y<h-1;y++)inn[I(vx,y)]='iwall';inn[I(vx,rri(1,h-2))]='idoor';for(let y=1;y<h-1;y++)for(let x=vx+1;x<w-1;x++)inn[I(x,y)]=fB;
    if(lvl>=3&&ih>=4){const hy=1+(ih>>1);for(let x=1;x<vx;x++)inn[I(x,hy)]='iwall';inn[I(rri(1,vx-1),hy)]='idoor';for(let y=hy+1;y<h-1;y++)for(let x=1;x<vx;x++)inn[I(x,y)]=fC}}
  return{w,h,out,inn};
}

const BW=22,BH=13;let B=null;
function startBattle(kind,go){

  if(kind==='bandit'){eName='قطاع الطرق';eColor='#5a4a3a';const n=5+rk*2;const ef=Array(18).fill(null);for(let i=0;i<Math.min(18,n);i++)ef[i]=i<Math.ceil(n*.6)?'inf':'arc';
    if(rk<3||A.form.filter((f,i)=>f&&i<SLOTS[rk]).length<4){placeForm(0,['inf','inf','inf','inf','inf',null,'inf','arc','arc','arc',null,null,null,null,null,null,null,null]);units.forEach(u=>u.preset=true)}else placeForm(0,A.form.slice(0,SLOTS[rk]));placeForm(1,ef)}
  else{const others=EMP.map((e,i)=>i).filter(i=>i!==S.emp),ei=rpick(others);eName=EMP[ei].n;eColor=EMP[ei].c;const n=Math.min(18,5+(rk-3)*3);const ef=Array(18).fill(null);
    for(let i=0;i<n;i++)ef[i]=i<6?(rk>=5&&(i===0||i===5)?'cav':'inf'):i<12?(rk>=4&&rnd()<.35?'cav':'inf'):'arc';placeForm(0,A.form.slice(0,SLOTS[rk]));placeForm(1,ef)}
  if(go)add(0,'inf',3.2,BH/2,{isP:true,hp:Math.max(20,S.hp),max:100,skin:P.skin,hair:P.hair});
  B={kind,units,arrows:[],t:0,eName,eColor,go,speed:1,over:false,sa:units.filter(u=>!u.team).length,se:units.filter(u=>u.team).length,msgT:0};
  mode='battle';showHUD(false);$('#mission').hidden=false;$('#spdBtn').hidden=false;$('#spdBtn').textContent='⏩ سرّع';if(go){$('#joy').hidden=false;actBtn.hidden=false;actBtn.textContent='اضرب ⚔️';actBtn.classList.remove('idle')}
  buildBattle3();SFX.fan();toast(`⚔️ المعركة بدأت ضد ${eName}!`,2400);updBattleBar();
}
function updBattleBar(){if(!B)return;const a=B.units.filter(u=>!u.team&&u.hp>0).length,e=B.units.filter(u=>u.team&&u.hp>0).length;const p=B.units.find(u=>u.isP);$('#mission').innerHTML=`⚔️ جيشنا <b>${ar(a)}</b> × <b>${ar(e)}</b> ${B.eName}${p?` · ❤️ ${ar(Math.max(0,Math.round(p.hp)))}`:''} · ${ar(Math.max(0,Math.ceil(120-B.t)))} ث`}
function bdmg(t,a){if(t.hp<=0)return;t.hp-=a;t.hit=.15;if(t.hp<=0){t.hp=0;tone(140,.15,'sawtooth',.04,70);if(t.isP){SFX.bad();toast('اتصابت! وقعت في المعركة… الجيش بيكمّل من غيرك',3000);$('#joy').hidden=true;actBtn.hidden=true}}}
function pAttack(){if(!B||B.over)return;const p=B.units.find(u=>u.isP&&u.hp>0);if(!p||p.cd>0)return;p.cd=.45;p.sw=.2;SFX.tap();let t=null,bd=1.3;for(const v of B.units)if(v.team&&v.hp>0){const d=Math.hypot(v.x-p.x,v.y-p.y);if(d<bd){bd=d;t=v}}if(t){bdmg(t,10);tone(220,.06,'square',.05)}}
function battleTick(dt0){
  if(!B||B.over)return;const dt=dt0*B.speed;B.t+=dt;
  for(const u of B.units){if(u.hp<=0)continue;if(u.sw>0)u.sw-=dt;if(u.hit>0)u.hit-=dt;u.cd-=dt;
    if(u.isP){let mx=jx,my=jy;if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;const m=Math.hypot(mx,my);u.mov=false;if(m>.15){if(m>1){mx/=m;my/=m}u.x=clamp(u.x+mx*3*dt0,.5,BW-.5);u.y=clamp(u.y+my*3*dt0,.5,BH-.5);u.mov=true;u.walk+=dt0*9;u.dir=Math.abs(mx)>Math.abs(my)?(mx>0?3:2):(my>0?0:1)}continue}
    let t=null,bd=1e9;for(const v of B.units)if(v.team!==u.team&&v.hp>0){const d=Math.hypot(v.x-u.x,v.y-u.y)-(v.isP?.4:0);if(d<bd){bd=d;t=v}}
    if(!t){u.mov=false;continue}const T=UT[u.type];
    if(bd>T.range){let dx=(t.x-u.x)/bd,dy=(t.y-u.y)/bd;for(const v of B.units)if(v!==u&&v.hp>0){const ex=u.x-v.x,ey=u.y-v.y,ed=Math.hypot(ex,ey);if(ed<.65&&ed>0){dx+=ex/ed*.7;dy+=ey/ed*.7}}
      const m=Math.hypot(dx,dy)||1,sp=T.spd*dt;u.x=clamp(u.x+dx/m*sp,.5,BW-.5);u.y=clamp(u.y+dy/m*sp,.5,BH-.5);u.mov=true;u.walk+=dt*8;u.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?0:1)}
    else{u.mov=false;u.dir=t.x>u.x?3:2;if(u.cd<=0){u.cd=T.rate*(.85+rnd()*.3);u.sw=.2;if(u.type==='arc'){B.arrows.push({x:u.x,y:u.y,t,d:T.atk});if(rnd()<.3)tone(900,.04,'triangle',.02,500)}else bdmg(t,T.atk*(.8+rnd()*.4))}}}
  for(const a of B.arrows){const dx=a.t.x-a.x,dy=a.t.y-a.y,d=Math.hypot(dx,dy);if(d<.35){a.done=1;bdmg(a.t,a.d)}else{const s=Math.min(d,10*dt);a.x+=dx/d*s;a.y+=dy/d*s;a.ang=Math.atan2(dy,dx)}if(a.t.hp<=0&&d>=.35)a.done=1}
  B.arrows=B.arrows.filter(a=>{if(a.done&&a.m&&a.m.parent)a.m.parent.remove(a.m);return!a.done});
  B.msgT-=dt0;if(B.msgT<=0){B.msgT=.25;updBattleBar()}
  const a=B.units.filter(u=>!u.team&&u.hp>0).length,e=B.units.filter(u=>u.team&&u.hp>0).length;
  if(a===0||e===0||B.t>=120)endBattle(e===0||(B.t>=120&&a>e));
}
async function endBattle(win){

  const lost={inf:0,arc:0,cav:0};for(const u of B.units)if(!u.team&&!u.isP&&!u.preset&&u.hp<=0&&u.slot!=null)lost[u.type]++;

  else if(curTab==='jobs'){const j=S.active;body=`<h3>الشغل الحالي</h3>${j?`<div class="job"><div><div class="t">${j.type} لـ${j.client}</div><div class="s">${j.role} · الأرض ${ar(j.plot+1)} · ${ar(j.bp.w)}×${ar(j.bp.h)} · ${ar(j.pay)}💰</div></div></div>`:'<p class="muted">مفيش. اختار طلب من تحت.</p>'}
    <h3>الطلبات المتاحة</h3>${S.offers.length?S.offers.map(o=>`<div class="job"><div><div class="t">${o.rebuild?'هدّ وابني ':''}${o.type} لـ${o.client}</div><div class="s">${o.role} · الأرض ${ar(o.plot+1)} · ${ar(o.bp.w)}×${ar(o.bp.h)} · ${['سهل','متوسط','صعب','صعب جدًا'][Math.min(3,o.lvl)]}</div></div><div class="row"><b style="color:var(--gold2)">${ar(o.pay)}💰</b><button class="btn pri" data-a="${o.id}" ${j?'disabled':''}>اقبل</button></div></div>`).join(''):'<p class="muted">مفيش طلبات دلوقتي. استنى شوية.</p>'}`}
  else if(curTab==='flag')body=`<p>ده علمك. هيظهر على كل مبنى تبنيه، ولما تبقى حاكم هيبقى علم إمبراطوريتك.</p><canvas id="fl" width="12" height="8" style="width:180px;height:120px;image-rendering:pixelated;border:2px solid var(--line)"></canvas><div class="row" style="margin-top:10px"><button class="btn pri" id="edf">✏️ عدّل العلم</button></div>`;
  else if(curTab==='set')body=`<div class="path"><div><button class="btn" id="tS">${S.sfx?'🔊':'🔇'} أصوات اللعبة: ${S.sfx?'شغالة':'مقفولة'}</button></div><div><button class="btn" id="tT">${S.tts?'🗣️':'🤐'} صوت الملوك: ${S.tts?'شغال':'مقفول'}</button></div></div><h3>مسح اللعبة</h3><p class="muted">هتبدأ من الأول: علم جديد ومولد جديد.</p><button class="btn red" id="del">🗑️ امسح وابدأ من الأول</button>`;
  else if(curTab==='army')body=armyTab();
  else body=`<p class="big">🔒</p><p style="text-align:center">لما تبقى الحاكم: تبني وترتّب المملكة، وتعلن حروب، وتحتل أراضي.</p>`;
  return panel(`<button class="x" aria-label="اقفل">✖</button><div class="tabs">${tabs.map(([k,n])=>`<button class="tab${k===curTab?' on':''}${(k==='army'&&!S.army.in)||k==='king'?' lock':''}" data-t="${k}">${n}</button>`).join('')}</div>${body}`,(c,close)=>{
    c.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;SFX.ui();close();showMenu()});
    const fl=c.querySelector('#fl');if(fl)drawFlag(fl,S.flag);
    c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const o=S.offers.find(o=>o.id==b.dataset.a);if(o&&acceptJob(o)){close()}});
    const ed=c.querySelector('#edf');if(ed)ed.onclick=async()=>{close();await flagEditor(false);curTab='flag';showMenu()};
    const tS=c.querySelector('#tS');if(tS)tS.onclick=()=>{S.sfx=!S.sfx;save();close();showMenu()};
    const tT=c.querySelector('#tT');if(tT)tT.onclick=()=>{S.tts=!S.tts;save();close();showMenu()};
    armySetup(c,close);
    const del=c.querySelector('#del');if(del)del.onclick=()=>{if(del.dataset.k){try{localStorage.removeItem('empire1')}catch(e){}location.reload()}else{del.dataset.k=1;del.textContent='⚠️ متأكد؟ دوس تاني عشان تمسح'}};
  })}
$('#menuBtn').onclick=()=>{if(mode==='play'){aInit();openTab(curTab==='king'?'me':curTab)}};
$('#bagBtn').onclick=()=>{if(mode!=='play')return;aInit();SFX.ui();const mine=Object.values(S.builds);
  panel(`<button class="x" aria-label="اقفل">✖</button><h2>🎒 الشنطة</h2><div class="kv"><b>💰 فلوس</b><span>${ar(S.money)}</span><b>🧱 مسطرين وميزان</b><span>عدة البنّاء</span><b>📐 رسومات</b><span>${S.active?'رسمة '+S.active.type:'مفيش'}</span></div><h3>المباني اللي بنيتها (${ar(mine.length)})</h3>${mine.length?mine.map(b=>`<div class="job"><div><div class="t">${b.royal?'👑 جناح القصر':'مبنى'} لـ${b.by}</div><div class="s">${ar(b.w)}×${ar(b.h)}</div></div></div>`).join(''):'<p class="muted">لسه مبنيتش حاجة.</p>'}`)};
$('#mini').onclick=()=>{if(mode!=='play')return;SFX.ui();let tab='city';
  const show=()=>panel(`<button class="x" aria-label="اقفل">✖</button><div class="tabs"><button class="tab${tab==='city'?' on':''}" data-m="city">🏙️ المدينة</button><button class="tab${tab==='world'?' on':''}" data-m="world">🌍 العالم</button></div><canvas id="bm" style="width:100%;image-rendering:pixelated;border:2px solid var(--line);border-radius:4px"></canvas><p class="muted" id="lg"></p>`,(c,close)=>{
    c.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{tab=b.dataset.m;close();show()});const m=c.querySelector('#bm');
    if(tab==='city'){m.width=MW*4;m.height=MH*4;drawMap(m.getContext('2d'),4,1);c.querySelector('#lg').textContent=`مدينة ${EMP[S.emp].city} · ⬜ انت · 🟨 هدفك · الأراضي البني: أراضي البناء`}
    else{drawWorld(m);c.querySelector('#lg').textContent='٤ إمبراطوريات. النجمة: مدينتك. الحروب والاحتلال هيفتحوا لما تبقى حاكم.'}});show()};
function drawWorld(c){const W=96,H=60;c.width=W*4;c.height=H*4;const x=c.getContext('2d');x.imageSmoothingEnabled=false;const r=mulberry(S.seed+7);const seeds=EMP.map((e,i)=>[10+r()*76,8+r()*44]);
  for(let y=0;y<H;y++)for(let i=0;i<W;i++){const sea=Math.sin(i/9)+Math.cos(y/7)+Math.sin((i+y)/13)<-1.2||i<3||y<2||i>W-4||y>H-3;if(sea){x.fillStyle=(i+y)%7?'#23506e':'#2a5d7e';x.fillRect(i*4,y*4,4,4);continue}let b=0,bd=1e9;seeds.forEach((s,k)=>{const d=Math.hypot(s[0]-i,s[1]-y)+hash(i,y)*3;if(d<bd){bd=d;b=k}});x.fillStyle=shade(EMP[b].c,-.15+hash(i>>1,y>>1)*.1);x.fillRect(i*4,y*4,4,4)}
  x.font='bold 15px Tajawal, sans-serif';x.textAlign='center';EMP.forEach((e,k)=>{const[sx,sy]=seeds[k];x.fillStyle='rgba(0,0,0,.55)';x.fillText(e.n,sx*4+1,sy*4+1);x.fillStyle='#fff';x.fillText(e.n,sx*4,sy*4);if(k===S.emp){x.fillStyle='#ffd27a';x.font='bold 22px sans-serif';x.fillText('★',sx*4,sy*4+22);x.font='bold 15px Tajawal, sans-serif'}})}

/* ---------------- flag editor ---------------- */
function flagEditor(first){return new Promise(res=>{let col=2,tool='brush';const F=S.flag?S.flag.slice():defaultFlag();
  panel(`<h2>${first?'ارسم علمك':'عدّل علمك'}</h2><p class="muted">اختار لون ودوس على المربعات. العلم ده هيبقى علامتك، ولما تحكم هيبقى علم إمبراطوريتك.</p><div id="flagEd">${first?'<input type="text" id="nm" maxlength="18" placeholder="اسمك… (مثلًا: محمد)" aria-label="اسمك">':''}<canvas id="fcv" width="12" height="8"></canvas><div class="pal">${PAL.map((c,i)=>`<button class="sw${i===col?' on':''}" data-c="${i}" style="background:${c}" aria-label="لون ${i+1}"></button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn tool on" data-tl="brush">🖌️ فرشاة</button><button class="btn tool" data-tl="fill">🪣 جردل</button><button class="btn" id="rnd">🎲 عشوائي</button></div>
    <div class="row" style="justify-content:center"><button class="btn pri" id="ok">${first?'يلا نتولد ✨':'احفظ'}</button>${first?'':'<button class="btn" id="cn">إلغاء</button>'}</div></div>`,(c,close)=>{
    const fc=c.querySelector('#fcv'),fx=fc.getContext('2d');const draw=()=>{for(let i=0;i<96;i++){fx.fillStyle=PAL[F[i]];fx.fillRect(i%12,i/12|0,1,1)}};draw();
    if(first&&S.name)c.querySelector('#nm').value=S.name;
    let down=false;const at=e=>{const r=fc.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*12),y=Math.floor((e.clientY-r.top)/r.height*8);if(x<0||y<0||x>11||y>7)return;const i=y*12+x;
      if(tool==='fill'){const t=F[i];if(t===col)return;const st=[i];while(st.length){const k=st.pop();if(F[k]!==t)continue;F[k]=col;const kx=k%12,ky=k/12|0;if(kx>0)st.push(k-1);if(kx<11)st.push(k+1);if(ky>0)st.push(k-12);if(ky<7)st.push(k+12)}SFX.place()}else if(F[i]!==col){F[i]=col;SFX.tap()}draw()};
    fc.addEventListener('pointerdown',e=>{e.preventDefault();aInit();fc.setPointerCapture(e.pointerId);down=true;at(e)});fc.addEventListener('pointermove',e=>{if(down&&tool==='brush')at(e)});fc.addEventListener('pointerup',()=>down=false);
    c.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{col=+b.dataset.c;c.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===b));SFX.tap()});
    c.querySelectorAll('[data-tl]').forEach(b=>b.onclick=()=>{tool=b.dataset.tl;c.querySelectorAll('[data-tl]').forEach(s=>s.classList.toggle('on',s===b));SFX.tap()});
    c.querySelector('#rnd').onclick=()=>{const r=randomFlag();for(let i=0;i<96;i++)F[i]=r[i];draw();SFX.ui()};
    c.querySelector('#ok').onclick=()=>{if(first){const n=c.querySelector('#nm').value.trim();if(!n){c.querySelector('#nm').focus();c.querySelector('#nm').placeholder='اكتب اسمك الأول 👆';return}S.name=n}S.flag=F.slice();save();SFX.ui();close();res()};
    const cn=c.querySelector('#cn');if(cn)cn.onclick=()=>{close();res()};
  })})}
function defaultFlag(){const F=[];for(let i=0;i<96;i++){const y=i/12|0;F.push(y<3?2:y<5?0:1)}return F}
function randomFlag(){const a=rri(0,11);let b=rri(0,11);if(b===a)b=(a+3)%12;let c2=rri(0,11);const t=rri(0,3),F=[];for(let i=0;i<96;i++){const x=i%12,y=i/12|0;let v=a;if(t===0)v=y<3?a:y<5?b:c2;else if(t===1)v=x<4?a:x<8?b:c2;else if(t===2)v=(x>=4&&x<8)||(y>=3&&y<5)?b:a;else v=Math.hypot(x-5.5,y-3.5)<2.6?b:a;F.push(v)}return F}

/* ---------------- input ---------------- */
let mode='title';const keys={};let jx=0,jy=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if((e.key==='e'||e.key===' '||e.key==='Enter')&&(mode==='play'||mode==='battle')){e.preventDefault();mode==='battle'?pAttack():act()}if(e.key==='Escape'&&mode==='build')closeBuild()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=$('#joy'),knob=$('#knob');let jid=null;
function jmove(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=r.width/2-10,d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/m;jy=dy/m}
joy.addEventListener('pointerdown',e=>{aInit();jid=e.pointerId;joy.setPointerCapture(jid);jmove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
const jend=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;knob.style.transform=''};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
actBtn.onclick=()=>{aInit();mode==='battle'?pAttack():act()};
$('#spdBtn').onclick=()=>{if(!B)return;B.speed=B.speed===1?3:1;$('#spdBtn').textContent=B.speed===1?'⏩ سرّع':'▶️ عادي';SFX.ui()};

/* ---------------- loop ---------------- */
let last=performance.now(),saveT=0,miniT=0,actT=0;
function update(dt){
  S.t+=dt;
  let mx=jx,my=jy;if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;
  const m=Math.hypot(mx,my);P.mov=false;
  if(m>.15){if(m>1){mx/=m;my/=m}const sp=4.2*dt;const nx=P.x+mx*sp,ny=P.y+my*sp;if(!blocked(nx,P.y))P.x=nx;if(!blocked(P.x,ny))P.y=ny;P.mov=true;P.walk+=dt*9;P.dir=Math.abs(mx)>Math.abs(my)?(mx>0?3:2):(my>0?0:1)}
  for(const n of npcs)npcTick(n,dt);
  S.nextOffer-=dt;if(S.nextOffer<=0){S.nextOffer=S.offers.length<3?rri(25,45):10;if(S.offers.length<3&&newOffer()){toast('📜 فيه طلب بناء جديد!');updMission()}}
  if(S.rep>=180&&!S.kingCalled&&!S.title){S.kingCalled=true;save();SFX.fan();setTimeout(()=>{const e=EMP[S.emp];sayChoice('رسول الملك 📯',`يا ${S.name}! ${e.k} سمع عن شغلك… وعايزك في القصر حالًا.`);speak(`${e.k} عايزك في القصر`)},300);updMission()}
  for(const o of dummies)if(o.hit>0)o.hit-=dt;
  if(S.hp<100)S.hp=Math.min(100,S.hp+dt*.35);
  const day=Math.floor(S.t/240);if(day!==S.lastDay){S.lastDay=day;if(S.army.in){const pay=5+S.army.rank*6;S.money+=pay;toast(`💰 مرتب الجيش: ${ar(pay)}`);hud()}}
  const am=S.army.mission;if(am){if(am.t!=null){am.t-=dt;if(am.t<=0){S.army.mission=null;SFX.bad();toast('⏰ المهمة فشلت… الوقت خلص');updMission()}}
    if(am.k==='patrol'&&S.army.mission){const q=am.pts[am.i];if(Math.hypot(q[0]-P.x,q[1]-P.y)<1.4){am.i++;SFX.coin();if(am.i>=am.pts.length){S.army.mission=null;missionDone(18,'الدورية خلصت')}else toast(`✔️ علامة ${ar(am.i)} من ٣`)}}
    if(Math.floor(S.t*2)!==Math.floor((S.t-dt)*2))updMission()}
  actT-=dt;if(actT<=0){actT=.15;updAct()}
  saveT-=dt;if(saveT<=0){saveT=5;S.px=P.x;S.py=P.y;save();hud()}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  try{if(B&&(mode==='battle'||B.over)){if(mode==='battle')battleTick(dt);renderBattle(t,dt);requestAnimationFrame(frame);return}
  if(mode==='play')update(dt);else if(mode!=='title')for(const n of npcs)npcTick(n,dt);if(tiles){render(t,dt);miniT-=dt;if(miniT<=0){miniT=.25;mg.clearRect(0,0,72,52);drawMap(mg,1,t)}}}catch(e){console.error(e)}
  requestAnimationFrame(frame)}

/* ---------------- boot ---------------- */
function startWorld(){
  genCity();refreshSolids();RT=roadTiles();mkMiniBase();buildWorld3();
  P.helmet=true;P.army=S.army.in;P.skin=SKIN[0];P.hair=HAIR[0];
  const cnt={};S.flag.forEach(c=>cnt[c]=(cnt[c]||0)+1);const dom=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];P.shirt=PAL[dom]==='#151515'||PAL[dom]==='#f4f0e6'?PAL[+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[1]||3]:PAL[dom];
  if(S.px&&!blocked(S.px,S.py)){P.x=S.px;P.y=S.py}else{P.x=board.x-1.5;P.y=board.y+1.5;if(blocked(P.x,P.y)){P.x=40.5;P.y=19}}
  // drop stale offers whose plot got built
  S.offers=S.offers.filter(o=>!(o.plot==null||(S.active&&S.active.plot===o.plot)));
  spawnNPCs();spawnChars();drawFlag($('#flagMini'),S.flag);hud();updMission();
  if(!S.offers.length&&!S.active){newOffer();newOffer()}
}
function showHUD(on){['#stats','#menuBtn','#mini','#mission','#joy','#bagBtn','#actBtn'].forEach(s=>$(s).hidden=!on)}
async function boot(){
  init3D();showHUD(false);
  const sv=load();
  if(sv){S=sv;startWorld();
    await panel(`<p class="big">كوّن إمبراطوريتك</p><p style="text-align:center">أهلًا يا ${S.name}… ${rankName()} في ${EMP[S.emp].n}.</p><div class="row" style="justify-content:center"><button class="btn pri" id="go">كمّل 🧱</button></div>`,(c,close)=>c.querySelector('#go').onclick=()=>{aInit();close()});
    showHUD(true);mode='play';return}
  S=newSave();S.flag=randomFlag();startWorld();mode='title';
  await panel(`<p class="big">كوّن إمبراطوريتك</p><p style="text-align:center">هتبدأ مواطن عادي… وممكن في يوم تحكم إمبراطورية.<br>بس الأول: ارسم علمك.</p><div class="row" style="justify-content:center"><button class="btn pri" id="go">ابدأ ✨</button></div>`,(c,close)=>c.querySelector('#go').onclick=()=>{aInit();close()});
  await flagEditor(true);
  startWorld();const e=EMP[S.emp];
  await panel(`<p class="big">اتولدت! 👶</p><p style="text-align:center">اتولدت في <b style="color:${e.c}">${e.n}</b>، في مدينة ${e.city}.<br>الحاكم: ${e.k}.</p><p style="text-align:center">انت مواطن عادي… وشغلك الأول: <b>عامل بناء 🧱</b>.<br>ابني للناس زي الرسمة بالظبط، واجمع فلوس وسمعة… لحد ما الملك نفسه يطلبك.</p><div class="row" style="justify-content:center"><button class="btn pri" id="go">يلا على السوق</button></div>`,(c,close)=>c.querySelector('#go').onclick=()=>close());
  save();showHUD(true);mode='play';toast('روح لوحة الطلبات في السوق 📜',3000);
}
boot();requestAnimationFrame(frame);
window.__emp={startBattle,startMission,addXP,get B(){return B},get S(){return S},get P(){return P},plots:()=>plots,acceptJob,openBuild,finishJob,score,newOffer,get mode(){return mode},palaceVisit,setMode:m=>mode=m};
})();
</script>
