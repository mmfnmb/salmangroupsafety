<title>لعبة القبو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen low-res 3D view upscaled with hard pixels; HUD and touch controls float over it */
:root{
  --bg:#060508; --ink:#f1e8da; --muted:#a397ad; --blood:#cf2f2c; --amber:#f4b740;
  --panel:#130f18; --edge:#2e2638; --ok:#5fd18a;
  --display:'Lalezar','Tajawal',system-ui,sans-serif;
  --body:'Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:16px/1.55 var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none;display:block}
#cut{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,160vh);aspect-ratio:8/5;max-height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;z-index:5}
#cutbg{position:fixed;inset:0;background:#000;z-index:4}
#hideov{position:fixed;inset:0;pointer-events:none;z-index:2}
#hideov.closet{background:repeating-linear-gradient(180deg,rgba(0,0,0,.94) 0 6vh,transparent 6vh 9vh)}
#hideov.bed{background:linear-gradient(180deg,rgba(0,0,0,.95) 0 46%,rgba(30,20,14,.9) 46% 52%,transparent 52%)}
#hud{position:fixed;inset:0;pointer-events:none;direction:rtl;z-index:3}
#obj{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));max-width:min(60%,420px);font-size:14px;line-height:1.4;background:rgba(6,5,8,.66);padding:5px 10px;border-radius:4px;border-right:3px solid var(--amber)}
.inv{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:6px;direction:ltr;align-items:center}
.chip{background:rgba(6,5,8,.66);padding:3px 8px;border-radius:4px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.charge{width:50px;height:9px;padding:3px;display:block}
.charge i{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .2s}
#timer{position:absolute;top:calc(44px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:24px/1 var(--display);background:rgba(6,5,8,.66);padding:6px 14px 4px;border-radius:4px;white-space:nowrap}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);max-width:80%;text-align:center;font-weight:700;font-size:16px;background:rgba(6,5,8,.78);padding:7px 14px;border-radius:5px;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(241,232,218,.55)}
#prompt{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);font-size:14px;font-weight:700;background:rgba(207,47,44,.9);padding:3px 12px;border-radius:12px;white-space:nowrap}
#subs{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);width:92%;text-align:center;font-size:clamp(15px,2.6vw,24px);font-weight:700;text-shadow:0 2px 0 #000,0 0 6px #000;z-index:6;pointer-events:none;direction:rtl}
#subs b{color:var(--amber)}
#mini{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(40px + env(safe-area-inset-top,0px));image-rendering:pixelated;border:1px solid var(--edge);background:rgba(0,0,0,.6)}
#qte{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:min(70%,420px);text-align:center}
.qbar{position:relative;height:18px;background:rgba(0,0,0,.75);border:2px solid var(--ink);border-radius:3px}
.qbar .zone{position:absolute;top:0;bottom:0;background:var(--ok)}
.qbar .mark{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--blood);box-shadow:0 0 6px var(--blood)}
.qlbl{margin-top:6px;font-weight:800;font-size:16px;text-shadow:0 2px 0 #000}
#controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;direction:ltr;z-index:3;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
#stick{pointer-events:auto;width:140px;height:140px;border-radius:50%;background:rgba(241,232,218,.06);border:2px solid rgba(241,232,218,.18);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(241,232,218,.24);border:2px solid rgba(241,232,218,.45)}
.btns{pointer-events:auto;display:grid;grid-template-columns:repeat(3,58px);gap:9px;direction:rtl;align-items:end}
.btn{width:58px;height:58px;border-radius:50%;border:2px solid var(--edge);background:rgba(19,15,24,.78);color:var(--ink);font:700 13px var(--body);touch-action:none;padding:0}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn.act{grid-column:span 3;width:100%;height:58px;border-radius:29px;background:rgba(207,47,44,.92);border-color:#ff6f62;font-size:17px}
.btn:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;direction:rtl;background:linear-gradient(transparent,rgba(4,3,6,.96) 22%);
  padding:40px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheetin{max-width:620px;margin:0 auto}
#who{font:24px/1 var(--display);color:var(--amber);margin-bottom:6px}
#sayT{font-size:19px;font-weight:500;min-height:2.4em;white-space:pre-line}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.choices button{flex:1 1 180px}
.choices button,.card button{font:700 16px var(--body);color:var(--ink);background:#221b2a;border:1px solid #3c3247;border-radius:8px;padding:11px 14px;text-align:right;cursor:pointer}
.card button.primary,.choices button.primary{background:var(--blood);border-color:#ff6f62;text-align:center}
#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(4,3,6,.8);direction:rtl;touch-action:pan-y;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-sizing:border-box}
.card h1{font:clamp(60px,18vw,110px)/.9 var(--display);margin:0;color:var(--ink);text-shadow:0 0 18px rgba(207,47,44,.55),4px 4px 0 #3a0d0e;text-align:center}
.card h2{font:28px/1.1 var(--display);margin:0 0 8px;color:var(--amber)}
.card p{margin:0 0 10px}
.tag{text-align:center;color:var(--muted);margin-top:6px!important;font-weight:700}
.muted{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.row{display:flex;gap:9px;margin-top:14px}.row>*{flex:1}
.story p{font-size:18px}
.story .knock{font:30px/1.2 var(--display);color:var(--blood);text-align:center;margin:12px 0}
.tip{background:#1d1724;border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:12px}
.comps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.comp{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center!important;padding:10px 6px!important}
.comp canvas{width:64px;height:64px;image-rendering:pixelated}
.comp b{font:20px/1 var(--display);color:var(--amber)}
.comp small{font-weight:500;font-size:12px;color:var(--muted);line-height:1.35}
.dials{display:flex;justify-content:center;gap:14px;margin:12px 0;direction:ltr}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial .sym{font-size:26px;color:var(--blood);font-weight:800;line-height:1}
.dial .dv{font:40px/1 var(--display);width:56px;text-align:center;background:#0b0910;border:1px solid var(--edge);border-radius:6px;padding:8px 0 4px;font-variant-numeric:tabular-nums}
.dial button{width:56px;text-align:center!important;padding:6px!important}
.clues{background:#0b0910;border:1px dashed #4a3c56;border-radius:6px;padding:8px 10px;font-size:15px;white-space:pre-line}
.slots{display:flex;gap:8px;justify-content:center;margin:12px 0;direction:rtl}
.slot{width:52px;height:52px;border-radius:8px;border:2px dashed #4a3c56;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.wires{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wires button{text-align:center!important;color:#111!important;font-weight:800!important}
.levers{display:flex;justify-content:center;gap:10px;margin:14px 0;direction:ltr}
.lev{display:flex;flex-direction:column;align-items:center;gap:6px}
.lamp{width:22px;height:22px;border-radius:50%;background:#2b2b2b;border:2px solid #111}
.lamp.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.lev button{width:46px;height:70px;padding:0!important;text-align:center!important;font-size:22px!important}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:12px 0;font-size:15px}
.stats span:nth-child(even){font-variant-numeric:tabular-nums;color:var(--amber);font-weight:700}
.next{border-top:1px solid var(--edge);padding-top:12px;margin-top:12px;text-align:center}
.next b{display:block;font:24px/1.2 var(--display);color:var(--blood)}
#big{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;pointer-events:none;direction:rtl;text-align:center;
  font:clamp(48px,14vw,130px)/1 var(--display);color:var(--ink);text-shadow:0 0 24px rgba(207,47,44,.9),5px 5px 0 #000;opacity:0}
#big.on{animation:pop .9s ease-out forwards}
#big.gold{color:#ffd56b;text-shadow:0 0 26px rgba(255,190,60,.9),5px 5px 0 #3b1d00}
@keyframes pop{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}18%{opacity:1;transform:scale(.92) rotate(2deg)}30%{transform:scale(1.05)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#fade{position:fixed;inset:0;z-index:25;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){#big.on{animation-duration:.01s;opacity:1}}
</style>

<canvas id="view" aria-label="شاشة اللعبة"></canvas>

<div id="hud">
  <div id="obj" hidden></div>

    <span class="chip" id="cKeys">🔑 0/3</span>

  </div>
  <canvas id="mini" hidden></canvas>
  <div id="timer" hidden></div>
  <div id="cross" hidden></div>
  <div id="toast"></div>
  <div id="qte" hidden><div class="qbar"><i class="zone" id="qZone"></i><i class="mark" id="qMark"></i></div><div class="qlbl" id="qLbl"></div></div>
  <div id="prompt" hidden></div>
</div>
<div id="subs"></div>
<div id="controls" hidden>
  <div id="stick"><div id="knob"></div></div>
  <div class="btns">
    <button class="btn on" id="bLight">كشاف</button>
    <button class="btn" id="bBat">بطارية</button>
    <button class="btn" id="bMap">خريطة</button>
    <button class="btn" id="bRun">جري</button>
    <button class="btn act" id="bAct">تفاعل</button>
  </div>
</div>
<div id="sheet" hidden><div class="sheetin"><div id="who"></div><div id="sayT"></div><div class="choices" id="choices"></div></div></div>
<div id="overlay"><div class="card" id="card"><h1>القبو</h1><p class="tag">جاري التحميل…</p></div></div>
<div id="big"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE){$('#card').innerHTML='<h2>مش قادر أحمّل اللعبة</h2><p>محرك الرسم ما اتحملش. اتأكد إن النت شغال وافتح الصفحة تاني.</p>';return}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
const rgb=(r,g,b)=>`rgb(${clamp(r|0,0,255)},${clamp(g|0,0,255)},${clamp(b|0,0,255)})`;
const SYM=['○','△','□'];
const WH=1.6, EYE=.74;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===================== canvas art ===================== */
function cv(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const R=(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh)};fn(R,g,w,h);return c}
function speck(R,x0,y0,w,h,b,v){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){const n=rand(-v,v);R(x,y,1,1,rgb(b[0]+n,b[1]+n,b[2]+n))}}
const TW=32,THh=52;
function stoneBase(R,b,h=THh){
  speck(R,0,0,TW,h,b,13);
  const dk=rgb(b[0]*.42,b[1]*.42,b[2]*.42);
  for(let r=0;r*8<h;r++){const y=r*8,o=(r%2)*8;
    for(let k=-1;k<3;k++){const s=rand(-14,12);R(o+k*16+1,y+1,15,7,`rgba(${s>0?255:0},${s>0?255:0},${s>0?255:0},${Math.abs(s)/110})`)}
    R(0,y,TW,1,dk);for(let k=0;k<2;k++)R((o+k*16)%TW,y,1,8,dk)}
  for(let i=0;i<20;i++)R(ri(0,31),ri(h-18,h-1),1,1,rgb(44,70,40));
  for(let i=0;i<4;i++)R(ri(0,31),0,1,ri(5,20),'rgba(8,10,8,.45)');
}
function paperBase(R,b){
  R(0,0,TW,THh,rgb(b[0],b[1],b[2]));
  for(let x=0;x<TW;x+=8)R(x,0,3,THh-7,rgb(b[0]+10,b[1]+10,b[2]+10));
  for(let y=3;y<THh-9;y+=6)for(let x=(y%12===3?2:6);x<TW;x+=8){R(x,y,1,1,rgb(160,146,100));R(x-1,y+1,3,1,rgb(128,120,88));R(x,y+2,1,1,rgb(160,146,100))}
  for(let i=0;i<70;i++)R(ri(0,31),ri(0,THh-8),1,1,'rgba(0,0,0,.2)');
  for(let i=0;i<4;i++){const x=ri(0,30);R(x,ri(0,16),2,ri(8,24),'rgba(60,40,20,.2)')}
  R(0,THh-7,TW,7,rgb(66,42,28));R(0,THh-7,TW,1,rgb(100,66,40));
}
const SYMPIX=[
 ['..XXXXX..','.X.....X.','X.......X','X.......X','X.......X','X.......X','X.......X','.X.....X.','..XXXXX..'],
 ['....X....','...X.X...','...X.X...','..X...X..','..X...X..','.X.....X.','.X.....X.','X.......X','XXXXXXXXX'],
 ['XXXXXXXXX','X.......X','X.......X','X.......X','X.......X','X.......X','X.......X','X.......X','XXXXXXXXX']];
const FONT={0:['111','101','101','101','111'],1:['010','110','010','010','111'],2:['111','001','111','100','111'],3:['111','001','111','001','111'],4:['101','101','111','001','001'],5:['111','100','111','001','111'],6:['111','100','111','101','111'],7:['111','001','010','010','010'],8:['111','101','111','101','111'],9:['111','101','111','001','111']};
function drawSym(R,x,y,t,c){SYMPIX[t].forEach((row,j)=>{for(let i=0;i<9;i++)if(row[i]==='X')R(x+i,y+j,1,1,c)})}
function drawDigit(R,x,y,d,c,s){FONT[d].forEach((row,j)=>{for(let i=0;i<3;i++)if(row[i]==='1')R(x+i*s,y+j*s,s,s,c)})}
const C={},SPR={};
function monster2D(R,g,v){
  const sh=v==='shadow';const body=sh?'#08070b':'#16131b',skin=sh?'#2a2630':'#b3ada4';
  R(14,58,3,21,body);R(23,58,3,21,body);R(11,78,7,2,body);R(22,78,7,2,body);R(11,22,18,38,body);R(9,30,22,26,body);
  for(let x=9;x<31;x+=3)R(x,56,2,ri(4,9),body);R(5,24,4,40,body);R(31,24,4,40,body);R(4,62,6,4,body);R(30,62,6,4,body);
  for(let i=0;i<3;i++){R(4+i*2,66,1,6,skin);R(30+i*2,66,1,6,skin)}R(18,17,4,6,body);
  R(13,1,14,18,skin);R(12,4,16,12,skin);R(15,0,10,1,skin);R(14,19,12,1,skin);
  R(14,6,5,5,'#060406');R(21,6,5,5,'#060406');R(16,8,2,2,'#ff3226');R(23,8,2,2,'#ff3226');

}

function kid2D(R,eye){R(6,1,8,3,'#2a1a12');R(5,3,10,8,'#c48d62');R(5,2,10,2,'#2a1a12');R(7,6,2,2,eye);R(11,6,2,2,eye);R(8,9,4,1,'#7a3b2a');R(4,11,12,13,'#4a6fb8');for(let y=12;y<24;y+=3)R(4,y,12,1,'#a8c0ec');R(2,12,2,10,'#4a6fb8');R(16,12,2,10,'#4a6fb8');R(5,24,4,10,'#3b5a9a');R(11,24,4,10,'#3b5a9a');R(4,34,5,2,'#8a2a2a');R(11,34,5,2,'#8a2a2a')}
function robot2D(R,eye){const m='#9aa1ad',d='#646b78';R(9,1,2,4,d);R(8,0,4,2,'#ffe27a');R(3,4,14,10,m);R(4,5,12,8,'#2a2f3a');R(6,7,3,3,eye);R(11,7,3,3,eye);R(8,14,4,2,d);R(4,16,12,9,m);R(6,18,8,5,'#cfd5de');R(0,16,3,8,d);R(17,16,3,8,d);R(5,25,4,4,d);R(11,25,4,4,d)}

function buildArt(){
  const st=[72,76,70];
  C.paper=cv(TW,THh,R=>paperBase(R,[78,96,80]));

function buildMap(rows,floorC,ceilC){
  const m=parseMap(rows);G.map=m;G.explored=new Uint8Array(m.w*m.h);
  const f=new THREE.Mesh(new THREE.PlaneGeometry(m.w,m.h),mat(floorC,{rep:[m.w,m.h]}));f.rotation.x=-Math.PI/2;f.position.set(m.w/2,0,m.h/2);world.add(f);

  const groups={};
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){const ch=m.g[y][x];if(!SOLID.has(ch))continue;
    let open=false;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<m.w&&ny<m.h&&!SOLID.has(m.g[ny][nx]))open=true}

    else{const cvs=(ch==='1'||ch==='2'||ch==='3')?C['w'+ch]:C[WALLC[ch]];G.special[x+','+y]=box(world,1,WH,1,mat(cvs,{nocache:true}),x+.5,WH/2,y+.5)}

function animRig(o,dt,t){

  if(v.armL){v.armL.rotation.x=-s*.45+Math.sin(t*1.3)*.05;v.armR.rotation.x=s*.45+Math.sin(t*1.1)*.05}

    if(Math.random()<.02)v.jit=rand(-.5,.5);v.head.rotation.z=lerp(v.head.rotation.z,v.jit||0,.2);v.head.rotation.x=Math.sin(t*2)*.08;
    if(G.zap>0){const on=Math.floor(t*14)%2;v.body.emissive.setHex(on?0x4070ff:0xffffff);v.skin.emissive.setHex(on?0xffffff:0x2040ff)}

}

/* ===================== world update ===================== */
function solidAt(x,y){const m=G.map;if(x<0||y<0||x>=m.w||y>=m.h)return true;return SOLID.has(m.g[y][x])}
function blocked(x,y){const r=.2;if(solidAt(Math.floor(x-r),Math.floor(y-r))||solidAt(Math.floor(x+r),Math.floor(y-r))||solidAt(Math.floor(x-r),Math.floor(y+r))||solidAt(Math.floor(x+r),Math.floor(y+r)))return true;
  for(const o of G.objs)if(o.solid&&!o.gone&&Math.hypot(o.x-x,o.y-y)<o.solid+r-.05)return true;return false}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/.1);for(let i=1;i<n;i++){const t=i/n;if(solidAt(Math.floor(lerp(x0,x1,t)),Math.floor(lerp(y0,y1,t))))return false}return true}
function bfsNext(sx,sy,tx,ty){
  const m=G.map,w=m.w;if(sx===tx&&sy===ty)return null;if(solidAt(tx,ty))return null;
  const prev=new Int32Array(w*m.h).fill(-1),s=sy*w+sx,goal=ty*w+tx;prev[s]=s;const q=[s];let h=0;
  while(h<q.length){const c=q[h++];if(c===goal)break;const cx=c%w,cy=(c/w)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(solidAt(nx,ny))continue;const n=ny*w+nx;if(prev[n]<0){prev[n]=c;q.push(n)}}}
  if(prev[goal]<0)return null;let c=goal;while(prev[c]!==s)c=prev[c];return[c%w,(c/w)|0];
}
let lastDt=.016;
function lerpAng(a,b,t){return a+angDiff(b,a)*t}
function moveMon(m,tx,ty,step){
  const a=Math.floor(m.x),b=Math.floor(m.y),c=Math.floor(tx),d=Math.floor(ty);let gx=tx,gy=ty;
  if(a!==c||b!==d){const n=bfsNext(a,b,c,d);if(n){gx=n[0]+.5;gy=n[1]+.5}}
  const dx=gx-m.x,dy=gy-m.y,dd=Math.hypot(dx,dy);
  if(dd>.001){const s=Math.min(step,dd);m.x+=dx/dd*s;m.y+=dy/dd*s;m.face=lerpAng(m.face||0,Math.atan2(dx,dy),.15);m.speed=s/Math.max(.001,lastDt)}else m.speed=0;
}
function findTarget(){
  let best=null,bd=1.45;
  for(const o of G.objs){if(o.gone||o.invis)continue;if(!(o.act||(o.hide&&G.stage==='house2')))continue;
    const dx=o.x-G.px,dy=o.y-G.py,d=Math.hypot(dx,dy);if(d>1.45)continue;const ang=Math.abs(angDiff(Math.atan2(dy,dx),G.pa));
    if((ang<.6||(d<.6&&!o.isComp))&&d<bd){bd=d;best={kind:'obj',o}}}
  for(let s=.1;s<=1.3;s+=.05){const x=Math.floor(G.px+G.dirX*s),y=Math.floor(G.py+G.dirY*s);if(solidAt(x,y)){const ch=G.map.g[y]&&G.map.g[y][x];if(ch&&INTER[ch]&&(!best||s<bd))return{kind:'wall',ch,x,y};break}}
  return best;
}
function promptFor(t){

  if(!t)return'';
  if(t.kind==='obj'){const o=t.o;if(o.act==='talk')return`كلّم ${G.comp.name}`;if(o.act==='read')return'اقرا الورقة';if(o.hide)return`استخبى ${o.hide}`;return''}
  return{K:G.stage==='house1'?'افتح باب القبو':'باب القبو',F:'باب البيت',W:'الشباك',U:'باب القبو',O:'اطلع من القبو',C:'الخزنة',V:'الرافعات',X:'علبة الأسلاك',G:'المولّد',L:'الرافعة الكبيرة','1':'اقرا المكتوب','2':'اقرا المكتوب','3':'اقرا المكتوب'}[t.ch]||'';
}
function update(dt){
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.8);
  if(G.red>0)G.red=Math.max(0,G.red-dt*.7);
  if(G.flashFx>0)G.flashFx=Math.max(0,G.flashFx-dt*3);
  if(G.comp&&G.comp.redT>0)G.comp.redT-=dt;
  if(G.mode==='play'){playerUpdate(dt);tick(dt)}

function playerUpdate(dt){

  if(keys.KeyW||keys.ArrowUp)fwd=1;if(keys.KeyS||keys.ArrowDown)fwd=-1;if(keys.KeyA)str=-1;if(keys.KeyD)str=1;
  let turn=0;if(keys.ArrowLeft||keys.KeyQ)turn=-1;if(keys.ArrowRight)turn=1;
  G.pa+=G.lookX+turn*dt*2.2;G.pitch=clamp(G.pitch-G.lookY,-.85,.75);G.lookX=0;G.lookY=0;syncDir();

  G.run=wantRun&&G.stam>.05;G.stam=clamp(G.stam+(G.run?-.3:.2)*dt,0,1);
  if(inp.run&&G.stam<=.05){inp.run=false;bRun.classList.remove('on')}
  const sp=(G.run?3:1.8)*dt;

  }
  const m=G.map;for(let y=Math.floor(G.py-2.5);y<=G.py+2.5;y++)for(let x=Math.floor(G.px-2.5);x<=G.px+2.5;x++)if(x>=0&&y>=0&&x<m.w&&y<m.h)G.explored[y*m.w+x]=1;
}
function compUpdate(dt){
  const o=G.cObj,c=G.comp;if(!o||o.gone)return;
  if(c.bad&&(c.eyeT=(c.eyeT??rand(10,18))-dt)<=0){c.redT=.4;c.eyeT=rand(14,26)}
  const d=Math.hypot(G.px-o.x,G.py-o.y);

function spawnMon(){
  const m=G.mon;let best=G.wps[0],bd=0;for(const w of G.wps){const d=Math.hypot(w[0]-G.px,w[1]-G.py);if(d>bd){bd=d;best=w}}
  m.x=best[0];m.y=best[1];m.state='patrol';showMon();m.wp=null;SFX.growl(.35,0);toast('فيه حاجة بتتحرك في الضلمة…',2600);
}
function alertMon(x,y){const m=G.mon;if(!m||m.state==='off'||m.state==='dead'||m.state==='chase')return;m.state='search';m.sx=x;m.sy=y;m.wait=0}
function monUpdate(dt){
  const m=G.mon;if(!m||m.state==='off'||m.state==='dead'){setMon(0,0);return}
  if(m.delay>0){m.delay-=dt;m.speed=0;return}
  const dx=G.px-m.x,dy=G.py-m.y,d=Math.hypot(dx,dy);const hid=!!G.hidden;
  let sees=false;
  if(!hid&&d<11&&los(m.x,m.y,G.px,G.py)){const rng=G.flash?8.5:(G.stage==='house2'?5.5:4);if(d<rng||(G.run&&d<6.5)||d<1.8)sees=true}
  const ang=angDiff(Math.atan2(m.y-G.py,m.x-G.px),G.pa),pan=Math.sin(ang);
  if(sees){if(m.state!=='chase'){SFX.growl(.5,pan);G.red=.5;toast('شافك! اجري!',1600)}m.state='chase';m.lx=G.px;m.ly=G.py;m.lost=0}
  const h2=G.stage==='house2';let tx,ty,spd;
  if(m.state==='chase'){if(!sees){m.lost+=dt;if(m.lost>4.5){m.state=h2?'roam':'patrol';m.wp=null;m.goal=null}}tx=m.lx;ty=m.ly;spd=h2?2.2:2.05}
  else if(m.state==='search'){tx=m.sx;ty=m.sy;spd=1.6;if(Math.hypot(tx-m.x,ty-m.y)<.6){m.wait+=dt;if(m.wait>2.2){m.state='patrol';m.wp=null}}}
  else if(h2){
    m.tp=(m.tp??18)-dt;
    if(m.tp<=0&&m.state!=='qte'){m.tp=rand(16,24);teleportShadow();return}
    if(m.state==='qte'){m.speed=0;setMon(.35,pan);m.face=lerpAng(m.face,Math.atan2(dx,dy),.1);return}
    if(!m.goal){if(Math.random()<.5){m.goal=pick(G.objs.filter(o=>o.hide));m.state='check'}else{const w=pick(G.wps);m.goal={x:w[0],y:w[1]};m.state='roam'}m.wait=0}
    tx=m.goal.x;ty=m.goal.y;spd=1.15;
    if(Math.hypot(tx-m.x,ty-m.y)<1.25){
      if(m.state==='check'&&G.hidden===m.goal){m.state='qte';startQTE(m.need||1);m.need=1;return}
      m.wait+=dt;m.speed=0;if(m.wait>1.6)m.goal=null;setMon(.3,pan);return
    }
  }
  else{if(!m.wp||Math.hypot(m.wp[0]-m.x,m.wp[1]-m.y)<.5)m.wp=pick(G.wps);tx=m.wp[0];ty=m.wp[1];spd=1.05}
  moveMon(m,tx,ty,spd*dt);
  if(!hid&&Math.hypot(G.px-m.x,G.py-m.y)<.6){caught();return}
  const v=Math.pow(clamp(1-d/11,0,1),1.5)*(m.state==='chase'?.7:.4);setMon(v,pan);
  if(d<6){G.hbT-=dt;if(G.hbT<=0){SFX.heart(.08+.25*(1-d/6));G.hbT=.32+d*.12}}
}
function teleportShadow(){
  const m=G.mon;const opts=G.wps.filter(w=>Math.hypot(w[0]-G.px,w[1]-G.py)>4);
  const fromK=Math.random()<.4&&Math.hypot(1.5-G.px,5.5-G.py)>4;
  const w=fromK?[1.5,5.5]:pick(opts.length?opts:G.wps);m.x=w[0];m.y=w[1];m.goal=null;m.state='roam';
  if(fromK){SFX.creak();toast('باب القبو اتفتح لوحده…',2200)}else SFX.growl(.25,0);
}
function spawnShadow(){const m=G.mon;showMon();m.tp=20;teleportShadow();G.red=.4;SFX.growl(.55,0);toast('الوحش طلع من القبو!',2400)}

/* ===================== QTE / hiding ===================== */
function hideIn(o){G.hidden=o;ui.hideov.className=o.hk;SFX.creak();toast(`استخبيت ${o.hide}`,1800);const m=G.mon;
  if(m&&m.state==='chase'&&Math.hypot(m.x-G.px,m.y-G.py)<7&&los(m.x,m.y,G.px,G.py)){m.state='check';m.goal=o;m.need=2}}
function unhide(){if(G.qte)return;G.hidden=null;ui.hideov.className='';toast('طلعت من المخبى',1200)}
function startQTE(n){G.qte={need:n,got:0,pos:0,dir:1,spd:1.1,zone:rand(.25,.6),zw:.22,left:3.4};ui.qte.hidden=false;ui.qLbl.textContent=n>1?`اكتم نفسك! (${n} مرات) دوس «تفاعل» وهو في الأخضر`:'اكتم نفسك! دوس «تفاعل» وهو في الأخضر';qteDraw();SFX.growl(.4,0)}
function qteDraw(){const q=G.qte;ui.qZone.style.left=(q.zone*100)+'%';ui.qZone.style.width=(q.zw*100)+'%';ui.qMark.style.left=(q.pos*100)+'%'}
function qteTick(dt){const q=G.qte;q.pos+=q.dir*q.spd*dt;if(q.pos>1){q.pos=1;q.dir=-1}if(q.pos<0){q.pos=0;q.dir=1}q.left-=dt;qteDraw();if(q.left<=0)endQTE(false)}
function qteTap(){const q=G.qte;if(q.pos>=q.zone&&q.pos<=q.zone+q.zw){q.got++;SFX.click();if(q.got>=q.need)endQTE(true);else{q.zone=rand(.15,.65);q.zw=.18;q.spd+=.35;q.left=3}}else endQTE(false)}
function endQTE(ok){G.qte=null;ui.qte.hidden=true;const m=G.mon;if(ok){toast('مشي… كان قريب أوي',2000);m.state='roam';m.goal=null;m.tp=rand(6,10)}else{G.hidden=null;ui.hideov.className='';caught()}}

/* ===================== caught (3D jumpscare) ===================== */
function caught(){
  if(G.mode!=='play')return;G.mode='scare';G.scareT=0;G.scareDone=0;G.caught++;ui.toast.classList.remove('on');SFX.scream();G.qte=null;ui.qte.hidden=true;G.hidden=null;ui.hideov.className='';ui.prompt.hidden=true;setMon(0,0);
  showMon();G.shake=1.4;G.red=1;G.flashFx=.6;
}
function scareTick(dt){
  G.scareT+=dt;const m=G.mon;G.pitch=lerp(G.pitch,.05,.2);
  const k=Math.min(1,G.scareT*4);const dist=lerp(1.7,.8,k);
  m.x=G.px+G.dirX*dist;m.y=G.py+G.dirY*dist;m.face=Math.atan2(G.px-m.x,G.py-m.y);m.yo=lerp(-.3,-.98,k);m.speed=0;
  G.shake=Math.max(G.shake,.8);G.red=Math.max(G.red,.55);
  if(G.scareT>1.3&&!G.scareDone){G.scareDone=1;afterScare()}
}
async function afterScare(){
  await panel(`<h2>اتمسكت!</h2><p>${G.stage==='house2'?'الوحش لقاك. جدتك لسه مرجعتش… حاول تاني.':'الوحش مسكك في الضلمة. حاجتك لسه معاك، حاول تاني.'}</p><div class="stack"><button class="primary" id="pR">حاول تاني</button></div>`,(r,close)=>{r.querySelector('#pR').onclick=()=>{SFX.click();close()}});
  G.mon.yo=0;respawn();
}
function respawn(){
  const m=G.mon;G.red=0;G.shake=0;
  if(G.stage==='base'){
    if(G.genOn){placePlayer(2.5,14.5,0);m.x=20.5;m.y=8.5;m.state='chase';m.lx=2.5;m.ly=14.5;m.lost=0;m.delay=3}
    else{placePlayer(3.5,1.5,Math.PI/2);let best=G.wps[0],bd=0;for(const w of G.wps){const d=Math.hypot(w[0]-3.5,w[1]-1.5);if(d>bd){bd=d;best=w}}m.x=best[0];m.y=best[1];m.state='patrol';m.wp=null}
    if(G.charge<30)G.charge=30;
  }else if(G.stage==='house2'){placePlayer(8.5,5.5,Math.PI);G.timer=Math.min(G.timer+20,150);m.goal=null;teleportShadow();m.delay=2}
  if(G.cObj&&!G.comp.stay){G.cObj.x=G.px-G.dirX*.8;G.cObj.y=G.py-G.dirY*.8}
  G.mode='play';
}

/* ===================== actions ===================== */
async function act(){
  if(G.qte){qteTap();return}
  if(G.hidden){unhide();return}
  const t=G.target;if(!t)return;
  if(t.kind==='obj'){const o=t.o;
    if(o.act==='talk')return talkComp();
    if(o.act==='read'){if(o.wire)G.flags.wireNote=1;return talk(o.title,o.text,null)}
    if(o.hide&&G.stage==='house2')return hideIn(o);
    return;
  }
  const ch=t.ch;
  if(ch==='K'){if(G.stage==='house1')return goBasement();return toast('لا… مش هنزل القبو تاني!')}
  if(ch==='F')return toast(G.stage==='house2'?'الباب مقفول! جدتك معاها المفتاح.':'باب البيت مقفول بالليل.');
  if(ch==='W')return toast('الشباك عليه حديد.');
  if(ch==='U')return toast('الباب مقفول من برا!');
  if(ch==='O')return exitBasement();
  if(ch==='1'||ch==='2'||ch==='3'){const s=G.syms[+ch-1];const d=G.code[s];const first=!Object.keys(G.found).length;G.found[s]=d;SFX.click();
    await talk('مكتوب بالدم',`${SYM[s]}  =  ${d}`,null);if(first&&compHere()&&!G.flags.q2){G.flags.q2=1;q2()}return}
  if(ch==='C')return G.solved.safe?toast('الخزنة فاضية'):safePuzzle();
  if(ch==='X')return G.solved.wires?toast('العلبة اتفتحت خلاص'):wirePuzzle();
  if(ch==='V')return G.solved.levers?toast('كل اللمبات منورة'):leverPuzzle();
  if(ch==='G')return generator();
  if(ch==='L')return bigLever();
}
async function talkComp(){
  const c=G.comp;const i=await compTalk(pick(COMPS[c.id].idle),['عندك فكرة؟',c.stay?'تعالى معايا':'استنى هنا','ولا حاجة']);
  if(i===0)await compTalk(hint());
  else if(i===1){c.stay=!c.stay;await compTalk(c.stay?'ماشي… هستناك هنا.':'جاي وراك!')}
}
function hint(){
  const c=G.comp,bad=c.bad,st=G.stage;
  if(st==='house1')return'الصوت جاي من باب القبو… آخر الطرقة.';
  if(st==='base'){
    if(!G.solved.safe){const i=ri(0,2);const d=bad?(G.code[i]+ri(1,8))%10:G.code[i];return`أنا شفت مكتوب على حيطة: ${SYM[i]} = ${d}`}
    if(!G.solved.wires)return bad?'أنا متأكد إن الأصفر أول سلك.':'الورقة اللي في الصالة بتقول إن الأصفر آخر سلك.';
    if(!G.solved.levers)return'كل رافعة بتقلب اللمبات اللي جنبها. جرّب تبدأ من الطرف.';
    if(!G.genOn&&G.bats<4)return'لسه محتاجين بطاريات. دوّر في الأركان.';
    if(!G.genOn)return'المولّد في الأوضة الكبيرة اللي تحت.';
    if(G.mon.state!=='dead')return bad?'شد الرافعة أول ما تشوفه! بسرعة!':'استنى لما الوحش يبقى جوه المية بالظبط… وبعدين شد.';
    return'يلا نطلع من هنا!';
  }
  if(st==='house2')return bad?`استخبى ${pick(['جوه الدولاب','تحت السرير'])}… وأنا هقولك لو جه 🙂`:'استخبى، ولما يقرب اكتم نفسك في الوقت الصح.';
  return'…';
}
function objBase(){
  if(G.stage!=='base')return;
  if(G.mon.state==='dead')return setObj('باب القبو اتفتح! اطلع بسرعة.');
  if(G.genOn)return setObj('استدرج الوحش لبركة المية… وشد الرافعة الكبيرة وهو جواها.');
  if(G.keys>=3&&G.bats>=4)return setObj('روح للمولّد في الأوضة الكبيرة اللي تحت.');
  setObj(`دوّر على ٣ مفاتيح (${G.keys}/3) واجمع ٤ بطاريات (${Math.min(G.bats,4)}/4) للمولّد.`);
}
function gotKey(){G.keys++;SFX.key();toast(`🔑 لقيت المفتاح ${['الأول','التاني','التالت'][G.keys-1]}!`,2400);objBase();hudSync();if(G.mon.state==='off')spawnMon()}

/* ===================== puzzles ===================== */
function safePuzzle(){
  const v=[0,0,0];const clues=Object.keys(G.found).map(k=>`${SYM[k]} = ${G.found[k]}`);
  return panel(`<h2>خزنة في الحيطة</h2><p class="muted">٣ أرقام، وكل رقم ليه شكل. الأرقام مكتوبة على حيطان القبو.</p>
  <div class="dials">${[0,1,2].map(i=>`<div class="dial"><div class="sym">${SYM[i]}</div><button data-u="${i}" aria-label="زوّد">▲</button><div class="dv" id="dv${i}">0</div><button data-d="${i}" aria-label="قلّل">▼</button></div>`).join('')}</div>
  <div class="clues">${clues.length?'لقيت:\n'+clues.join('\n'):'لسه ملقيتش أرقام على الحيطان.'}</div>
  <div class="row"><button class="primary" id="pOk">افتح</button><button id="pX">ارجع</button></div>`,(r,close)=>{
    const show=()=>{for(let i=0;i<3;i++)r.querySelector('#dv'+i).textContent=v[i]};
    r.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{v[+b.dataset.u]=(v[+b.dataset.u]+1)%10;SFX.click();show()});
    r.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{v[+b.dataset.d]=(v[+b.dataset.d]+9)%10;SFX.click();show()});
    r.querySelector('#pX').onclick=()=>close();
    r.querySelector('#pOk').onclick=()=>{if(v.every((x,i)=>x===G.code[i])){G.solved.safe=1;close();gotKey()}else{SFX.bad();G.shake=.3;alertMon(11.5,1.5);r.querySelector('.clues').textContent='غلط! والصوت عالي… فيه حاجة سمعتك.'}};
  });
}
function wirePuzzle(){
  const CL=[['r','أحمر','#e23a32'],['g','أخضر','#3fbf5a'],['b','أزرق','#3a6ee8'],['y','أصفر','#f2d03a']];const sol='rgby';let seq=[];
  return panel(`<h2>علبة الأسلاك</h2><p class="muted">وصّل الأسلاك الأربعة بالترتيب الصح. لو غلطت هيطلع شرار.</p>
  <div class="slots">${[0,1,2,3].map(i=>`<div class="slot" id="s${i}">${i+1}</div>`).join('')}</div>
  <div class="wires">${CL.map(c=>`<button data-c="${c[0]}" style="background:${c[2]};border-color:${c[2]}">${c[1]}</button>`).join('')}</div>
  <div class="clues" style="margin-top:12px">${G.flags.wireNote?'الورقة بتقول:\n• الأصفر آخر واحد.\n• الأحمر قبل الأزرق.\n• الأخضر جنب الأحمر، ومش أول واحد.':'فيه ورقة فيها الترتيب في مكان ما في القبو.'}</div>
  <div class="row"><button id="pC">امسح</button><button id="pX">ارجع</button></div>`,(r,close)=>{
    const show=()=>{for(let i=0;i<4;i++){const s=r.querySelector('#s'+i);const c=CL.find(c=>c[0]===seq[i]);s.style.background=c?c[2]:'';s.style.borderStyle=c?'solid':'dashed';s.textContent=c?'':i+1}};
    r.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(seq.includes(b.dataset.c)||seq.length>=4)return;seq.push(b.dataset.c);SFX.click();show();
      if(seq.length===4){if(seq.join('')===sol){G.solved.wires=1;setTimeout(()=>{close();gotKey()},300)}else{SFX.spark();G.shake=.35;alertMon(22.5,8.5);setTimeout(()=>{seq=[];show()},450)}}});
    r.querySelector('#pC').onclick=()=>{seq=[];show()};r.querySelector('#pX').onclick=()=>close();
  });
}
function leverPuzzle(){
  const st=[1,1,1,1,1];const press=(s,i)=>{for(const j of[i-1,i,i+1])if(j>=0&&j<5)s[j]^=1};
  do{for(let k=0;k<3;k++)press(st,ri(0,4))}while(st.every(x=>x));
  return panel(`<h2>لوحة الرافعات</h2><p class="muted">خلّي اللمبات الخمسة تنوّر أخضر. كل رافعة بتقلب لمبتها واللمبات اللي جنبها.</p>
  <div class="levers">${[0,1,2,3,4].map(i=>`<div class="lev"><div class="lamp" id="l${i}"></div><button data-l="${i}" aria-label="رافعة ${i+1}">⇅</button></div>`).join('')}</div>
  <div class="row"><button id="pX">ارجع</button></div>`,(r,close)=>{
    const show=()=>{for(let i=0;i<5;i++)r.querySelector('#l'+i).classList.toggle('on',!!st[i])};show();
    r.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{press(st,+b.dataset.l);tone(rand(180,240),.12,{type:'sawtooth',v:.05,lp:900});show();
      if(st.every(x=>x)){G.solved.levers=1;setTimeout(()=>{close();gotKey()},350)}});
    r.querySelector('#pX').onclick=()=>close();
  });
}
async function generator(){
  if(G.genOn)return toast('المولّد شغال… الرافعة في آخر الأوضة!');
  if(G.keys<3||G.bats<4){const need=[];if(G.keys<3)need.push(`${3-G.keys} مفاتيح`);if(G.bats<4)need.push(`${4-G.bats} بطاريات`);return toast(`المولّد محتاج كمان: ${need.join(' و')}`,2600)}
  G.keys=0;G.bats-=4;G.genOn=true;setSpecial(23,14,C.gen1);SFX.key();SFX.hum();G.shake=.4;amb.intensity=.12;amb.color.setHex(0x803020);hudSync();
  big('⚡','gold');toast('المولّد اشتغل!',1800);objBase();
  const m=G.mon;showMon();m.x=20.5;m.y=8.5;m.state='chase';m.lx=G.px;m.ly=G.py;m.lost=0;m.delay=1.5;
  await sleep(700);SFX.growl(.6,0);
  if(compHere()&&!G.flags.q4){G.flags.q4=1;await q4()}
}
async function bigLever(){
  if(!G.genOn)return toast('مفيش كهربا لسه. شغّل المولّد الأول.');
  if(G.mon.state==='dead')return toast('خلاص… خلصنا منه.');
  if(G.leverCD>0)return toast('الكهربا بتتشحن… استنى ثانية.');
  const m=G.mon;
  if(G.water(Math.floor(m.x),Math.floor(m.y)))return killMonster();
  G.leverCD=3;SFX.spark();SFX.zap(.5);G.zap=.4;toast('مفيش حد في المية! استناه يدخلها.',2000);m.state='chase';m.lx=G.px;m.ly=G.py;m.lost=0;
}

/* ===================== story beats ===================== */

  const c=G.comp;const i=await compTalk((c.id==='cat'?'مياو… ':'')+'إحنا اتحبسنا! تفتكر الدق كان جاي منين؟',['من جوه القبو','مش عارف… خليك جنبي']);
  if(c.bad)await compTalk('يمكن… تعالى نروح ناحية الصوت 🙂');
  else await compTalk(i===0?'طب نمشي بالراحة… ونلاقي طريقة نطلع.':'أنا جنبك. بص، فيه ورقة على الأرض هنا.');
}

  const c=G.comp;const i=await compTalk('قولي الرقم اللي لقيته عشان أفتكره معاك؟',['ماشي، خد','لا، هفتكره لوحدي']);
  if(i===0&&c.bad){await compTalk('تمام… (بيبصّ ناحية الضلمة ويهمس حاجة)');if(G.mon.state==='off')spawnMon();const m=G.mon;m.state='search';m.sx=G.px;m.sy=G.py;m.wait=0;SFX.growl(.5,0);toast('سمعت حاجة بتجري ناحيتك!',2400)}
  else if(i===0)await compTalk('حفظته! أنا ذاكرتي حديد.');

async function q3(){const c=G.comp;await compTalk('الوحش بيحب الضلمة ولا النور؟',['الضلمة','النور']);await compTalk(c.bad?'شغّل الكشاف على طول عشان نشوف كويس 🙂':'الكشاف بيلفت نظره من بعيد… طفيه لما يقرب، وخلي بالك من البطارية.')}

async function killMonster(){

/* ===================== granny cutscene (2D pixel) ===================== */
const W=256,H=160;
function P(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function cutRoom(g,o){
  P(g,0,0,W,114,'#2a2232');for(let x=0;x<W;x+=12)P(g,x,0,5,106,'#30283a');
  P(g,0,106,W,8,'#4a3020');P(g,0,106,W,1,'#6b4527');P(g,0,114,W,46,'#3b2618');for(let y=121;y<160;y+=9)P(g,0,y,W,1,'#2e1d12');
  P(g,22,20,48,50,'#5a3b22');P(g,26,24,40,42,'#0d1530');P(g,52,30,7,7,'#f2e6b0');P(g,55,29,5,5,'#0d1530');
  if(o.broken){P(g,30,30,26,26,'#060a18');for(let i=0;i<9;i++)P(g,28+((i*7)%30),28+((i*11)%30),2,2,'#cfe0ff')}
  P(g,45,24,2,42,'#5a3b22');P(g,26,44,40,2,'#5a3b22');
  if(o.star){const s=o.star;P(g,40,30-s*2,1,1+s*4,'#fff8c8');P(g,38-s*2,32,1+s*4,1,'#fff8c8');P(g,39,31,3,3,'#ffffff')}
  P(g,150,28,26,20,'#6b4a2a');P(g,153,31,20,14,'#9a7b5a');P(g,160,34,6,6,'#7a2338');P(g,161,36,4,3,'#c99a74');
  P(g,202,38,36,76,'#4a3020');const dr=o.door||0;
  if(dr>0){P(g,205,41,30,73,'#f6c86a');P(g,205,41,Math.max(3,Math.round(30*(1-dr))),73,'#6b4527');g.fillStyle='rgba(246,200,106,.18)';g.beginPath();g.moveTo(205,114);g.lineTo(235,114);g.lineTo(200,160);g.lineTo(120,160);g.closePath();g.fill()}
  else{const j=o.jig?ri(-1,1):0;P(g,205+j,41,30,73,'#6b4527');P(g,208+j,46,10,26,'#5a3a20');P(g,222+j,46,10,26,'#5a3a20');P(g,208+j,78,24,30,'#5a3a20');P(g,209+j,76,3,3,'#d8b04a')}
  P(g,70,90,70,24,'#5e1c24');P(g,74,84,62,12,'#7a2630');P(g,66,88,8,26,'#4e161d');P(g,136,88,8,26,'#4e161d');
}
function drawGranny(g,x,y,o={}){
  g.save();g.translate(Math.round(x),Math.round(y));if(o.rot)g.rotate(o.rot);
  const p=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(a,b,w,h)};
  if(o.cane==='up'){p(-1,-46,2,20,'#6b3f1e');p(-1,-48,6,2,'#6b3f1e');p(4,-48,2,4,'#6b3f1e')}
  else if(o.cane==='swing'){g.save();g.rotate(o.ca||0);p(-1,-34,2,24,'#6b3f1e');p(-1,-36,6,2,'#6b3f1e');g.restore()}
  p(-5,-2,4,2,'#3b2a20');p(1,-2,4,2,'#3b2a20');p(-6,-16,12,14,'#2f5a46');p(-7,-8,14,6,'#2f5a46');p(-4,-12,1,1,'#7fae8f');p(2,-9,1,1,'#7fae8f');p(-1,-6,1,1,'#7fae8f');
  if(o.cane==='up'){p(-7,-26,3,11,'#2f5a46');p(4,-26,3,11,'#2f5a46');p(-7,-28,3,2,'#c99a74');p(4,-28,3,2,'#c99a74')}
  else if(o.fix){p(-8,-15,3,8,'#2f5a46');p(4,-24,3,9,'#2f5a46');p(4,-25,3,2,'#c99a74');p(-8,-8,3,2,'#c99a74')}
  else{p(-8,-15,3,8,'#2f5a46');p(5,-15,3,8,'#2f5a46');p(-8,-8,3,2,'#c99a74');p(5,-8,3,2,'#c99a74')}
  p(-5,-26,10,11,'#7a2338');p(-6,-23,12,9,'#7a2338');p(-3,-24,7,7,'#c99a74');
  p(-3,-22,3,2,'#e9e4d8');p(1,-22,3,2,'#e9e4d8');p(-2,-22,1,1,'#222');p(2,-22,1,1,'#222');
  if(o.angry){p(-3,-23,3,1,'#3b2418');p(1,-23,3,1,'#3b2418')}
  p(-1,-19,3,1,'#7b4a3a');
  if(!o.cane){p(-10,-12,1,12,'#6b3f1e');p(-10,-13,4,1,'#6b3f1e')}
  if(o.bag){p(6,-12,8,9,'#c8b48a');p(7,-14,2,2,'#3a7a3a');p(10,-15,2,3,'#3a7a3a');p(8,-13,3,2,'#c33')}
  g.restore();
}
function drawMon2(g,x,y,o={}){g.save();g.translate(Math.round(x),Math.round(y));if(o.rot)g.rotate(o.rot);const s=o.s||1;g.drawImage(SPR.mon,-15*s,-60*s,30*s,60*s);g.restore()}
function drawKidPeek(g,t,stand){const yb=stand?70:84-Math.min(4,t*4);P(g,96,yb,10,9,'#c48d62');P(g,96,yb-1,10,3,'#2a1a12');P(g,98,yb+3,2,2,'#fff');P(g,103,yb+3,2,2,'#fff');P(g,99,yb+4,1,1,'#111');P(g,104,yb+4,1,1,'#111');if(stand){P(g,95,yb+9,12,14,'#4a6fb8');P(g,98,yb+6,6,1,'#7a3b2a')}}
function drawCloseup(g,t){
  P(g,0,0,W,H,'#120d16');P(g,56,0,144,H,'#7a2338');P(g,72,18,112,142,'#c99a74');
  P(g,80,60,40,26,'#2b2b2b');P(g,136,60,40,26,'#2b2b2b');P(g,84,64,32,18,'#cfe6ff');P(g,140,64,32,18,'#cfe6ff');P(g,120,70,16,4,'#2b2b2b');
  const sq=seg(t,6.9,7.6)*5;P(g,94,68+sq/2,12,10-sq,'#2a1a12');P(g,150,68+sq/2,12,10-sq,'#2a1a12');P(g,97,71+sq/3,4,3,'#fff');P(g,153,71+sq/3,4,3,'#fff');
  P(g,82,52+sq,34,5,'#4a3020');P(g,140,52+sq,34,5,'#4a3020');
  const gx=lerp(70,200,seg(t,6.5,7.3));g.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<10;i++)g.fillRect(gx-i,60+i*2.6,6,3);
  P(g,104,120,48,6,'#7b4a3a');P(g,96,100,6,2,'#a87a5a');P(g,154,100,6,2,'#a87a5a');P(g,90,40,20,2,'#a87a5a');P(g,146,40,20,2,'#a87a5a');
}
function drawMap(g,t){
  P(g,0,0,W,H,'#0e2a44');for(let i=0;i<40;i++)P(g,(i*37)%W,(i*53)%H,1,1,'#1d4566');
  g.fillStyle='#3f6b3a';[[86,22,60,30],[96,52,50,20],[100,70,46,40],[108,110,30,28],[140,14,100,60],[180,72,40,26],[214,40,24,30],[20,30,40,60],[32,90,20,40]].forEach(r=>g.fillRect(...r));
  P(g,138,64,10,10,'#4f7d47');P(g,141,67,4,4,(Math.floor(t*4)%2)?'#ff3b30':'#ffd0c8');P(g,200,52,4,4,'#f2d03a');
  const k=seg(t,15.6,18),x0=143,y0=69,x1=202,y1=54,cx=172,cy=8;
  for(let i=0;i<=20;i++){const u=i/20;if(u>k)break;const x=(1-u)*(1-u)*x0+2*(1-u)*u*cx+u*u*x1,y=(1-u)*(1-u)*y0+2*(1-u)*u*cy+u*u*y1;if(i%2===0)P(g,x,y,1,1,'#fff')}
  if(k<1){const u=k,x=(1-u)*(1-u)*x0+2*(1-u)*u*cx+u*u*x1,y=(1-u)*(1-u)*y0+2*(1-u)*u*cy+u*u*y1;g.save();g.translate(x,y);g.rotate(t*12);g.drawImage(SPR.mon,-4,-8,8,16);g.restore()}
  else{const r=seg(t,18,18.6)*10;g.fillStyle='#ffd56b';for(let i=0;i<8;i++){const a=i*Math.PI/4;g.fillRect(202+Math.cos(a)*r,54+Math.sin(a)*r,2,2)}}
}
function grannyScene(bad){
  const off=bad?4:0,dur=23+off;const compSpr=G.comp?SPR[COMPS[G.comp.id].spr+'R']:null;
  const ev=[
    [.3,()=>sub('(صوت مفتاح في الباب…)')],[.9,()=>SFX.jingle()],[1.6,()=>SFX.jingle()],
    [2.1,()=>{SFX.creak();sub('')}],[2.6,()=>{sub('<b>جدتك:</b> إيه الدوشة دي يا ولاد؟!');voice('إيه الدوشة دي يا ولاد','granny')}],
    [4.6,()=>{SFX.growl(.6,0);sub('(الوحش بيبص لجدتك…)')}],[4.9,()=>SFX.thud()],[6.2,()=>{sub('');SFX.sting()}],
    [8.3,()=>{sub('<b>جدتك:</b> إنت بتعمل إيه في بيتي؟!');voice('إنت بتعمل إيه في بيتي','granny')}],
    [9.4,()=>{sub('');SFX.whoosh()}],[10.3,()=>{big('هبش دربكش!','gold');voice('هبش دربكش','granny')}],
    [12,()=>SFX.bonk()],[13.3,()=>SFX.crash()],[14.2,()=>SFX.twinkle()],
    [15.2,()=>sub('<b>الوحش وصل الصين 🇨🇳</b>')],[18,()=>{SFX.bonk();SFX.twinkle()}],
  ];
  if(bad)ev.push([19.2,()=>{sub('<b>جدتك:</b> وانت كمان يا خاين؟!');voice('وانت كمان يا خاين','granny')}],[20.6,()=>{SFX.bonk();SFX.whoosh();sub('')}],[21.6,()=>{SFX.twinkle();sub('(الرفيق الخاين طار هو كمان 😂)')}]);
  ev.push([19.2+off,()=>sub('')],[19.8+off,()=>{sub('<b>جدتك:</b> قوم اغسل إيدك عشان العشا.');voice('قوم اغسل إيدك عشان العشا','granny')}]);
  return{dur,ev,draw(g,t){
    g.setTransform(1,0,0,1,0,0);
    const sh=(t>=12&&t<12.6)?ri(-3,3):0;g.translate(sh,sh);
    if(t>=6.2&&t<8.2){drawCloseup(g,t);return}
    if(t>=15&&t<19){drawMap(g,t);return}
    const broken=t>=13.3,star=t>=14.2&&t<15?((Math.floor(t*8)%2)+1):0;
    if(t>=19){
      cutRoom(g,{door:1,broken:true,star:(Math.floor(t*3)%3)===0?1:0});
      if(bad&&t<19+off){const k=seg(t,20.6,21.6);drawGranny(g,150,114,{cane:k>0?'swing':null,ca:-1.2+k*2.4,angry:true});
        if(k<1){g.save();g.translate(lerp(172,260,ease(k)),lerp(114,40,k));g.rotate(k*12);if(compSpr)g.drawImage(compSpr,-compSpr.width/2,-compSpr.height,compSpr.width,compSpr.height);g.restore()}
        drawKidPeek(g,1,false)}
      else{drawGranny(g,150,114,{fix:Math.floor(t*2)%2===0});drawKidPeek(g,1,t>19.8+off)}
      return;
    }
    cutRoom(g,{door:seg(t,2.0,2.6),jig:t<2,broken,star});
    if(t<12){drawMon2(g,170,114,{rot:t>4.6?Math.sin(t*3)*.04:0})}
    else if(t<12.6){drawMon2(g,170,114,{rot:Math.sin(t*60)*.08,s:1-seg(t,12,12.2)*.12});P(g,158,46,3,3,'#ffd56b');P(g,180,48,3,3,'#ffd56b');P(g,169,40,3,3,'#ffd56b')}
    else if(t<14.2){const k=ease(seg(t,12.6,13.6));drawMon2(g,lerp(170,46,k),lerp(114,46,k),{rot:k*10,s:lerp(1,.15,k)})}
    if(t>6)drawKidPeek(g,t-6,false);
    if(t>=2.2){
      if(t<8.2){const x=lerp(232,214,seg(t,2.2,3));drawGranny(g,x,114,{bag:t<4.8,angry:t>4.6});
        if(t>=4.8){const k=seg(t,4.8,5.2);P(g,lerp(216,212,k),lerp(102,110,k),8,6,'#c8b48a');for(let i=0;i<3;i++){const r=seg(t,5,6.2);P(g,212-r*(30+i*14),112,3,3,'#c33')}}}
      else if(t<9.4)drawGranny(g,214,114,{cane:'up',angry:true,rot:Math.sin(t*20)*.05});
      else if(t<12){const e=ease(seg(t,9.4,12));const x=lerp(214,170,e),y=lerp(114,58,e)-Math.sin(Math.PI*e)*44;drawGranny(g,x,y,{cane:'up',angry:true,rot:e*Math.PI*4});g.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<6;i++)g.fillRect(x+10+i*6,y-20+i*5,10,1)}
      else if(t<12.6){drawGranny(g,170,56,{cane:'swing',ca:1.2,angry:true});if(t<12.15){g.fillStyle='rgba(255,255,255,.8)';g.fillRect(0,0,W,H)}}
      else{const k=seg(t,12.6,13.1);drawGranny(g,lerp(170,160,k),lerp(56,114,ease(k)),{angry:true})}
    }
  }};
}

  SFX.win();G.mode='end';
  panel(`<h1>القبو</h1><p class="tag">نهاية الفصل الأول</p>
  <div class="stats"><span>الوقت</span><span>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</span><span>الوحش مسكك</span><span>${G.caught} مرة</span><span>الرفيق</span><span>${cs}</span></div>
  <div class="next"><span class="muted">بعد ١٥ سنة…</span><b>الفصل التاني: الطاعون الأسود</b><span class="muted">قريبًا</span></div>
  <div class="stack"><button class="primary" id="pAgain">العب تاني</button></div>`,(r,close)=>{r.querySelector('#pAgain').onclick=()=>{close();location.reload()}});
}

  const sv=loadSave();G.mode='title';ui.overlay.hidden=false;
  const portrait=innerHeight>innerWidth;
  ui.card.innerHTML=`<h1>القبو</h1><p class="tag">الفصل الأول: ليلة القبو</p>
  <div class="stack"><button class="primary" id="pNew">ابدأ</button>${sv?`<button id="pCont">كمّل من ${sv.stage==='base'?'القبو':'البيت (المرحلة التالتة)'}</button>`:''}</div>
  ${portrait?'<div class="tip">📱 لف الموبايل بالعرض، اللعب بيبقى أحسن بكتير.</div>':''}
  <p class="muted" style="margin-top:12px">🎧 السماعات بتفرق جدًا.<br>العصا اللي على الشمال: امشي لقدام وورا ويمين وشمال.<br>اسحب بصباعك في أي حتة تانية في الشاشة: تبص حواليك.<br>كمبيوتر: WASD للمشي، اسحب بالماوس للبص، E للتفاعل، Shift للجري، F للكشاف.</p>`;
  $('#pNew').onclick=()=>{aInit();SFX.click();clearSave();intro()};
  if(sv)$('#pCont').onclick=()=>{aInit();SFX.click();continueFrom(sv)};
}
function beginHUD(){ui.controls.hidden=false;ui.obj.hidden=false;ui.inv.hidden=false;ui.cross.hidden=false;G.tStart=performance.now()}
function intro(){
  ui.card.innerHTML=`<div class="story"><p class="muted">الساعة ٣:١٧ الفجر.</p><p>البيت ساكت… وفجأة صوت دق تقيل جاي من تحت.<br>من القبو.</p><p class="knock">دُق… دُق… دُق…</p><div class="stack"><button class="primary" id="pUp">قوم من السرير</button></div></div>`;
  setTimeout(()=>SFX.knock(.6,0),300);
  $('#pUp').onclick=()=>{SFX.click();ui.overlay.hidden=true;loadHouse('house1');placePlayer(3.3,2.4,Math.PI/2);G.stageT=0;setAmb(.25);beginHUD();hudSync();setObj('روح لباب القبو اللي في آخر الطرقة.');G.mode='play';toast('امشي بالعصا اللي على الشمال، واسحب على الشاشة عشان تبص',3200)};
}
function continueFrom(sv){ui.overlay.hidden=true;setupComp(sv.comp||'zinger');G.comp.bad=!!sv.bad;beginHUD();if(sv.stage==='base')startBasement();else startHouse2()}

/* ===================== loop ===================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;lastDt=dt;const t=now/1000;
  try{update(dt);if(G.mode==='cut2d'&&G.cut){G.cut.sc.draw(cctx,G.cut.t)}else{syncScene(dt,t);render()}}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
buildArt();resize();loadHouse('house1');placePlayer(3.3,2.4,Math.PI/2);title();requestAnimationFrame(frame);
window.__qabw={G,act,loadBase,loadHouse,startHouse2,startBasement,grannyTime,killMonster,setupComp,placePlayer,makeComp,spawnMon,caught,inp};
})();
</script>
