<title>لعبة القبو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen low-res 3D view upscaled with hard pixels; HUD and touch controls float over it */
:root{
  --bg:#060508; --ink:#f1e8da; --muted:#a397ad; --blood:#cf2f2c; --amber:#f4b740;
  --panel:#130f18; --edge:#2e2638; --ok:#5fd18a;
  --display:'Lalezar','Tajawal',system-ui,sans-serif;
  --body:'Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:16px/1.55 var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none;display:block}
#cut{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,160vh);aspect-ratio:8/5;max-height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;z-index:5}
#cutbg{position:fixed;inset:0;background:#000;z-index:4}
#hideov{position:fixed;inset:0;pointer-events:none;z-index:2}
#hideov.closet{background:repeating-linear-gradient(180deg,rgba(0,0,0,.94) 0 6vh,transparent 6vh 9vh)}
#hideov.bed{background:linear-gradient(180deg,rgba(0,0,0,.95) 0 46%,rgba(30,20,14,.9) 46% 52%,transparent 52%)}
#hud{position:fixed;inset:0;pointer-events:none;direction:rtl;z-index:3}
#obj{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));max-width:min(60%,420px);font-size:14px;line-height:1.4;background:rgba(6,5,8,.66);padding:5px 10px;border-radius:4px;border-right:3px solid var(--amber)}
.inv{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:6px;direction:ltr;align-items:center}
.chip{background:rgba(6,5,8,.66);padding:3px 8px;border-radius:4px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.charge{width:50px;height:9px;padding:3px;display:block}
.charge i{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .2s}
#timer{position:absolute;top:calc(44px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:24px/1 var(--display);background:rgba(6,5,8,.66);padding:6px 14px 4px;border-radius:4px;white-space:nowrap}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);max-width:80%;text-align:center;font-weight:700;font-size:16px;background:rgba(6,5,8,.78);padding:7px 14px;border-radius:5px;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(241,232,218,.55)}
#prompt{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);font-size:14px;font-weight:700;background:rgba(207,47,44,.9);padding:3px 12px;border-radius:12px;white-space:nowrap}
#subs{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);width:92%;text-align:center;font-size:clamp(15px,2.6vw,24px);font-weight:700;text-shadow:0 2px 0 #000,0 0 6px #000;z-index:6;pointer-events:none;direction:rtl}
#subs b{color:var(--amber)}
#mini{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(40px + env(safe-area-inset-top,0px));image-rendering:pixelated;border:1px solid var(--edge);background:rgba(0,0,0,.6)}
#qte{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:min(70%,420px);text-align:center}
.qbar{position:relative;height:18px;background:rgba(0,0,0,.75);border:2px solid var(--ink);border-radius:3px}
.qbar .zone{position:absolute;top:0;bottom:0;background:var(--ok)}
.qbar .mark{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--blood);box-shadow:0 0 6px var(--blood)}
.qlbl{margin-top:6px;font-weight:800;font-size:16px;text-shadow:0 2px 0 #000}
#controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;direction:ltr;z-index:3;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
#stick{pointer-events:auto;width:140px;height:140px;border-radius:50%;background:rgba(241,232,218,.06);border:2px solid rgba(241,232,218,.18);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(241,232,218,.24);border:2px solid rgba(241,232,218,.45)}
.btns{pointer-events:auto;display:grid;grid-template-columns:repeat(3,58px);gap:9px;direction:rtl;align-items:end}
.btn{width:58px;height:58px;border-radius:50%;border:2px solid var(--edge);background:rgba(19,15,24,.78);color:var(--ink);font:700 13px var(--body);touch-action:none;padding:0}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn.act{grid-column:span 3;width:100%;height:58px;border-radius:29px;background:rgba(207,47,44,.92);border-color:#ff6f62;font-size:17px}
.btn:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;direction:rtl;background:linear-gradient(transparent,rgba(4,3,6,.96) 22%);
  padding:40px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheetin{max-width:620px;margin:0 auto}
#who{font:24px/1 var(--display);color:var(--amber);margin-bottom:6px}
#sayT{font-size:19px;font-weight:500;min-height:2.4em;white-space:pre-line}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.choices button{flex:1 1 180px}
.choices button,.card button{font:700 16px var(--body);color:var(--ink);background:#221b2a;border:1px solid #3c3247;border-radius:8px;padding:11px 14px;text-align:right;cursor:pointer}
.card button.primary,.choices button.primary{background:var(--blood);border-color:#ff6f62;text-align:center}
#overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(4,3,6,.8);direction:rtl;touch-action:pan-y;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-sizing:border-box}
.card h1{font:clamp(60px,18vw,110px)/.9 var(--display);margin:0;color:var(--ink);text-shadow:0 0 18px rgba(207,47,44,.55),4px 4px 0 #3a0d0e;text-align:center}
.card h2{font:28px/1.1 var(--display);margin:0 0 8px;color:var(--amber)}
.card p{margin:0 0 10px}
.tag{text-align:center;color:var(--muted);margin-top:6px!important;font-weight:700}
.muted{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.row{display:flex;gap:9px;margin-top:14px}.row>*{flex:1}
.story p{font-size:18px}
.story .knock{font:30px/1.2 var(--display);color:var(--blood);text-align:center;margin:12px 0}
.tip{background:#1d1724;border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:12px}
.comps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.comp{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center!important;padding:10px 6px!important}
.comp canvas{width:64px;height:64px;image-rendering:pixelated}
.comp b{font:20px/1 var(--display);color:var(--amber)}
.comp small{font-weight:500;font-size:12px;color:var(--muted);line-height:1.35}
.dials{display:flex;justify-content:center;gap:14px;margin:12px 0;direction:ltr}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial .sym{font-size:26px;color:var(--blood);font-weight:800;line-height:1}
.dial .dv{font:40px/1 var(--display);width:56px;text-align:center;background:#0b0910;border:1px solid var(--edge);border-radius:6px;padding:8px 0 4px;font-variant-numeric:tabular-nums}
.dial button{width:56px;text-align:center!important;padding:6px!important}
.clues{background:#0b0910;border:1px dashed #4a3c56;border-radius:6px;padding:8px 10px;font-size:15px;white-space:pre-line}
.slots{display:flex;gap:8px;justify-content:center;margin:12px 0;direction:rtl}
.slot{width:52px;height:52px;border-radius:8px;border:2px dashed #4a3c56;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.wires{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wires button{text-align:center!important;color:#111!important;font-weight:800!important}
.levers{display:flex;justify-content:center;gap:10px;margin:14px 0;direction:ltr}
.lev{display:flex;flex-direction:column;align-items:center;gap:6px}
.lamp{width:22px;height:22px;border-radius:50%;background:#2b2b2b;border:2px solid #111}
.lamp.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.lev button{width:46px;height:70px;padding:0!important;text-align:center!important;font-size:22px!important}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:12px 0;font-size:15px}
.stats span:nth-child(even){font-variant-numeric:tabular-nums;color:var(--amber);font-weight:700}
.next{border-top:1px solid var(--edge);padding-top:12px;margin-top:12px;text-align:center}
.next b{display:block;font:24px/1.2 var(--display);color:var(--blood)}
#big{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;pointer-events:none;direction:rtl;text-align:center;
  font:clamp(48px,14vw,130px)/1 var(--display);color:var(--ink);text-shadow:0 0 24px rgba(207,47,44,.9),5px 5px 0 #000;opacity:0}
#big.on{animation:pop .9s ease-out forwards}
#big.gold{color:#ffd56b;text-shadow:0 0 26px rgba(255,190,60,.9),5px 5px 0 #3b1d00}
@keyframes pop{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}18%{opacity:1;transform:scale(.92) rotate(2deg)}30%{transform:scale(1.05)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#boss{position:absolute;top:calc(44px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(60%,360px);text-align:center;font:18px/1 var(--display);color:var(--blood);text-shadow:0 2px 0 #000}
.bb{height:9px;margin-top:4px;background:rgba(0,0,0,.7);border:1px solid #5a1a1a;border-radius:3px}.bb i{display:block;height:100%;width:100%;background:var(--blood);transition:width .2s}
.btn.fire{background:rgba(220,120,30,.92);border-color:#ffb060}
#hideov.veins{background:radial-gradient(ellipse at center,transparent 30%,rgba(70,0,0,.8) 85%),repeating-linear-gradient(115deg,transparent 0 22px,rgba(20,0,0,.4) 22px 25px),repeating-linear-gradient(35deg,transparent 0 30px,rgba(20,0,0,.35) 30px 33px)}
#hideov.vil{background:radial-gradient(ellipse at center,transparent 45%,rgba(60,0,20,.55) 95%)}
#hideov.fog{background:radial-gradient(ellipse at 50% 55%,rgba(225,235,245,.38),rgba(225,235,245,.08) 45%,transparent 70%)}
.card button[disabled]{cursor:default}
#fade{position:fixed;inset:0;z-index:25;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){#big.on{animation-duration:.01s;opacity:1}}
</style>

</div>
<div id="subs"></div>
<div id="controls" hidden>
  <div id="stick"><div id="knob"></div></div>
  <div class="btns">
    <button class="btn on" id="bLight">كشاف</button>

function grannyScene(bad){

    [9.4,()=>{sub('');SFX.whoosh()}],[10.3,()=>{big('هبش دربكش!','gold');voice('هبش دربكش','granny')}],
    [12,()=>SFX.bonk()],[13.3,()=>SFX.crash()],[14.2,()=>SFX.twinkle()],
    [15.2,()=>sub('<b>الوحش وصل الصين 🇨🇳</b>')],[18,()=>{SFX.bonk();SFX.twinkle()}],
  ];
  if(bad)ev.push([19.2,()=>{sub('<b>جدتك:</b> وانت كمان يا خاين؟!');voice('وانت كمان يا خاين','granny')}],[20.6,()=>{SFX.bonk();SFX.whoosh();sub('')}],[21.6,()=>{SFX.twinkle();sub('(الرفيق الخاين طار هو كمان 😂)')}]);
  ev.push([19.2+off,()=>sub('')],[19.8+off,()=>{sub('<b>جدتك:</b> قوم اغسل إيدك عشان العشا.');voice('قوم اغسل إيدك عشان العشا','granny')}]);
  return{dur,ev,draw(g,t){
    g.setTransform(1,0,0,1,0,0);
    const sh=(t>=12&&t<12.6)?ri(-3,3):0;g.translate(sh,sh);
    if(t>=6.2&&t<8.2){drawCloseup(g,t);return}
    if(t>=15&&t<19){drawMap(g,t);return}
    const broken=t>=13.3,star=t>=14.2&&t<15?((Math.floor(t*8)%2)+1):0;
    if(t>=19){
      cutRoom(g,{door:1,broken:true,star:(Math.floor(t*3)%3)===0?1:0});
      if(bad&&t<19+off){const k=seg(t,20.6,21.6);drawGranny(g,150,114,{cane:k>0?'swing':null,ca:-1.2+k*2.4,angry:true});
        if(k<1){g.save();g.translate(lerp(172,260,ease(k)),lerp(114,40,k));g.rotate(k*12);if(compSpr)g.drawImage(compSpr,-compSpr.width/2,-compSpr.height,compSpr.width,compSpr.height);g.restore()}
        drawKidPeek(g,1,false)}
      else{drawGranny(g,150,114,{fix:Math.floor(t*2)%2===0});drawKidPeek(g,1,t>19.8+off)}
      return;
    }
    cutRoom(g,{door:seg(t,2.0,2.6),jig:t<2,broken,star});
    if(t<12){drawMon2(g,170,114,{rot:t>4.6?Math.sin(t*3)*.04:0})}
    else if(t<12.6){drawMon2(g,170,114,{rot:Math.sin(t*60)*.08,s:1-seg(t,12,12.2)*.12});P(g,158,46,3,3,'#ffd56b');P(g,180,48,3,3,'#ffd56b');P(g,169,40,3,3,'#ffd56b')}
    else if(t<14.2){const k=ease(seg(t,12.6,13.6));drawMon2(g,lerp(170,46,k),lerp(114,46,k),{rot:k*10,s:lerp(1,.15,k)})}
    if(t>6)drawKidPeek(g,t-6,false);
    if(t>=2.2){
      if(t<8.2){const x=lerp(232,214,seg(t,2.2,3));drawGranny(g,x,114,{bag:t<4.8,angry:t>4.6});
        if(t>=4.8){const k=seg(t,4.8,5.2);P(g,lerp(216,212,k),lerp(102,110,k),8,6,'#c8b48a');for(let i=0;i<3;i++){const r=seg(t,5,6.2);P(g,212-r*(30+i*14),112,3,3,'#c33')}}}
      else if(t<9.4)drawGranny(g,214,114,{cane:'up',angry:true,rot:Math.sin(t*20)*.05});
      else if(t<12){const e=ease(seg(t,9.4,12));const x=lerp(214,170,e),y=lerp(114,58,e)-Math.sin(Math.PI*e)*44;drawGranny(g,x,y,{cane:'up',angry:true,rot:e*Math.PI*4});g.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<6;i++)g.fillRect(x+10+i*6,y-20+i*5,10,1)}
      else if(t<12.6){drawGranny(g,170,56,{cane:'swing',ca:1.2,angry:true});if(t<12.15){g.fillStyle='rgba(255,255,255,.8)';g.fillRect(0,0,W,H)}}
      else{const k=seg(t,12.6,13.1);drawGranny(g,lerp(170,160,k),lerp(56,114,ease(k)),{angry:true})}
    }
  }};
}

let voiceBuf=null;
async function playVoice(){if(!A.c)return 0;try{if(!voiceBuf){const bin=atob(VOICE_B64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);voiceBuf=await A.c.decodeAudioData(u.buffer)}const s=A.c.createBufferSource();s.buffer=voiceBuf;const g=A.c.createGain();g.gain.value=1.6;s.connect(g);g.connect(bus(0,.45));s.start();return voiceBuf.duration}catch(e){return 0}}
let rainNode=null;
function rain(on){if(!A.c)return;if(on&&!rainNode){const c=A.c,s=c.createBufferSource();s.buffer=A.nb;s.loop=true;const h=c.createBiquadFilter();h.type='highpass';h.frequency.value=1200;const l=c.createBiquadFilter();l.type='lowpass';l.frequency.value=7000;const g=c.createGain();g.gain.value=.07;s.connect(h);h.connect(l);l.connect(g);g.connect(A.m);s.start();rainNode={s,g}}else if(!on&&rainNode){const r=rainNode;r.g.gain.setTargetAtTime(0,A.c.currentTime,.4);setTimeout(()=>{try{r.s.stop()}catch(e){}},1500);rainNode=null}}
let rotorT=0;
SFX.bang=b=>{noise(b?.35:.18,{v:b?.9:.6,f:b?1800:2600,to:200,wet:.35});tone(b?90:140,.25,{v:.5,to:40})};
SFX.cough=pan=>{noise(.12,{v:.25,f:900,ft:'bandpass',q:2,pan,wet:.2});noise(.1,{at:.18,v:.2,f:800,ft:'bandpass',q:2,pan,wet:.2})};
SFX.hit=()=>{noise(.08,{v:.35,f:600});tone(110,.12,{v:.3,to:60})};
SFX.rumble=(d=4,v=.25)=>noise(d,{v,f:120,wet:.1});
SFX.boom=()=>{noise(1.2,{v:1,f:700,to:50,wet:.6});tone(45,1,{v:.8,to:25})};
SFX.tap=()=>{tone(320,.08,{type:'triangle',v:.25,wet:.6});noise(.05,{v:.2,f:1500,wet:.6})};
const TWEENS=[];
function tween(dur,fn){return new Promise(res=>TWEENS.push({t:0,dur,fn,res}))}
function runTweens(dt){for(let i=TWEENS.length-1;i>=0;i--){const w=TWEENS[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(k);if(k>=1){TWEENS.splice(i,1);w.res()}}}

function buildPerson(o={}){
  const g=new THREE.Group();const sc=o.scale||1;

  const shoe=col(0x161616);
  const legL=pivot(g,-.1,.9,0),legR=pivot(g,.1,.9,0);
  for(const l of[legL,legR]){box(l,.15,.86,.17,pants,0,-.43,0);box(l,.16,.07,.26,shoe,0,-.86,.05)}
  const torso=pivot(g,0,.9,0);box(torso,.44,.62,.24,shirt,0,.31,0);

  const neck=pivot(torso,0,.62,0);box(neck,.1,.08,.1,skin,0,.04,0);

  const eyes=[box(head,.05,.03,.01,em,-.06,.17,.137),box(head,.05,.03,.01,em,.06,.17,.137)];eyes.forEach(e=>e.visible=false);

function setLook(v,k){

function floorTiles(){const m=G.map,a=[];for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++)if(!isSolid(m.g[y][x]))a.push([x+.5,y+.5]);return a}
function bfsFar(sx,sy){const m=G.map,w=m.w,d=new Int32Array(w*m.h).fill(-1),q=[sy*w+sx];d[q[0]]=0;let h=0,last=q[0];while(h<q.length){const c=q[h++];last=c;const cx=c%w,cy=(c/w)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(solidAt(nx,ny))continue;const n=ny*w+nx;if(d[n]<0){d[n]=d[c]+1;q.push(n)}}}return{d,far:[last%w+.5,((last/w)|0)+.5]}}
function randFloorNear(x,y,r){for(let i=0;i<12;i++){const nx=x+rand(-r,r),ny=y+rand(-r,r);if(!solidAt(Math.floor(nx),Math.floor(ny)))return[Math.floor(nx)+.5,Math.floor(ny)+.5]}return[x,y]}
function farFloor(min){const a=G.floors.filter(p=>Math.hypot(p[0]-G.px,p[1]-G.py)>=min);return pick(a.length?a:G.floors)}
function panOf(o){return Math.sin(angDiff(Math.atan2(o.y-G.py,o.x-G.px),G.pa))}
function genMaze(W,H,wall){
  const g=Array.from({length:H},()=>Array(W).fill(wall));const st=[[1,1]];g[1][1]='.';
  while(st.length){const[x,y]=st[st.length-1];const nb=[[2,0],[-2,0],[0,2],[0,-2]].map(([dx,dy])=>[x+dx,y+dy,x+dx/2,y+dy/2]).filter(([nx,ny])=>nx>0&&ny>0&&nx<W-1&&ny<H-1&&g[ny][nx]===wall);
    if(!nb.length){st.pop();continue}const[nx,ny,mx,my]=pick(nb);g[my][mx]='.';g[ny][nx]='.';st.push([nx,ny])}
  for(let i=0;i<W*H/12;i++){const x=ri(1,W-2),y=ri(1,H-2);if(g[y][x]===wall&&((g[y][x-1]==='.'&&g[y][x+1]==='.')||(g[y-1][x]==='.'&&g[y+1][x]==='.')))g[y][x]='.'}
  for(let i=0;i<4;i++){const x=ri(2,W-5),y=ri(2,H-5);for(let yy=y;yy<y+3;yy++)for(let xx=x;xx<x+3;xx++)if(yy<H-1&&xx<W-1)g[yy][xx]='.'}
  return g.map(r=>r.join(''));
}
function genRooms(W,H,wall,alt){
  const g=Array.from({length:H},()=>Array(W).fill(wall));const cs=6,cx=Math.floor((W-1)/cs),cy=Math.floor((H-1)/cs);
  for(let j=0;j<cy;j++)for(let i=0;i<cx;i++){for(let y=j*cs+1;y<j*cs+cs;y++)for(let x=i*cs+1;x<i*cs+cs;x++)g[y][x]='.';
    if(i<cx-1){const dy=j*cs+ri(2,4);g[dy][i*cs+cs]='.';if(Math.random()<.4)g[dy+1][i*cs+cs]='.'}
    if(j<cy-1){const dx=i*cs+ri(2,4);g[j*cs+cs][dx]='.';if(Math.random()<.4)g[j*cs+cs][dx+1]='.'}}
  if(alt)for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]===wall&&Math.random()<.12)g[y][x]=alt;
  return g.map(r=>r.join(''));
}
function genCity(W,H,walls,o={}){
  const g=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>(x===0||y===0||x===W-1||y===H-1)?walls[0]:'.'));
  const st=o.big?9:6,mn=o.big?5:2,mx=o.big?7:4;

function lvlTick(dt){
  const L=G.lvl;G.lt+=dt;
  if(G.fireCD>0)G.fireCD-=dt;if(G.meleeCD>0)G.meleeCD-=dt;if(G.shotT>0)G.shotT-=dt;
  zingerFight(dt);
  if(G.vil){vilTick(dt);return}
  sickTick(dt);if(L.veh)vehicleTick(dt);
  for(const o of G.objs){if(o.pick&&!o.gone&&Math.hypot(o.x-G.px,o.y-G.py)<.6)pickup(o)}
  for(const o of G.ens)enemyTick(o,dt);
  if(G.boss)bossTick(G.boss,dt);else if(!G.ens.some(e=>e.st==='chase'))setMon(0,0);
  if(G.inf>0&&!L.noInf)G.inf=Math.min(100,G.inf+dt*.12);
  if(G.inf>=100&&G.mode==='play'){G.mon=G.ens.find(e=>e.st!=='dead')||G.boss;G.deathWhy='inf';if(G.mon)caught()}
  if(L.roll)G.roll=Math.sin(G.lt*.8)*L.roll;

}

function makeSick(o,dur){if(o.ps!=='ok')return;o.ps='sick';o.prog=0;o.dur=dur||rand(26,34);o.coughT=rand(.5,2);o.twT=rand(1,3);o.stage=1;o.anim=sickAnim}

function sickAnim(o,dt,t){const v=o.vis;if(o.ps!=='sick')return;const st=o.stage;o.twT-=dt;if(o.twT<=0){o.twT=st===3?rand(.3,.9):st===2?rand(1,2.5):rand(2,4);o.jerk=st===3?.5:.3}
  if(o.jerk>0){o.jerk-=dt;const a=st*.35;v.head.rotation.x=rand(-a,a*.6);v.head.rotation.z=rand(-a,a);v.torso.rotation.x=.2+rand(-a*.3,a*.4);v.torso.rotation.z=rand(-a*.3,a*.3);v.armL.rotation.x=rand(-a*2,0);v.armR.rotation.x=rand(-a*2,0)}
  else{v.head.rotation.x=lerp(v.head.rotation.x,.3,.1);v.head.rotation.z=lerp(v.head.rotation.z,0,.1);v.torso.rotation.x=lerp(v.torso.rotation.x,.15+Math.sin(t*2)*.05,.1);v.torso.rotation.z=lerp(v.torso.rotation.z,0,.1)}
  if(st===3)v.eyes.forEach(e=>e.visible=Math.random()<.5)}

    if(st!==o.stage){o.stage=st;if(st===2)setLook(o.vis,'sick');if(st===3&&Math.hypot(o.x-G.px,o.y-G.py)<7)toast('فيه حد بيتشنّج جامد!',1500)}
    o.coughT-=dt;if(o.coughT<=0){o.coughT=o.stage===3?rand(1,2):rand(2.5,4.5);SFX.cough(panOf(o));if(o.stage===3)noise(.4,{v:.15,f:250,ft:'bandpass',q:5,pan:panOf(o),wet:.2})}
    if(o.prog>=1)startTurn(o)}

  for(const e of G.ens){if(e.st==='dead')continue;e.biteT=(e.biteT??4)-dt;if(e.biteT>0)continue;e.biteT=5;let n=null,bd=1.6;

  if(k<1.8){const a=1+k;v.torso.rotation.x=rand(-.45,.45)*a*.6;v.torso.rotation.z=rand(-.35,.35)*a*.6;v.head.rotation.x=-.9+rand(-.4,.4);v.head.rotation.z=rand(-.6,.6);v.armL.rotation.x=rand(-2.6,.4);v.armR.rotation.x=rand(-2.6,.4);v.armL.rotation.z=rand(-.6,.2);v.armR.rotation.z=rand(-.2,.6);o.mesh.position.x+=rand(-.03,.03);if(Math.random()<.1)SFX.hit()}
  else if(o.wasSeated&&k<2.6){const e=ease(seg(k,1.8,2.6));o.seated=false;o.yo=lerp(-.42,0,e);o.y=lerp(o.sy,o.aisle??2.5,e);v.torso.rotation.set(lerp(.6,.25,e),0,0);v.head.rotation.set(lerp(.9,.1,e),0,0);v.armL.rotation.z=v.armR.rotation.z=0;v.legL.rotation.x=v.legR.rotation.x=lerp(-1.5,0,e)}

function vilRestart(){G.roll=0;G.pitch=0;ui.hideov.className='';ui.timer.hidden=true;$('#bLight').hidden=false;ui.controls.hidden=false;ui.obj.hidden=false;ui.inv.hidden=false;ui.cross.hidden=false;fade(0,500);restartLevel()}
function vilBite(){
  if(G.fireCD>0)return;G.fireCD=.6;G.recoil=1;SFX.growl(.35,0);
  const o=vilTarget();if(!o)return;

  setTimeout(()=>{if(G.vil&&o.ps==='bitten'){o.lie=false;setLook(o.vis,'z');o.zarms=true;o.isMon=true;o.rig=true;o.ps='ally';o.biteT=3}},2600);
}
function vilAct(){

function vilTick(dt){
  const V=G.vil;G.red=Math.max(G.red,.25);if(G.hp<100)G.hp=Math.min(100,G.hp+dt*1.2);
  const tg=vilTarget();ui.prompt.hidden=!tg;if(tg)ui.prompt.textContent=tg===G.cObj?'زنجر… (عضّ = حوّله)':'عضّ = حوّله · تفاعل = اقتله';
  for(const o of G.objs){
    if(!(o.civ||o.sold||o.pax)||o.gone)continue;
    if(o.ps==='ok'||o.ps==='sick'){
      if(o.seated)continue;
      const dx=o.x-G.px,dy=o.y-G.py,d=Math.hypot(dx,dy)||.01;
      if(o.sold){
        if(d<13&&los(o.x,o.y,G.px,G.py)){o.face=lerpAng(o.face,Math.atan2(-dx,-dy),.2);o.speed=0;
          if(d>4.5)moveMon(o,G.px,G.py,1.1*dt);
          o.shootT=(o.shootT??rand(.8,1.6))-dt;if(o.shootT<=0){o.shootT=rand(1.3,2.2);SFX.bang(false);
            if(Math.random()<.4){G.hp-=8;G.red=.8;G.shake=.4;SFX.hit();if(G.hp<=0&&!G.lf.vdead){G.lf.vdead=1;villainDie()}}}}
        else moveMon(o,G.px,G.py,1*dt);
      }else if(!o.pax||true){
        if(d<6){const t=randFloorNear(o.x+dx/d*4,o.y+dy/d*4,1.5);moveMon(o,t[0],t[1],2.1*dt)}
        else{o.wt=(o.wt||0)-dt;if(o.wt<=0||!o.wp){o.wp=randFloorNear(o.x,o.y,4);o.wt=rand(3,6)}moveMon(o,o.wp[0],o.wp[1],.5*dt)}
      }
    }else if(o.ps==='ally'){
      let n=null,bd=10;for(const h of vilHumans()){if(h===G.cObj)continue;const d=Math.hypot(h.x-o.x,h.y-o.y);if(d<bd){bd=d;n=h}}
      if(n){moveMon(o,n.x,n.y,1.25*dt);o.biteT-=dt;if(bd<.8&&o.biteT<=0){o.biteT=4;n.ps='bitten';n.lie=true;n.seated=false;n.yo=0;n.solid=0;n.anim=null;SFX.scream();V.bites++;setTimeout(()=>{if(G.vil&&n.ps==='bitten'){n.lie=false;setLook(n.vis,'z');n.zarms=true;n.isMon=true;n.rig=true;n.ps='ally';n.biteT=3}},2600)}}else o.speed=0;
    }
  }
  V.spT-=dt;if(V.spT<=0){V.spT=22;if(G.objs.filter(o=>o.sold&&o.ps==='ok').length<3){spawnSoldier();toast('جنود جداد جايين!',1400)}}
  const c=V.cur;
  if(c&&G.mode==='play'){c.t-=dt;V.ensT=(V.ensT||0)-dt;if(V.ensT<=0){V.ensT=3;const pr=c.k==='bite'||c.k==='spare'?V.bites-c.b0:c.k==='kill'?V.sk-c.k0:0;vilEnsure(c,c.n-pr)}
    const prog=c.k==='bite'?V.bites-c.b0:c.k==='kill'?V.sk-c.k0:c.k==='spare'?V.bites-c.b0:c.got;
    ui.timer.hidden=false;ui.timer.textContent=`👑 ${c.txt.split('.')[0]} (${Math.min(prog,c.n)}/${c.n}) · ${Math.max(0,Math.ceil(c.t))} ث`;
    if(prog>=c.n){V.cur=null;V.done++;V.i++;ui.timer.hidden=true;SFX.win();hudSync();princessMsg(pick(['«أحسنت يا ابني.»','«كده… كده بالظبط.»','«انت أحسن ولادي.»'])).then(()=>nextOrder())}
    else if(c.t<=0){V.cur=null;ui.timer.hidden=true;punish('«اتأخرت! أنا مبحبش الانتظار.»').then(()=>{if(G.vil){const o2=V.list[V.i];V.cur={...o2,got:0,t:o2.t,b0:V.bites,k0:V.sk,h0:V.kills}}})}
  }
  if(!c&&G.mode==='play'){V.ensT=(V.ensT||0)-dt;if(V.ensT<=0){V.ensT=3;const need=V.goal-V.bites;if(need>0&&vilHumCount()<Math.min(need,3)){for(let i=0;i<Math.min(need,3);i++)spawnCiv();toast('ناس جديدة جاية…',1400)}}}
  if(!V.fin&&!c&&V.i>=V.list.length&&V.bites>=V.goal&&G.mode==='play')vilLevelDone();
  if(Math.floor(G.lt*4)!==Math.floor((G.lt-dt)*4))hudSync();
}
