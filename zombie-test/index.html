<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test Street</title>
<style>
:root { --bg: #0b0c0e; --fg: #eef0f2; --dim: #9aa3ad; --accent: #e8b04a; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #0b0c0e; --fg: #eef0f2; } }
:root[data-theme="dark"] { --bg: #0b0c0e; --fg: #eef0f2; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; touch-action: none; }
#load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); padding: 16px; text-align: center; }
#load h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
.track { width: min(320px, 80vw); height: 6px; background: #22262b; border-radius: 3px; overflow: hidden; }
#bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
#msg { color: var(--dim); }
#hud { display: none; }
#fps { position: fixed; top: 10px; left: 12px; color: #fff8; font-size: 12px; text-shadow: 0 1px 2px #000; }
#help { position: fixed; top: 10px; right: 12px; color: #fffc; font-size: 12px; text-shadow: 0 1px 2px #000; text-align: right; max-width: 60vw; }
.btn { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; border: 2px solid #fff6; background: #0006; color: #fff; font-size: 12px; font-weight: 600; }
.btn.on { background: #e8b04acc; color: #111; }
#btnRun { right: 22px; } #btnView { right: 92px; } #btnCar { right: 22px; bottom: 100px; display: none; background: #e8b04acc; color: #111; } .btn.small { width: 46px; height: 46px; top: 40px; bottom: auto; right: 16px; font-size: 11px; }
#help { top: 96px !important; }
#vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.38) 100%); }
#stick { display: block; left: 30px; bottom: 30px; opacity: .55; position: fixed; width: 110px; height: 110px; border-radius: 50%; border: 2px solid #fff5; background: #0003; pointer-events: none; }
#knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: #fff8; }
</style></head>
<body>
<div id="load"><h1>TEST STREET</h1><div class="track"><div id="bar"></div></div><div id="msg">بيحمّل…</div></div>
<div id="hud"><div id="fps"></div><div id="help">شمال الشاشة: المشي واللف · يمين الشاشة: تبص حواليك</div>
<button class="btn" id="btnView">منظور</button><button class="btn" id="btnRun">جري</button><button class="btn" id="btnCar">اركب</button><button class="btn small" id="btnFps">أعلى</button>
<div id="vig"></div><div id="stick"><div id="knob"></div></div></div>
<script src="game.js"></script>
</body></html>
