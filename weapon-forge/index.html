<title>ورشة السلاح</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;800&family=Silkscreen&display=swap">
<style>
/* Layout: a smithy at night. Left, the drawing anvil (pixel grid); right, the weapon glowing on its stand and its card. */
:root{
  --coal:#14110f; --iron:#211c19; --plate:#2c2622; --edge:#41372f; --ash:#a89a8c; --bone:#f3e9dc;
  --ember:#ff7a2f; --ember-2:#ffb347; --steel:#9fb4c6;
  --r-common:#a4a9ae; --r-rare:#4aa3ff; --r-epic:#b07cff; --r-legend:#ff9a3d; --r-myth:#ff4d6d;
  --display:"Lalezar","Cairo",system-ui,sans-serif; --body:"Cairo",system-ui,sans-serif; --pix:"Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--coal);color:var(--bone)}
body{font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;
  background:radial-gradient(1200px 500px at 70% -10%,#3a1d0e66,transparent 70%),var(--coal)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember-2);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,54px);line-height:1.35;margin:0;padding-top:4px;letter-spacing:.5px;
  background:linear-gradient(180deg,var(--ember-2),var(--ember) 60%,#c2410c);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.tag{color:var(--ash);margin:4px 0 0;font-size:14px}
nav{display:flex;gap:4px;background:var(--iron);border:1px solid var(--edge);border-radius:12px;padding:4px}
nav button{background:transparent;border:0;border-radius:9px;padding:7px 16px;font-weight:800;color:var(--ash)}
nav button[aria-pressed="true"]{background:var(--plate);color:var(--bone);box-shadow:inset 0 -2px 0 var(--ember)}
.forge{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.forge{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--iron);border:1px solid var(--edge);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.4px;color:var(--ash);font-weight:800}
.anvil{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1}
#grid{width:100%;height:100%;display:block;border-radius:8px;touch-action:none;cursor:crosshair;image-rendering:pixelated;box-shadow:0 0 0 1px var(--edge),0 10px 30px #0008}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{display:flex;align-items:center;gap:6px;background:var(--plate);border:1px solid var(--edge);border-radius:10px;padding:6px 11px;font-weight:700;font-size:14px}
.tool[aria-pressed="true"]{border-color:var(--ember);background:#3a2417;color:var(--ember-2)}
.tool svg{width:17px;height:17px;flex:none}
.pal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sw{position:relative;border:2px solid transparent;border-radius:9px;padding:0;height:44px;background:var(--plate);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sw i{display:block;width:22px;height:22px;border-radius:4px;box-shadow:inset 0 -3px 0 #0003}
.sw span{font-size:10px;color:var(--ash);line-height:1}
.sw[aria-pressed="true"]{border-color:var(--bone)}
.temps{display:flex;flex-wrap:wrap;gap:6px}
.temp{background:transparent;border:1px dashed var(--edge);border-radius:9px;padding:5px 10px;font-size:13px;color:var(--ash)}
.temp:hover{border-color:var(--ember);color:var(--bone)}
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 70%,#3b2416,#120e0c 70%);box-shadow:inset 0 0 0 1px var(--edge)}
.stage canvas{display:block;width:100%;height:100%}
.pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-family:var(--pix);font-size:22px;font-weight:700;text-shadow:0 2px 0 #000,0 0 8px #000;animation:rise 1s ease-out forwards;white-space:nowrap}
.pop.crit{font-size:28px;color:var(--ember-2)}
@keyframes rise{from{transform:translate(-50%,0) scale(1.3);opacity:1}to{transform:translate(-50%,-70px) scale(1);opacity:0}}
.hint{position:absolute;inset-inline-start:12px;bottom:10px;font-size:12px;color:var(--ash)}
.card{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,var(--plate),var(--iron));border:2px solid var(--rc,var(--edge))}
.nameRow{display:flex;gap:8px}
.nameRow input{flex:1;min-width:0;background:var(--coal);border:1px solid var(--edge);border-radius:10px;padding:8px 12px;color:var(--bone);font:800 18px var(--body)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;border:1px solid var(--edge);background:var(--coal)}
.chip.rar{border-color:var(--rc);color:var(--rc)}
.power{margin-inline-start:auto;font-family:var(--pix);font-size:22px;color:var(--rc)}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr) 3ch;gap:6px 10px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--coal);overflow:hidden}
.bar b{display:block;height:100%;border-radius:4px;background:var(--steel);transition:width .35s}
.num{font-family:var(--pix);font-size:12px;text-align:end;font-variant-numeric:tabular-nums}
.desc{color:var(--ash);font-size:13px;margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:11px;padding:9px 16px;font-weight:800;background:linear-gradient(180deg,var(--ember-2),var(--ember));color:#2a1406}
.btn.alt{background:var(--plate);color:var(--bone);border:1px solid var(--edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plate);border:1px solid var(--ember);border-radius:12px;padding:9px 16px;font-weight:700;z-index:20}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{background:var(--iron);border:2px solid var(--rc,var(--edge));border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:var(--coal);border-radius:8px}
.item b{font-size:15px;overflow-wrap:anywhere}
.item small{color:var(--ash);font-size:12px}
.item .row{display:flex;gap:6px;flex-wrap:wrap}
.item .row button{font-size:12px;padding:5px 9px}
.empty{color:var(--ash);text-align:center;padding:40px 10px;border:1px dashed var(--edge);border-radius:12px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who input{background:var(--coal);border:1px solid var(--edge);border-radius:9px;padding:6px 10px;color:var(--bone);font:700 14px var(--body);width:180px;max-width:100%}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}.bar b{transition:none}}
</style>

<div class="wrap" dir="rtl">
  <header>
    <div>
      <h1>ورشة السلاح</h1>
      <p class="tag">ارسم سلاحك بكسل بكسل، والورشة تطرقه 3D وتقولّك قوته.</p>
    </div>
    <nav aria-label="الأقسام">
      <button id="tForge" aria-pressed="true">الورشة</button>
      <button id="tMine" aria-pressed="false">سلاحي</button>
      <button id="tGal" aria-pressed="false">المعرض</button>
    </nav>
  </header>

  <section id="vForge" class="forge">
    <div class="panel">
      <div class="anvil"><canvas id="grid" width="480" height="480" aria-label="شبكة الرسم"></canvas></div>
      <div class="tools" role="toolbar" aria-label="الأدوات">
        <button class="tool" id="toPen" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>قلم</button>
        <button class="tool" id="toErase" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21h10M5 15l8-8 6 6-6 6H9z"/></svg>ممحاة</button>
        <button class="tool" id="toFill" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11l7-7 7 7-7 7z"/><path d="M20 16c0 2-1 3-2 3s-2-1-2-3 2-4 2-4 2 2 2 4z"/></svg>جردل</button>
        <button class="tool" id="toMirror" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M8 7l-4 5 4 5M16 7l4 5-4 5"/></svg>مرآة</button>
        <button class="tool" id="toUndo" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>رجوع</button>
        <button class="tool" id="toClear" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>امسح</span></button>
      </div>
      <div class="label">الألوان: كل لون معدن أو عنصر</div>
      <div class="pal" id="pal"></div>
      <div class="label">ابدأ من سلاح جاهز</div>
      <div class="temps" id="temps"></div>
    </div>

    <div class="panel">
      <div class="stage" id="stage"><div class="pops" id="pops"></div><span class="hint">اسحب عشان تلف السلاح</span></div>
      <div class="card" id="card">
        <div class="nameRow"><input id="wName" maxlength="28" aria-label="اسم السلاح"><button class="btn alt" id="bName">اقترح اسم</button></div>
        <div class="chips"><span class="chip rar" id="cRar"></span><span class="chip" id="cType"></span><span class="chip" id="cEl"></span><span class="power" id="cPow" title="القوة الكلية"></span></div>
        <div class="stats" id="stats"></div>
        <p class="desc" id="cDesc"></p>
        <div class="acts">
          <button class="btn" id="bTest">جرّب على الدمية</button>
          <button class="btn alt" id="bSave">احفظ في سلاحي</button>
          <button class="btn alt" id="bPub">انشر في المعرض</button>
        </div>
      </div>
    </div>
  </section>

  <section id="vMine" hidden>
    <div class="list" id="mine"></div>
  </section>

  <section id="vGal" hidden>
    <div class="who"><span class="label">اسمك في المعرض</span><input id="nick" maxlength="20" aria-label="اسمك في المعرض"><small class="desc" id="galState"></small></div>
    <div class="list" id="gal" style="margin-top:12px"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = (id) => document.getElementById(id);
const N = 24;
// the palette: what each colour is made of. el = the element it gives the weapon
const PAL = [
  { c: '.', hex: null },
  { c: 'S', hex: '#cfd8e2', name: 'فولاذ', d: 1.0 },
  { c: 's', hex: '#6f7b89', name: 'حديد', d: 1.1 },
  { c: 'k', hex: '#24262b', name: 'أسود', d: 1.2 },
  { c: 'w', hex: '#8a5a35', name: 'خشب', d: 0.5 },
  { c: 'G', hex: '#e2b043', name: 'دهب', d: 1.4 },
  { c: 'W', hex: '#f6f3ea', name: 'نور', d: 0.6, el: 'light' },
  { c: 'r', hex: '#e5484d', name: 'نار', d: 0.7, el: 'fire' },
  { c: 'o', hex: '#ff8a3d', name: 'جمر', d: 0.7, el: 'fire' },
  { c: 'b', hex: '#3d8bff', name: 'تلج', d: 0.7, el: 'ice' },
  { c: 'c', hex: '#9ae6ff', name: 'صقيع', d: 0.7, el: 'ice' },
  { c: 'y', hex: '#ffe14d', name: 'برق', d: 0.7, el: 'bolt' },
  { c: 'g', hex: '#46c96b', name: 'سم', d: 0.7, el: 'poison' },
  { c: 'p', hex: '#9b5cff', name: 'ظل', d: 0.7, el: 'shadow' },
];
const CI = Object.fromEntries(PAL.map((p, i) => [p.c, i]));
const EL = {
  fire: { name: 'نار', col: '#ff7a2f', words: ['اللهب', 'البركان', 'الجمر'], fx: 'يولّع في اللي يضربه ويفضل يحرق' },
  ice: { name: 'تلج', col: '#7cc8ff', words: ['الصقيع', 'الجليد', 'الشتا'], fx: 'يجمّد اللي يضربه ويبطّأه' },
  bolt: { name: 'برق', col: '#ffe14d', words: ['البرق', 'الرعد', 'العاصفة'], fx: 'البرق بينط منه لأقرب عدو' },
  poison: { name: 'سم', col: '#46c96b', words: ['الأفعى', 'السم', 'المستنقع'], fx: 'يسمّم اللي يضربه وينزل منه شوية شوية' },
  shadow: { name: 'ظل', col: '#a77bff', words: ['الظل', 'الليل', 'الكسوف'], fx: 'يسرق شوية من طاقة اللي يضربه' },
  light: { name: 'نور', col: '#fff6d6', words: ['النور', 'الفجر', 'الشمس'], fx: 'يعمي اللي يضربه ثانية' },
  none: { name: 'معدن', col: '#cfd8e2', words: ['الحديد', 'الفولاذ', 'المحارب'], fx: 'ضربة صافية من غير سحر' },
};
const RAR = [
  { min: 0, name: 'عادي', col: 'var(--r-common)' }, { min: 160, name: 'نادر', col: 'var(--r-rare)' }, { min: 200, name: 'ملحمي', col: 'var(--r-epic)' },
  { min: 235, name: 'أسطوري', col: 'var(--r-legend)' }, { min: 265, name: 'خرافي', col: 'var(--r-myth)' },
];
const TEMPS = {"sword": ["...........SS...........", "..........Sors..........", "..........Sros..........", "..........Sors..........", "..........Sros..........", "..........Sors..........", "..........Sros..........", "..........Sors..........", "..........Sros..........", "..........Sors..........", "..........Sros..........", "..........Sors..........", "..........Sros..........", "..........Sors..........", ".......G..Sros..G.......", ".......GGGGGGGGGG.......", "........GGGGGGGG........", "...........wk...........", "...........kw...........", "...........wk...........", "...........kw...........", "..........GGGG..........", "...........rr...........", "........................"], "axe": ["........................", "............ssss........", ".........ccSSww.........", ".......ccSSSSww.........", ".....ccSSSSSSwkss.......", "....cbSSSSSSSwwsss......", "...cbSSSSSSSSwwsss......", "...cbSSSSSSSSwwsss......", "....cbSSSSSSSwkss.......", ".....ccSSSSSSww.........", ".......ccSSSSww.........", ".........ccSSww.........", ".............wk.........", ".............ww.........", ".............ww.........", ".............ww.........", ".............wk.........", ".............ww.........", ".............ww.........", ".............ww.........", ".............wk.........", ".............ww.........", "............kkkk........", "........................"], "hammer": ["........................", "........................", ".....SSSSSSSSSSSSSS.....", "....kSsssysssssssssk....", "....kSssssysyssssssk....", "....kSsssssysysssssk....", "....kSssssssssyssssk....", "....kSsssssssssysssk....", ".....Ssssssssssssss.....", "..........GGGG..........", "...........ww...........", "...........ww...........", "...........wk...........", "...........ww...........", "...........ww...........", "...........wk...........", "...........ww...........", "...........ww...........", "...........wk...........", "...........ww...........", "...........ww...........", "...........wk...........", "..........GGGG..........", "........................"], "staff": ["........................", "..........p..p..........", ".........p.pp.p.........", "..........pWpp..........", "........p.ppkp.p........", "..........pppp..........", "........Gp.pp.pG........", ".........GGGGGG.........", "...........ww...........", "...........ww...........", "...........kw...........", "...........ww...........", "...........ww...........", "...........ww...........", "...........ww...........", "...........kw...........", "...........ww...........", "...........ww...........", "...........ww...........", "...........ww...........", "...........kw...........", "...........ww...........", "...........ww...........", "...........GG..........."]};
const TEMP_NAMES = { sword: 'سيف نار', axe: 'فأس تلج', hammer: 'مطرقة برق', staff: 'عصاية ظل' };
const store = { get(k, d) { try { const v = localStorage.getItem('forge.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('forge.' + k, JSON.stringify(v)); } catch { /* storage blocked */ } } };

// ---------------------------------------------------------------- the drawing
let grid = new Uint8Array(N * N), color = CI.r, tool = 'pen', mirror = true, undo = [];
const enc = (g) => Array.from(g, (v) => PAL[v].c).join('');
const dec = (s) => { const g = new Uint8Array(N * N); for (let i = 0; i < N * N; i++) g[i] = CI[s[i]] || 0; return g; };
const fromRows = (rows) => dec(rows.join(''));
const cv = $('grid'), cx = cv.getContext('2d');
function drawGrid() {
  const s = cv.width / N; cx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { cx.fillStyle = (x + y) % 2 ? '#1b1715' : '#211c19'; cx.fillRect(x * s, y * s, s, s); }
  if (mirror) { cx.fillStyle = '#ff7a2f22'; cx.fillRect(cv.width / 2 - 1, 0, 2, cv.height); }
  for (let i = 0; i < N * N; i++) { const v = grid[i]; if (!v) continue; const x = i % N, y = (i / N) | 0; cx.fillStyle = PAL[v].hex; cx.fillRect(x * s, y * s, s, s); cx.fillStyle = '#0000002a'; cx.fillRect(x * s, y * s + s - 3, s, 3); }
  cx.strokeStyle = '#ffffff10'; cx.lineWidth = 1; cx.beginPath(); for (let i = 1; i < N; i++) { cx.moveTo(i * s + 0.5, 0); cx.lineTo(i * s + 0.5, cv.height); cx.moveTo(0, i * s + 0.5); cx.lineTo(cv.width, i * s + 0.5); } cx.stroke();
}
function cellAt(e) { const r = cv.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N); return x >= 0 && y >= 0 && x < N && y < N ? [x, y] : null; }
function paint(x, y) { const v = tool === 'erase' ? 0 : color; grid[y * N + x] = v; if (mirror) grid[y * N + (N - 1 - x)] = v; }
function fill(x, y) {
  const v = color, from = grid[y * N + x]; if (from === v) return; const st = [[x, y]];
  while (st.length) { const [a, b] = st.pop(); if (a < 0 || b < 0 || a >= N || b >= N || grid[b * N + a] !== from) continue; grid[b * N + a] = v; st.push([a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1]); }
}
let drawing = false;
cv.addEventListener('pointerdown', (e) => { const c = cellAt(e); if (!c) return; cv.setPointerCapture(e.pointerId); undo.push(grid.slice()); if (undo.length > 60) undo.shift(); if (tool === 'fill') { fill(...c); changed(); return; } drawing = true; paint(...c); changed(); });
cv.addEventListener('pointermove', (e) => { if (!drawing) return; const c = cellAt(e); if (c) { paint(...c); changed(); } });
const stop = () => { drawing = false; }; cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
const setTool = (t) => { tool = t; for (const [id, k] of [['toPen', 'pen'], ['toErase', 'erase'], ['toFill', 'fill']]) $(id).setAttribute('aria-pressed', String(t === k)); };
$('toPen').onclick = () => setTool('pen'); $('toErase').onclick = () => setTool('erase'); $('toFill').onclick = () => setTool('fill');
$('toMirror').onclick = () => { mirror = !mirror; $('toMirror').setAttribute('aria-pressed', String(mirror)); drawGrid(); };
$('toUndo').onclick = () => { if (undo.length) { grid = undo.pop(); changed(); } };
let clearArm = 0;
$('toClear').onclick = () => { const sp = $('toClear').querySelector('span'); if (!clearArm) { clearArm = setTimeout(() => { clearArm = 0; sp.textContent = 'امسح'; }, 2500); sp.textContent = 'متأكد؟'; return; } clearTimeout(clearArm); clearArm = 0; sp.textContent = 'امسح'; undo.push(grid.slice()); grid = new Uint8Array(N * N); changed(); };
const pal = $('pal');
PAL.forEach((p, i) => { if (!i) return; const b = document.createElement('button'); b.className = 'sw'; b.setAttribute('aria-pressed', String(i === color)); b.setAttribute('aria-label', p.name); b.innerHTML = `<i style="background:${p.hex}"></i><span>${p.name}</span>`; b.onclick = () => { color = i; if (tool === 'erase') setTool('pen'); pal.querySelectorAll('.sw').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }; pal.appendChild(b); });
for (const k in TEMPS) { const b = document.createElement('button'); b.className = 'temp'; b.textContent = TEMP_NAMES[k]; b.onclick = () => { undo.push(grid.slice()); grid = fromRows(TEMPS[k]); $('wName').value = ''; nameTouched = false; changed(); }; $('temps').appendChild(b); }

// ---------------------------------------------------------------- what the drawing is worth
function analyse(g) {
  const cells = []; for (let i = 0; i < N * N; i++) if (g[i]) cells.push([i % N, (i / N) | 0, g[i]]);

function show(v) { for (const [k, id, sec] of [['forge', 'tForge', 'vForge'], ['mine', 'tMine', 'vMine'], ['gal', 'tGal', 'vGal']]) { $(id).setAttribute('aria-pressed', String(k === v)); $(sec).hidden = k !== v; } if (v === 'mine') renderMine(); if (v === 'gal') renderGal(); if (v === 'forge') size(); }
$('tForge').onclick = () => show('forge'); $('tMine').onclick = () => show('mine'); $('tGal').onclick = () => show('gal');

grid = fromRows(TEMPS.sword); changed(); initGallery();
})();
