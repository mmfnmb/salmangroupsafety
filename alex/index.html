<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>مطعم الباندا</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9fd3f2;font-family:system-ui,sans-serif;touch-action:none;user-select:none}#msg{position:fixed;top:10px;left:0;right:0;text-align:center;font-size:16px;color:#123;font-weight:700;text-shadow:0 1px 2px #fff;pointer-events:none}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);display:none;pointer-events:none}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85)}
#jump{position:fixed;right:28px;bottom:34px;width:92px;height:92px;border-radius:50%;border:0;background:#ff8a3d;color:#fff;font-size:24px;font-weight:800;box-shadow:0 4px 0 #c45f1c}</style></head>
<body><div id="msg">بيحمّل…</div><div id="stick"><div id="knob"></div></div><button id="jump">نط</button><script src="main.bundle.js"></script></body></html>
