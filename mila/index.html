<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ميلا</title>
<style>
:root { --pink: #ff7eb6; --ink: #4a2340; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3ff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.bubble { position: absolute; left: 0; top: 0; display: none; align-items: center; gap: 6px; background: #fff; color: var(--ink); border-radius: 22px; padding: 6px 12px; font-size: 17px; font-weight: 700; box-shadow: 0 4px 12px #0003; white-space: nowrap; max-width: 70vw; }
.bubble .e { font-size: 34px; line-height: 1; } .bubble.evil { background: #3a1030; color: #ffd0e0; }
.float { position: absolute; font-size: 42px; transform: translate(-50%, -50%); animation: up 1.4s ease-out forwards; }
@keyframes up { to { transform: translate(-50%, -160%) scale(1.4); opacity: 0; } }
#hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: none; gap: 10px; align-items: center; pointer-events: none; }
.pill { background: #ffffffdd; border-radius: 20px; padding: 6px 14px; font-size: 22px; font-weight: 800; color: var(--ink); box-shadow: 0 3px 8px #0002; }
.meter { width: 90px; height: 14px; background: #fff; border-radius: 8px; overflow: hidden; display: inline-block; vertical-align: middle; } #fat { height: 100%; width: 0; background: linear-gradient(90deg, #7dd87d, #ffb347, #ff5c5c); }
#btnMusic { pointer-events: auto; margin-inline-start: auto; font-size: 26px; border: 0; background: #ffffffdd; border-radius: 50%; width: 50px; height: 50px; }
#panel { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #4a234099; padding: 16px; box-sizing: border-box; }
.ptitle { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 14px; text-shadow: 0 2px 6px #0006; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; width: min(560px, 100%); max-height: 70vh; overflow: auto; }
.item { font-size: 46px; background: #fff; border: 0; border-radius: 22px; padding: 10px 4px; box-shadow: 0 4px 0 #e0b4cc; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.item small { font-size: 15px; font-weight: 700; color: var(--ink); } .item:active { transform: scale(0.93); }
.close { margin-top: 16px; font-size: 28px; width: 64px; height: 64px; border-radius: 50%; border: 0; background: #fff; }
#load, #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(#ffd6ea, #bfe3ff); }
#load { display: none; } h1 { margin: 0; font-size: 64px; color: var(--pink); text-shadow: 0 4px 0 #fff; }
.track { width: min(320px, 80vw); height: 14px; background: #fff; border-radius: 8px; overflow: hidden; } #bar { height: 100%; width: 0; background: var(--pink); transition: width .4s; }
#btnStart { font-size: 40px; padding: 14px 44px; border: 0; border-radius: 40px; background: var(--pink); color: #fff; font-weight: 800; box-shadow: 0 6px 0 #d4558f; }
#evil { position: fixed; inset: 0; display: none; pointer-events: none; box-shadow: inset 0 0 120px 40px #6a0030aa; }
#flash { position: fixed; inset: 0; pointer-events: none; background: #ff3355; opacity: 0; transition: opacity .5s; }
#msg { color: var(--ink); font-size: 18px; }
</style></head>
<body>
<div id="ui"></div>
<div id="hud"><span class="pill">❤️ <span id="hearts">0</span></span><span class="pill">⭐ <span id="stars">0</span></span><span class="pill">🍰 <span class="meter"><span id="fat"></span></span></span><button id="btnMusic">🎵</button></div>
<div id="evil"></div><div id="flash"></div>
<div id="panel"></div>
<div id="start"><h1>ميلا</h1><div style="font-size:70px">👧🏻👑</div><button id="btnStart">▶ يلا نلعب</button></div>
<div id="load"><h1>ميلا</h1><div class="track"><div id="bar"></div></div><div id="msg">بيحمّل…</div></div>
<script src="game.js"></script>
</body></html>
