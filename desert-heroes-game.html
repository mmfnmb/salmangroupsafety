<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>أبطال الصحراء - Desert Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --sand-1:#f0d09a; --sand-2:#dba05c; --sand-3:#b97a3d; --sand-dark:#6e4522;
  --sky-top:#ffb457; --sky-bottom:#ff7a45;
  --ink:#2a190d; --panel:#3a2414; --panel-2:#4a2e19;
  --gold:#ffcf5c; --legendary:#ff9d2e; --epic:#b565f0; --rare:#4fa8ff; --common:#b8bcc4;
  --accent-red:#e6483a; --accent-green:#4caf6b; --accent-blue:#4aa8e0;
  --text:#fff3de;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a0f07;}
body{
  font-family:'Tahoma','Segoe UI',sans-serif;
  color:var(--text);
  user-select:none;
  touch-action:none;
}
.pixel-font{font-family:'Press Start 2P',monospace; letter-spacing:1px;}
#app{position:fixed; inset:0; display:flex; flex-direction:column;}
.screen{
  position:absolute; inset:0; display:none; flex-direction:column;
  background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 32%, var(--sand-2) 33%, var(--sand-1) 70%, var(--sand-3) 100%);
  overflow:hidden;
}
.screen.active{display:flex;}
.dunes{position:absolute; left:-5%; right:-5%; bottom:0; height:45%; pointer-events:none; animation:duneDrift 22s ease-in-out infinite; filter:url(#heatWave);}
.dunes svg{width:100%; height:100%; display:block;}
.dunes-far{position:absolute; left:-5%; right:-5%; bottom:0; height:38%; pointer-events:none; animation:duneDrift 34s ease-in-out infinite reverse; opacity:.7; z-index:1;}
.dunes-far svg{width:100%; height:100%; display:block;}
@keyframes duneDrift{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(-2.5%);} }
.menu-vignette{position:absolute; inset:0; pointer-events:none; z-index:4; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(20,10,4,.45) 100%);}
.sky-bird{position:absolute; top:14%; animation:birdFly linear infinite; pointer-events:none; z-index:2;}
@keyframes birdFly{ 0%{transform:translate(-10vw,0);} 100%{transform:translate(110vw,-14px);} }
.hero-portrait-wrap{position:relative; z-index:5; margin-bottom:-8px;}
.hero-portrait-wrap canvas{width:120px; height:120px; image-rendering:pixelated; filter:drop-shadow(0 8px 6px rgba(0,0,0,.4));}
.sun-glow{
  position:absolute; top:6%; left:50%; width:160px; height:160px; margin-left:-80px;
  border-radius:50%; background:radial-gradient(circle, rgba(255,240,190,.85) 0%, rgba(255,207,92,.35) 45%, rgba(255,207,92,0) 72%);
  pointer-events:none; z-index:1; animation:sunPulse 3.4s ease-in-out infinite;
}
@keyframes sunPulse{ 0%,100%{opacity:.75; transform:scale(1);} 50%{opacity:1; transform:scale(1.12);} }
.sand-particles{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2;}
.sand-mote{
  position:absolute; bottom:-10px; border-radius:50%; background:rgba(255,235,190,.55);
  animation-name:moteRise; animation-timing-function:linear; animation-iteration-count:infinite;
}
@keyframes moteRise{
  0%{ transform:translate(0,0); opacity:0; }
  10%{ opacity:.8; }
  90%{ opacity:.5; }
  100%{ transform:translate(var(--drift,20px), -110vh); opacity:0; }
}

/* ---------- top bar (currency etc) ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; z-index:5; flex-shrink:0;
}
.coin-pill{
  display:flex; align-items:center; gap:6px; background:rgba(42,25,13,.75);
  border:2px solid var(--gold); border-radius:20px; padding:6px 14px;
  font-weight:bold; font-size:15px; box-shadow:0 2px 0 rgba(0,0,0,.3);
}
.coin-pill .ic{font-size:16px;}
.back-btn{
  background:rgba(42,25,13,.75); border:2px solid var(--text); border-radius:10px;
  color:var(--text); font-size:20px; width:40px; height:40px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.mute-btn{
  background:rgba(42,25,13,.75); border:2px solid var(--text); border-radius:10px;
  color:var(--text); font-size:18px; width:40px; height:40px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.topbar-right{display:flex; gap:8px;}

/* ---------- main menu ---------- */
#screen-menu .center-wrap{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; z-index:5; padding:20px;
}
.logo{
  font-size:26px; text-align:center; color:var(--gold);
  text-shadow:3px 3px 0 var(--ink), 6px 6px 0 rgba(0,0,0,.25);
  line-height:1.6;
}
.logo small{display:block; font-size:12px; color:var(--text); margin-top:8px;}
.menu-buttons{display:flex; flex-direction:column; gap:14px; width:min(320px,80vw);}
.btn{
  font-family:inherit; font-size:17px; font-weight:bold; color:var(--text);
  padding:16px 20px; border-radius:14px; border:none; cursor:pointer;
  position:relative; text-align:center;
  box-shadow:0 5px 0 rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.15);
  transition:transform .06s;
}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
.btn-play{background:linear-gradient(180deg,#ff8a4c,var(--accent-red));}
.btn-heroes{background:linear-gradient(180deg,#5ec3ff,#2b7fc4);}
.btn-shop{background:linear-gradient(180deg,#ffd76b,#e0972a);}
.btn-inv{background:linear-gradient(180deg,#8fdb9a,#3f9b52);}
.btn-secondary{background:linear-gradient(180deg,#8a6a4a,#5c4128); font-size:14px; padding:10px 16px;}
.btn-small{padding:8px 14px; font-size:13px; border-radius:10px; box-shadow:0 3px 0 rgba(0,0,0,.35);}
.btn:disabled{filter:grayscale(.6) brightness(.7); cursor:not-allowed;}

/* ---------- grid screens ---------- */
.grid-screen{flex:1; display:flex; flex-direction:column; overflow:hidden; z-index:5;}
.screen-title{
  text-align:center; font-size:18px; font-weight:bold; padding:4px 0 10px;
  color:var(--gold); text-shadow:2px 2px 0 var(--ink);
}
.tabs{display:flex; gap:8px; padding:0 14px 10px; flex-shrink:0;}
.tab{
  flex:1; text-align:center; padding:9px 4px; border-radius:10px; font-size:12px; font-weight:bold;
  background:rgba(42,25,13,.55); border:2px solid transparent; cursor:pointer;
}
.tab.active{border-color:var(--gold); background:rgba(255,207,92,.25);}
.picker-label{font-size:12px; font-weight:bold; opacity:.85; padding:2px 4px 6px;}
.tab.diff-easy.active{border-color:var(--accent-green); background:rgba(76,175,107,.25);}
.tab.diff-hard.active{border-color:var(--accent-red); background:rgba(230,72,58,.25);}
.scroll-area{flex:1; overflow-y:auto; padding:6px 14px 18px; -webkit-overflow-scrolling:touch;}
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}

.hero-card{
  background:rgba(42,25,13,.8); border-radius:14px; padding:10px; text-align:center;
  border:2px solid rgba(255,255,255,.12); position:relative;
}
.hero-card.owned{border-color:var(--accent-green);}
.hero-card.selected{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold);}
.hero-card canvas{width:100%; height:90px; image-rendering:pixelated;}
.hero-name{font-weight:bold; font-size:13px; margin:4px 0 1px;}
.hero-role{font-size:10px; opacity:.75; margin-bottom:6px;}
.hero-price{
  display:flex; align-items:center; justify-content:center; gap:4px;
  font-size:12px; font-weight:bold; color:var(--gold);
}
.lock-badge{
  position:absolute; top:6px; left:6px; background:rgba(0,0,0,.55); border-radius:6px;
  padding:2px 6px; font-size:11px;
}
.owned-badge{
  position:absolute; top:6px; left:6px; background:var(--accent-green); border-radius:6px;
  padding:2px 6px; font-size:10px; font-weight:bold;
}

.skin-card{
  background:rgba(42,25,13,.8); border-radius:14px; padding:10px; text-align:center;
  border:3px solid var(--common);
}
.skin-card.rare{border-color:var(--rare);}
.skin-card.epic{border-color:var(--epic);}
.skin-card.legendary{border-color:var(--legendary); box-shadow:0 0 12px rgba(255,157,46,.5);}
.skin-card canvas{width:100%; height:80px; image-rendering:pixelated;}
.rarity-tag{
  display:inline-block; font-size:9px; font-weight:bold; padding:2px 7px; border-radius:8px;
  margin-bottom:4px; background:var(--common); color:#222;
}
.skin-card.rare .rarity-tag{background:var(--rare); color:#fff;}
.skin-card.epic .rarity-tag{background:var(--epic); color:#fff;}
.skin-card.legendary .rarity-tag{background:var(--legendary); color:#241000;}

.stat-bar-row{display:flex; align-items:center; gap:6px; font-size:10px; margin:2px 0;}
.stat-bar-row .lbl{width:34px; opacity:.8; flex-shrink:0;}
.stat-bar-track{flex:1; height:6px; background:rgba(0,0,0,.4); border-radius:3px; overflow:hidden;}
.stat-bar-fill{height:100%; background:linear-gradient(90deg,#ffd76b,#ff8a4c);}

/* ---------- hero detail panel ---------- */
.overlay{
  position:absolute; inset:0; background:rgba(10,5,2,.72); z-index:20;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.overlay.active{display:flex;}
.detail-panel{
  background:var(--panel); border:3px solid var(--gold); border-radius:18px;
  padding:18px; width:min(360px,100%); max-height:90vh; overflow-y:auto; text-align:center;
}
.detail-panel canvas{width:140px; height:140px; image-rendering:pixelated; margin:0 auto;}
.detail-name{font-size:18px; font-weight:bold; color:var(--gold); margin-top:6px;}
.detail-role{font-size:12px; opacity:.8; margin-bottom:10px;}
.ult-box{
  background:rgba(0,0,0,.3); border-radius:10px; padding:10px; margin:10px 0; text-align:right;
}
.ult-box b{color:#9be0ff;}
.ult-box p{font-size:12px; margin:4px 0 0; opacity:.9;}
.detail-actions{display:flex; gap:10px; margin-top:12px;}
.detail-actions .btn{flex:1;}

/* ---------- inventory ---------- */
.inv-row{
  display:flex; align-items:center; gap:12px; background:rgba(42,25,13,.8);
  border-radius:14px; padding:10px 12px; margin-bottom:10px; border:2px solid rgba(255,255,255,.1);
}
.inv-row canvas{width:56px; height:56px; image-rendering:pixelated; flex-shrink:0;}
.inv-row .info{flex:1; text-align:right;}
.inv-row .info .n{font-weight:bold; font-size:14px;}
.inv-row .info .s{font-size:11px; opacity:.8;}
.select-skin{
  font-size:11px; padding:6px 10px; border-radius:8px; border:2px solid var(--text);
  background:rgba(0,0,0,.3); color:var(--text);
}

/* ---------- hero select (pre-match) ---------- */
#screen-herosel .card-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
#screen-herosel .hero-card{cursor:pointer;}
.start-match-bar{
  padding:14px; flex-shrink:0; z-index:5;
}
.start-match-bar .btn{width:100%;}

/* ---------- game screen ---------- */
#screen-game{background:#000;}
.low-hp-vignette{
  position:absolute; inset:0; pointer-events:none; opacity:0; z-index:7;
  background:radial-gradient(ellipse at center, rgba(230,72,58,0) 45%, rgba(230,72,58,.75) 100%);
  animation:pulseVignette 1s ease-in-out infinite;
}
@keyframes pulseVignette{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.25);} }
#gameWrap{flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;}
#gameCanvas{background:#d9a05b; image-rendering:pixelated; touch-action:none; max-width:100%; max-height:100%;}
.hud{position:absolute; inset:0; pointer-events:none; z-index:6;}
.hud-top{
  position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
  align-items:flex-start; padding:10px 12px; pointer-events:none;
}
.hud-health-wrap{width:150px;}
.hud-bar-track{height:14px; background:rgba(0,0,0,.5); border:2px solid rgba(0,0,0,.6); border-radius:8px; overflow:hidden;}
.hud-bar-fill-hp{height:100%; width:100%; background:linear-gradient(90deg,#4caf6b,#8fdb9a); transition:width .15s;}
.hud-bar-fill-ult{height:100%; width:0%; background:linear-gradient(90deg,#4aa8e0,#9be0ff); transition:width .15s;}
.hud-ult-wrap{width:150px; margin-top:6px;}
.hud-ult-label{font-size:9px; opacity:.85; margin-bottom:2px;}
.hud-timer{
  background:rgba(0,0,0,.5); border-radius:10px; padding:6px 14px; font-weight:bold; font-size:15px;
  align-self:flex-start;
}
.hud-score{
  background:rgba(0,0,0,.5); border-radius:10px; padding:6px 12px; font-size:12px; font-weight:bold; text-align:left;
}
.pause-btn{
  position:absolute; top:10px; left:12px; width:36px; height:36px; border-radius:8px;
  background:rgba(0,0,0,.5); border:none; color:#fff; font-size:16px; pointer-events:auto; cursor:pointer;
}

.joystick-zone{
  position:absolute; left:18px; bottom:18px; width:120px; height:120px;
  border-radius:50%; background:rgba(0,0,0,.25); border:2px solid rgba(255,255,255,.3);
  pointer-events:auto;
}
.joystick-knob{
  position:absolute; width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.55);
  left:34px; top:34px; pointer-events:none;
}
.action-btns{position:absolute; right:16px; bottom:16px; display:flex; flex-direction:column; align-items:center; gap:10px; pointer-events:auto;}
.fire-btn{
  width:76px; height:76px; border-radius:50%; background:rgba(230,72,58,.75); border:3px solid rgba(255,255,255,.5);
  color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center;
}
.ult-btn{
  width:58px; height:58px; border-radius:50%; background:rgba(74,168,224,.55); border:3px solid rgba(255,255,255,.5);
  color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; position:relative;
}
.ult-btn.ready{background:rgba(255,207,92,.85); box-shadow:0 0 14px rgba(255,207,92,.9);}

/* ---------- result / pause overlays ---------- */
.result-panel{
  background:var(--panel); border:3px solid var(--gold); border-radius:18px; padding:26px;
  width:min(340px,100%); text-align:center;
}
.result-title{font-size:22px; font-weight:bold; margin-bottom:6px;}
.result-title.win{color:#8fdb9a;}
.result-title.lose{color:#ff8a7a;}
.result-stats{margin:14px 0; font-size:13px; line-height:1.9;}
.result-coins{
  font-size:18px; font-weight:bold; color:var(--gold); margin:10px 0;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.confetti-layer{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1;}
.confetto{position:absolute; top:-14px; border-radius:2px; animation-name:confettiFall; animation-timing-function:cubic-bezier(.4,.1,.6,.9); animation-iteration-count:1; animation-fill-mode:forwards;}
@keyframes confettiFall{
  0%{ transform:translateY(0) rotate(0deg); opacity:1; }
  100%{ transform:translateY(105vh) rotate(540deg); opacity:.9; }
}

.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); background:rgba(20,12,6,.92);
  border:2px solid var(--gold); padding:10px 18px; border-radius:10px; font-size:13px; font-weight:bold;
  z-index:100; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); border-radius:4px;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="heatWave" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.09" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" values="0.01 0.09;0.014 0.11;0.01 0.09" dur="6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div id="app">

  <!-- ============ MAIN MENU ============ -->
  <div class="screen active" id="screen-menu">
    <div class="sun-glow"></div>
    <div class="sky-bird" style="animation-duration:26s; animation-delay:0s;">
      <svg viewBox="0 0 20 10" width="18" height="9"><path d="M0,6 Q5,0 10,6 Q15,0 20,6" fill="none" stroke="rgba(60,35,15,.55)" stroke-width="1.6"/></svg>
    </div>
    <div class="sky-bird" style="animation-duration:32s; animation-delay:6s; top:20%;">
      <svg viewBox="0 0 20 10" width="13" height="7"><path d="M0,6 Q5,0 10,6 Q15,0 20,6" fill="none" stroke="rgba(60,35,15,.45)" stroke-width="1.6"/></svg>
    </div>
    <div class="sand-particles" id="sandParticles"></div>
    <div class="dunes-far">
      <svg viewBox="0 0 400 200" preserveAspectRatio="none"><path d="M0,100 Q120,60 220,90 T400,80 V200 H0 Z" fill="rgba(80,50,25,.3)"/></svg>
    </div>
    <div class="dunes">
      <svg viewBox="0 0 400 200" preserveAspectRatio="none"><path d="M0,80 Q100,40 200,70 T400,60 V200 H0 Z" fill="rgba(110,69,34,.35)"/></svg>
    </div>
    <div class="menu-vignette"></div>
    <div class="topbar">
      <div class="coin-pill"><span class="ic">🪙</span><span id="coinDisplay">0</span></div>
      <div class="topbar-right">
        <button class="mute-btn" id="muteBtn">🔊</button>
      </div>
    </div>
    <div class="center-wrap">
      <div class="hero-portrait-wrap"><canvas id="menuHeroCanvas" width="160" height="160"></canvas></div>
      <div class="logo pixel-font">🛡️ أبطال<br>الصحراء<small>DESERT HEROES</small></div>
      <div class="menu-buttons">
        <button class="btn btn-play" id="btnPlay">▶ ابدأ اللعب</button>
        <button class="btn btn-heroes" id="btnHeroesMenu">🧑‍🚀 الأبطال</button>
        <button class="btn btn-shop" id="btnShopMenu">🛒 المتجر</button>
        <button class="btn btn-inv" id="btnInvMenu">🎒 الحقيبة</button>
        <button class="btn btn-secondary" id="btnDaily">🎁 مكافأة يومية</button>
      </div>
    </div>
  </div>

  <!-- ============ HEROES ============ -->
  <div class="screen" id="screen-heroes">
    <div class="topbar">
      <button class="back-btn" data-back="screen-menu">→</button>
      <div class="coin-pill"><span class="ic">🪙</span><span class="coinDisplay">0</span></div>
    </div>
    <div class="grid-screen">
      <div class="screen-title">🧑‍🚀 الأبطال</div>
      <div class="scroll-area"><div class="card-grid" id="heroesGrid"></div></div>
    </div>
  </div>

  <!-- ============ SHOP ============ -->
  <div class="screen" id="screen-shop">
    <div class="topbar">
      <button class="back-btn" data-back="screen-menu">→</button>
      <div class="coin-pill"><span class="ic">🪙</span><span class="coinDisplay">0</span></div>
    </div>
    <div class="grid-screen">
      <div class="screen-title">🛒 المتجر</div>
      <div class="tabs">
        <div class="tab active" data-rarity="all">الكل</div>
        <div class="tab" data-rarity="common">عادي</div>
        <div class="tab" data-rarity="rare">نادر</div>
        <div class="tab" data-rarity="epic">ملحمي</div>
        <div class="tab" data-rarity="legendary">أسطوري</div>
      </div>
      <div class="scroll-area"><div class="card-grid" id="shopGrid"></div></div>
    </div>
  </div>

  <!-- ============ INVENTORY ============ -->
  <div class="screen" id="screen-inv">
    <div class="topbar">
      <button class="back-btn" data-back="screen-menu">→</button>
      <div class="coin-pill"><span class="ic">🪙</span><span class="coinDisplay">0</span></div>
    </div>
    <div class="grid-screen">
      <div class="screen-title">🎒 الحقيبة - تجهيز السكنات</div>
      <div class="scroll-area" id="invList"></div>
    </div>
  </div>

  <!-- ============ HERO SELECT (pre-match) ============ -->
  <div class="screen" id="screen-herosel">
    <div class="topbar">
      <button class="back-btn" data-back="screen-menu">→</button>
      <div class="coin-pill"><span class="ic">🪙</span><span class="coinDisplay">0</span></div>
    </div>
    <div class="grid-screen">
      <div class="screen-title">اختر بطلك للمباراة</div>
      <div class="scroll-area">
        <div class="card-grid" id="heroSelGrid"></div>
        <div class="picker-label">🎮 الوضع</div>
        <div class="tabs" id="modeTabs"></div>
        <div class="picker-label">🗺️ الخريطة</div>
        <div class="tabs" id="mapTabs"></div>
        <div class="picker-label">🎚️ مستوى الصعوبة</div>
        <div class="tabs" id="diffTabs"></div>
      </div>
    </div>
    <div class="start-match-bar">
      <button class="btn btn-play" id="btnStartMatch">⚔️ ابدأ المباراة</button>
    </div>
  </div>

const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));
const dist = (x1,y1,x2,y2)=> Math.hypot(x2-x1,y2-y1);
const lerp = (a,b,t)=> a+(b-a)*t;
const TAU = Math.PI*2;

/* =====================================================================
   AUDIO (lightweight synthesized SFX)
===================================================================== */
let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur, type, vol){
  if(save.muted || !audioCtx) return;
  try{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.value = vol!==undefined?vol:0.06;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
const sfx = {
  shoot(){ beep(rand(300,340),0.05,'square',0.04); },

/* =====================================================================
   MUSIC (procedural, no external audio files — desert Hijaz-flavored loop)
===================================================================== */
const MusicEngine = (function(){
  const HIJAZ = [110.00,116.54,138.59,146.83,164.81,174.61,196.00,220.00,233.08,277.18];
  let master=null, running=false, theme='menu', step=0, nextTime=0, stepDur=0.45, timerId=null;
  function ready(){ return audioCtx && !save.muted; }
  function ensureMaster(){
    if(!audioCtx) return;
    if(!master){ master = audioCtx.createGain(); master.gain.value = 0; master.connect(audioCtx.destination); }
  }
  function tone(time, freq, dur, type, vol){
    try{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, time);
      g.gain.linearRampToValueAtTime(vol, time+0.02);
      g.gain.exponentialRampToValueAtTime(0.0005, time+dur);
      o.connect(g); g.connect(master);
      o.start(time); o.stop(time+dur+0.05);
    }catch(e){}
  }
  function drum(time, vol){
    try{
      const n = Math.floor(audioCtx.sampleRate*0.09);
      const buf = audioCtx.createBuffer(1,n,audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const g = audioCtx.createGain(); g.gain.value = vol;
      src.connect(g); g.connect(master);
      src.start(time);
    }catch(e){}
  }
  function scheduleMenu(t,i){
    if(i%8===0) tone(t, HIJAZ[0], 3.4, 'sawtooth', 0.045);
    const pat = [2,4,5,4,6,5,4,2];
    tone(t, HIJAZ[pat[i%8]], 0.8, 'triangle', 0.05);
    if(i%16===12) tone(t, HIJAZ[7], 1.3, 'sine', 0.035);
  }
  function scheduleBattle(t,i){
    tone(t, HIJAZ[0], 0.18, 'sawtooth', 0.06);
    if(i%2===0) drum(t, 0.11);
    const pat = [4,5,7,5,4,2,4,5,4,5,7,8,7,5,4,2];
    tone(t, HIJAZ[pat[i%pat.length]], 0.16, 'square', 0.035);
  }
  function loop(){
    if(!running || !audioCtx) return;
    const now = audioCtx.currentTime;
    while(nextTime < now+0.22){
      if(theme==='battle') scheduleBattle(nextTime, step); else scheduleMenu(nextTime, step);
      nextTime += stepDur; step++;
    }
    timerId = setTimeout(loop, 60);
  }
  return {
    setTheme(t){
      if(theme===t) return;
      theme = t; stepDur = t==='battle' ? 0.21 : 0.45;
    },
    start(t){
      this.setTheme(t);
      if(!audioCtx) return;
      ensureMaster();
      if(!save.muted) master.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime+0.8);
      if(!running){ running=true; nextTime=audioCtx.currentTime+0.1; step=0; loop(); }
    },
    setMuted(m){
      if(!master||!audioCtx) return;
      master.gain.cancelScheduledValues(audioCtx.currentTime);
      master.gain.linearRampToValueAtTime(m?0:0.22, audioCtx.currentTime+0.25);
    }
  };
})();

/* =====================================================================
   PIXEL-ART SPRITE RENDERER (chunky block style, top-down)
===================================================================== */
function drawPixelChar(ctx, cx, cy, facing, scale, palette, weapon, opts){
  opts = opts||{};
  const kind = opts.kind || 'soldier';
  const P = 2*scale; // pixel unit size
  ctx.save();
  ctx.translate(cx, cy);
  // soft ground shadow
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.ellipse(0, 6*scale, 11*scale, 5*scale, 0, 0, TAU); ctx.fill();

  ctx.rotate(facing);

  if(kind==='wolf' || kind==='fox'){
    drawQuadruped(ctx, scale, palette);
  } else if(kind==='tank'){
    drawTankBody(ctx, scale, palette);
  } else if(kind==='plane'){
    drawPlaneBody(ctx, scale, palette);
    drawWeapon(ctx, weapon, scale, palette);
  } else {
    // soldier (default human hero/bot)
    blockRect3D(ctx, -9*scale,-9*scale, 18*scale, 18*scale, P, palette.secondary);
    blockRect3D(ctx, -7*scale,-7*scale, 14*scale, 14*scale, P, palette.primary);
    // scarf/cape accent (trailing opposite of facing = -x)
    blockRect3D(ctx, -12*scale,-3*scale, 5*scale, 6*scale, P, palette.accent);
    // head
    blockRect3D(ctx, -4.5*scale,-4.5*scale, 9*scale, 9*scale, P, palette.skin || '#c98f5e');
    blockRect3D(ctx, -4.5*scale,-4.5*scale, 9*scale, 3.5*scale, P, palette.secondary); // helmet band
    // eye/visor stripe facing forward
    ctx.fillStyle = opts.evasive ? 'rgba(255,255,255,.35)' : '#1a1008';
    blockRect(ctx, 1.5*scale,-1.5*scale, 3*scale, 3*scale, P);
    drawWeapon(ctx, weapon, scale, palette);
  }

  // shield ring
  if(opts.shield>0){
    ctx.strokeStyle = 'rgba(120,200,255,.85)';
    ctx.lineWidth = 2.4*scale;
    ctx.beginPath(); ctx.arc(0,0, 13*scale, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
function drawQuadruped(ctx, scale, palette){
  const s = scale, P = 2*scale;
  // tail
  blockRect3D(ctx, -14*s,-2*s, 5*s, 4*s, P, palette.accent);
  // torso
  blockRect3D(ctx, -9*s,-5*s, 18*s, 10*s, P, palette.primary);
  // legs (paws peeking from under the body)
  blockRect3D(ctx, -6*s, 4*s, 3*s, 4*s, P, palette.secondary);
  blockRect3D(ctx, 3*s, 4*s, 3*s, 4*s, P, palette.secondary);
  blockRect3D(ctx, -6*s,-8*s, 3*s, 4*s, P, palette.secondary);
  blockRect3D(ctx, 3*s,-8*s, 3*s, 4*s, P, palette.secondary);
  // head + snout
  blockRect3D(ctx, 8*s,-4.5*s, 8*s, 9*s, P, palette.primary);
  blockRect3D(ctx, 15*s,-2.2*s, 4.5*s, 4.4*s, P, palette.secondary);
  // ears
  blockRect3D(ctx, 8*s,-7.5*s, 2.6*s, 3.4*s, P, palette.secondary);
  blockRect3D(ctx, 12*s,-7.5*s, 2.6*s, 3.4*s, P, palette.secondary);
}
function drawTankBody(ctx, scale, palette){
  const s = scale, P = 2*scale;
  // tracks
  blockRect3D(ctx, -9*s,-9*s, 20*s, 3*s, P, '#20221e');
  blockRect3D(ctx, -9*s, 6*s, 20*s, 3*s, P, '#20221e');
  // hull
  blockRect3D(ctx, -9*s,-6*s, 20*s, 12*s, P, palette.primary);
  // turret
  blockRect3D(ctx, -5*s,-4.5*s, 10*s, 9*s, P, palette.secondary);
  // cannon barrel
  blockRect3D(ctx, 4*s,-1.6*s, 16*s, 3.2*s, P, '#34343a');
}
function drawPlaneBody(ctx, scale, palette){
  const s = scale, P = 2*scale;
  // wings
  blockRect3D(ctx, -3*s,-14*s, 6*s, 28*s, P, palette.secondary);
  // tail fin
  blockRect3D(ctx, -11*s,-6*s, 4*s, 12*s, P, palette.secondary);
  // fuselage
  blockRect3D(ctx, -7*s,-3*s, 23*s, 6*s, P, palette.primary);
  // cockpit
  blockRect3D(ctx, 9*s,-2*s, 4*s, 4*s, P, palette.accent);
}
function blockRect(ctx,x,y,w,h,p){
  const x0 = Math.round(x/p)*p, y0 = Math.round(y/p)*p;
  const x1 = Math.round((x+w)/p)*p, y1 = Math.round((y+h)/p)*p;
  ctx.fillRect(x0,y0,x1-x0,y1-y0);
}
function shadeColor(hex, percent){
  hex = (hex||'#888888').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  let r = clamp((num>>16) + Math.round(255*percent/100), 0, 255);
  let g = clamp(((num>>8)&0xff) + Math.round(255*percent/100), 0, 255);
  let b = clamp((num&0xff) + Math.round(255*percent/100), 0, 255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function blockRect3D(ctx,x,y,w,h,p,color){
  const dep = Math.max(p*1.15, 2.2);
  ctx.fillStyle = shadeColor(color,-32);
  blockRect(ctx, x+dep, y+dep, w, h, p);
  ctx.fillStyle = color;
  blockRect(ctx, x, y, w, h, p);
  ctx.fillStyle = shadeColor(color, 28);
  blockRect(ctx, x, y, w, Math.max(p, h*0.3), p);
  blockRect(ctx, x, y, Math.max(p, w*0.2), h, p);
}
function drawWeapon(ctx, type, scale, palette){
  const metal = palette.secondary==='#000000' ? '#4a4a4a' : '#34343a';
  const s = scale;
  switch(type){
    case 'rifle':
      blockRect3D(ctx, 6*s,-2*s, 15*s, 4*s, 2*s, metal); break;
    case 'smg':
      blockRect3D(ctx, 6*s,-2.5*s, 10*s, 5*s, 2*s, metal); break;
    case 'sniper':
      blockRect3D(ctx, 6*s,-1.6*s, 22*s, 3.2*s, 2*s, metal);
      blockRect3D(ctx, 16*s,-3.5*s, 3*s, 3*s, 2*s, palette.accent); break;
    case 'minigun':
      blockRect3D(ctx, 6*s,-4*s, 12*s, 8*s, 2*s, metal);
      blockRect3D(ctx, 16*s,-3.5*s, 6*s, 2*s, 1.5*s, '#1c1c1c');
      blockRect3D(ctx, 16*s, 1.5*s, 6*s, 2*s, 1.5*s, '#1c1c1c'); break;
    case 'shotgun':
      blockRect3D(ctx, 6*s,-3.2*s, 13*s, 3*s, 2*s, metal);
      blockRect3D(ctx, 6*s, 0.2*s, 13*s, 3*s, 2*s, metal); break;
    case 'launcher':
      blockRect3D(ctx, 6*s,-4*s, 11*s, 8*s, 2*s, metal);
      ctx.fillStyle = shadeColor(palette.accent,-15);
      ctx.beginPath(); ctx.arc(11*s,0,3.2*s,0,TAU); ctx.fill();
      ctx.fillStyle = shadeColor(palette.accent,30);
      ctx.beginPath(); ctx.arc(10*s,-1*s,1.3*s,0,TAU); ctx.fill(); break;
    case 'pistols':
      blockRect3D(ctx, 5*s,-5*s, 8*s, 3*s, 2*s, metal);
      blockRect3D(ctx, 5*s, 2*s, 8*s, 3*s, 2*s, metal); break;
    case 'railgun':
      blockRect3D(ctx, 6*s,-2*s, 20*s, 4*s, 2*s, metal);
      blockRect3D(ctx, 24*s,-2.6*s, 3*s, 5.2*s, 2*s, palette.accent); break;
  }
}
function renderHeroToCanvas(canvasEl, hero, skin, opts){
  const ctx = canvasEl.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
  const pal = skin ? Object.assign({}, hero.palette, skin.colors) : hero.palette;
  drawPixelChar(ctx, canvasEl.width/2, canvasEl.height/2, -0.35, canvasEl.width/48, pal, hero.weapon, opts||{});
}

/* =====================================================================
   GAME ENGINE
===================================================================== */
let ARENA_W = 960, ARENA_H = 540;
const canvas = document.getElementById('gameCanvas');
const gctx = canvas.getContext('2d');
gctx.imageSmoothingEnabled = false;

function computeArenaSize(){
  const wrap = document.getElementById('gameWrap');
  let w = wrap.clientWidth, h = wrap.clientHeight;
  if(w<=0||h<=0){ w=390; h=700; }
  const maxDim = 900, minDim = 380;
  let scale = 1;
  if(Math.max(w,h) > maxDim) scale = maxDim/Math.max(w,h);
  else if(Math.min(w,h) < minDim) scale = minDim/Math.min(w,h);
  ARENA_W = Math.round(w*scale);
  ARENA_H = Math.round(h*scale);
  canvas.width = ARENA_W; canvas.height = ARENA_H;
}

let bgCanvas = null;
function buildBackground(map){
  map = map || MAPS[0];
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = ARENA_W; bgCanvas.height = ARENA_H;
  const c = bgCanvas.getContext('2d');
  const grad = c.createLinearGradient(0,0,0,ARENA_H);
  grad.addColorStop(0, map.sky[0]); grad.addColorStop(1,map.sky[1]);
  c.fillStyle = grad; c.fillRect(0,0,ARENA_W,ARENA_H);
  c.globalAlpha = 0.5;
  for(let i=0;i<6;i++){
    c.fillStyle = i%2===0 ? shadeColor(map.sky[0],-8) : shadeColor(map.sky[0],8);
    c.beginPath();
    c.ellipse(rand(0,ARENA_W), rand(ARENA_H*0.5,ARENA_H), rand(120,260), rand(30,60), 0, 0, TAU);
    c.fill();
  }
  c.globalAlpha = 0.15;
  c.fillStyle = shadeColor(map.sky[1],-25);
  for(let i=0;i<220;i++){
    c.fillRect(Math.floor(rand(0,ARENA_W)), Math.floor(rand(0,ARENA_H)), 2, 2);
  }
  c.globalAlpha = 1;
}

function makeObstacles(map){
  map = map || MAPS[0];
  const list = [];
  map.obstacles.forEach((p,i)=>{
    const type = p[2];
    const r = type==='rock'||type==='ruin' ? 34 : (type==='cloud' ? 30 : 24);
    list.push({x:p[0]*ARENA_W, y:p[1]*ARENA_H, r, type});
  });
  return list;
}
function drawObstacle(ctx,o){
  ctx.save(); ctx.translate(o.x,o.y);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0,o.r*0.5,o.r*0.9,o.r*0.35,0,0,TAU); ctx.fill();
  if(o.type==='rock'){
    blockRect3D(ctx,-o.r,-o.r*0.7,o.r*2,o.r*1.4,4,'#8a7357');
    blockRect3D(ctx,-o.r*0.7,-o.r*0.9,o.r*1.2,o.r*0.6,4,'#a8926f');
  } else if(o.type==='cactus'){
    blockRect3D(ctx,-o.r*0.25,-o.r*1.3,o.r*0.5,o.r*1.8,4,'#5c8a4e');
    blockRect3D(ctx,-o.r*0.9,-o.r*0.5,o.r*0.5,o.r*0.9,4,'#5c8a4e');
    blockRect3D(ctx,o.r*0.4,-o.r*0.7,o.r*0.5,o.r*1.1,4,'#5c8a4e');
  } else if(o.type==='cloud'){
    blockRect3D(ctx,-o.r*0.9,-o.r*0.3,o.r*1.8,o.r*0.6,4,'#ffffff');
    blockRect3D(ctx,-o.r*0.5,-o.r*0.6,o.r*1.0,o.r*0.5,4,'#ffffff');
    blockRect3D(ctx,-o.r*0.05,-o.r*0.45,o.r*0.85,o.r*0.4,4,'#f0f7ff');
  } else {
    blockRect3D(ctx,-o.r*0.35,-o.r*1.4,o.r*0.7,o.r*1.8,4,'#c9a96a');
    blockRect3D(ctx,-o.r*0.5,-o.r*1.5,o.r*1.0,o.r*0.3,4,'#a8875a');
  }
  ctx.restore();
}

/* ---------- game state container ---------- */
let G = null;
const BOT_SPAWN_FRACS = [[0.0625,0.111],[0.9375,0.111],[0.0625,0.889],[0.9375,0.889],[0.5,0.111],[0.5,0.889]];
function startMatch(heroId, mapId, diffId, modeId){
  const hero = heroById(heroId);
  const skin = equippedSkinFor(heroId);
  const pal = skin ? Object.assign({}, hero.palette, skin.colors) : hero.palette;
  const map = mapById(mapId);
  const botStats = Object.assign({}, difficultyById(diffId)); // clone: modes may mutate stats (survival waves)
  const mode = modeId || 'classic';
  const enemyKind = map.id==='sky' ? 'plane' : ENEMY_KIND_POOL[randInt(0,ENEMY_KIND_POOL.length-1)];
  const playerKind = map.id==='sky' ? 'plane' : 'soldier';
  showScreen('screen-game');
  computeArenaSize();
  buildBackground(map);
  G = {
    hero, pal, map, botStats, enemyKind, playerKind, mode,
    lives: SURVIVAL_LIVES[diffId] || 3, wave: 1, waveTimer: 15,
    obstacles: makeObstacles(map),
    player: {
      x: ARENA_W/2, y: ARENA_H-70, hp: hero.stats.hp, maxHp: hero.stats.hp,
      facing: -Math.PI/2, cooldown:0, kills:0, deaths:0, ult:0,
      buffUntil:0, buffSpeed:1, buffFire:1, evasiveUntil:0, shield:0, critUntil:0, regenUntil:0, regenRate:0
    },
    bots: [], allies: [],
    bullets: [], particles: [],
    timeLeft: mode==='survival' ? 0 : (mode==='timeattack' ? 90 : 180),
    timeDir: mode==='survival' ? 1 : -1,
    running: true, ended:false,
    move: {x:0,y:0}, aimAngle: -Math.PI/2, firing:false,
    shake: {time:0, mag:0}, flashAlpha:0, dustTimer:0,
    lastTs: 0
  };
  if(mode==='boss'){ spawnBoss(); }
  else {
    spawnBots(botStats.bots);
    if(mode==='team') spawnAllies(2);
  }
  document.getElementById('ultLabel').textContent = '✨ ' + hero.ult.name;
  const modeLabel = MODES.find(m=>m.id===mode).nameAr;
  showToast(modeLabel + ' | العدو: ' + ENEMY_KIND_LABEL[enemyKind]);
  resizeCanvasToWrap();
  MusicEngine.start('battle');
  requestAnimationFrame(gameLoop);
}
function screenShake(mag, dur){ if(G){ G.shake.mag = Math.max(G.shake.mag, mag); G.shake.time = Math.max(G.shake.time, dur); } }
function spawnBots(n){

    const p = BOT_SPAWN_FRACS[randInt(0,BOT_SPAWN_FRACS.length-1)];

      hp: G.botStats.hp, maxHp: G.botStats.hp, facing:0, cooldown:rand(0,0.5), alive:true, dustTimer:rand(0,0.1)
    });

}
function spawnBoss(){

  G.bots.push({
    id:'boss', x:ARENA_W/2, y:ARENA_H*0.25,
    hp, maxHp:hp, facing:Math.PI/2, cooldown:0.6, alive:true, dustTimer:0, scale:1.9, isBoss:true
  });

function spawnAllies(n){

      x: ARENA_W/2 + (i-(n-1)/2)*50, y: ARENA_H-40,

    });

function respawnBot(bot){

  bot.x = p[0]*ARENA_W; bot.y = p[1]*ARENA_H; bot.maxHp = G.botStats.hp; bot.hp = bot.maxHp; bot.alive = true; bot.cooldown = 0.6;
}

/* ---------- input: touch joystick ---------- */
const joyZone = document.getElementById('joyZone'), joyKnob = document.getElementById('joyKnob');
let joyActive = false, joyId = null, joyCenter = {x:0,y:0};
joyZone.addEventListener('touchstart', e=>{
  const t = e.changedTouches[0]; joyActive = true; joyId = t.identifier;
  const r = joyZone.getBoundingClientRect(); joyCenter = {x:r.left+r.width/2, y:r.top+r.height/2};
  e.preventDefault();
}, {passive:false});
window.addEventListener('touchmove', e=>{
  if(!joyActive) return;
  for(const t of e.changedTouches){
    if(t.identifier!==joyId) continue;
    let dx = t.clientX-joyCenter.x, dy = t.clientY-joyCenter.y;
    const d = Math.hypot(dx,dy), max=44;
    if(d>max){ dx = dx/d*max; dy = dy/d*max; }
    joyKnob.style.left = (34+dx)+'px'; joyKnob.style.top = (34+dy)+'px';
    if(G){ G.move.x = dx/max; G.move.y = dy/max; if(d>10) G.aimAngle = Math.atan2(dy,dx); }
  }
  e.preventDefault();
}, {passive:false});
window.addEventListener('touchend', e=>{
  for(const t of e.changedTouches){
    if(t.identifier!==joyId) continue;
    joyActive = false; joyKnob.style.left='34px'; joyKnob.style.top='34px';
    if(G){ G.move.x = 0; G.move.y = 0; }
  }
});

/* ---------- ultimate activation ---------- */
function tryUltimate(){
  if(!G || G.ended) return;
  if(G.player.ult < 100){ return; }
  G.player.ult = 0;
  sfx.ult();
  const key = G.hero.ult.key;
  const p = G.player;
  const now = performance.now()/1000;
  G.flashAlpha = 0.5;
  screenShake(6, 0.25);
  G.particles.push({type:'ultRing', x:p.x, y:p.y, life:0.55, maxLife:0.55, color:G.pal.accent});
  for(let i=0;i<18;i++){
    const a = rand(0,TAU), sp = rand(80,260);
    G.particles.push({type:'spark', x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.6, maxLife:0.6, color:'#ffe36b'});
  }
  if(key==='adrenaline'){ p.buffUntil = now+5; p.buffSpeed=1.5; p.buffFire=1.45; }
  else if(key==='smokeDash'){
    p.x = clamp(p.x + Math.cos(G.aimAngle)*160, 30, ARENA_W-30);
    p.y = clamp(p.y + Math.sin(G.aimAngle)*160, 30, ARENA_H-30);
    p.evasiveUntil = now+3;
  }
  else if(key==='eagleEye'){ fireBullet(p, G.aimAngle, 60, 2000, true); }
  else if(key==='ironWall'){ p.shield = 100; }
  else if(key==='fieldRevive'){ p.hp = Math.min(p.maxHp, p.hp+50); p.regenUntil = now+4; p.regenRate=3; }
  else if(key==='sandstorm'){
    for(let i=-2;i<=2;i++){
      const a = G.aimAngle + i*0.18;
      spawnGrenade(p, a);
    }
  }
  else if(key==='vanish'){
    p.x = clamp(p.x + Math.cos(G.aimAngle)*200, 30, ARENA_W-30);
    p.y = clamp(p.y + Math.sin(G.aimAngle)*200, 30, ARENA_H-30);
    p.critUntil = now+3; p.evasiveUntil = now+0.5;
  }
  else if(key==='falconWrath'){
    // instant wide beam hit
    G.bots.forEach(b=>{
      if(!b.alive) return;
      const ang = Math.atan2(b.y-p.y, b.x-p.x);
      let diff = Math.abs(ang - G.aimAngle); if(diff>Math.PI) diff = TAU-diff;
      if(diff < 0.18 && dist(p.x,p.y,b.x,b.y) < 700){ damageBot(b, 70); }
    });
    G.particles.push({type:'beam', x:p.x, y:p.y, angle:G.aimAngle, life:0.35, maxLife:0.35});
  }
}

function spawnGrenade(owner, angle){
  G.bullets.push({x:owner.x, y:owner.y, vx:Math.cos(angle)*360, vy:Math.sin(angle)*360,
    dmg:20, owner:'player', side:'blue', radius:5, life:0.45, grenade:true, aoe:60});
}
function fireBullet(owner, angle, dmg, speed, pierce){
  G.bullets.push({x:owner.x+Math.cos(angle)*16, y:owner.y+Math.sin(angle)*16,
    vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, dmg, owner:'player', side:'blue', radius:4, life:1.2, pierce});
}

/* ---------- player shooting ---------- */
function playerShoot(){
  const p = G.player, st = G.hero.stats;
  if(p.cooldown>0) return;
  p.cooldown = st.cooldown / (p.buffFire||1);
  const pellets = st.pellets||1;
  for(let i=0;i<pellets;i++){
    const spread = (st.spread||0) * (pellets>1 ? rand(-1,1) : rand(-1,1));
    const a = G.aimAngle + spread;
    let dmg = st.dmg;
    if(G.player.critUntil > performance.now()/1000){ dmg *= 2; }
    if(G.hero.weapon==='launcher'){
      spawnGrenade(p, a);
    } else {
      G.bullets.push({x:p.x+Math.cos(a)*16, y:p.y+Math.sin(a)*16, vx:Math.cos(a)*st.bulletSpeed, vy:Math.sin(a)*st.bulletSpeed,
        dmg, owner:'player', side:'blue', radius:3.4, life:1.3, pierce: !!st.pierce});
    }
  }
  G.particles.push({type:'flash', x:p.x+Math.cos(G.aimAngle)*20, y:p.y+Math.sin(G.aimAngle)*20, life:0.06, maxLife:0.06});
  sfx.shoot();
}
function botShoot(bot, targetAngle){
  const bs = G.botStats;
  const dmgMult = bot.isBoss ? 1.6 : 1;
  const cdMult = bot.isBoss ? 0.8 : 1;
  bot.cooldown = bs.cooldown*cdMult;
  const a = targetAngle + rand(-bs.spread, bs.spread);
  G.bullets.push({x:bot.x+Math.cos(a)*14, y:bot.y+Math.sin(a)*14, vx:Math.cos(a)*bs.bulletSpeed, vy:Math.sin(a)*bs.bulletSpeed,
    dmg:bs.dmg*dmgMult, owner:bot.id, side:'red', radius: bot.isBoss?4.5:3.2, life:1.2});
}
function allyShoot(ally, targetAngle){
  const bs = G.botStats;
  ally.cooldown = bs.cooldown;
  const a = targetAngle + rand(-bs.spread, bs.spread);
  G.bullets.push({x:ally.x+Math.cos(a)*14, y:ally.y+Math.sin(a)*14, vx:Math.cos(a)*bs.bulletSpeed, vy:Math.sin(a)*bs.bulletSpeed,
    dmg:bs.dmg, owner:'ally', side:'blue', radius:3.2, life:1.2});
}

/* ---------- damage handling ---------- */
function damagePlayer(dmg){
  const p = G.player;
  const now = performance.now()/1000;
  if(p.evasiveUntil > now) return;
  if(p.shield>0){ const absorb = Math.min(p.shield,dmg); p.shield -= absorb; dmg -= absorb; }
  if(dmg<=0) return;
  p.hp -= dmg;
  spawnHitParticles(p.x,p.y);
  spawnDmgText(p.x,p.y,dmg,'#ff8a7a');
  screenShake(clamp(dmg*0.4,2,8), 0.18);
  sfx.hit();
  if(p.hp<=0){ playerDied(); }
}
function damageBot(bot, dmg){
  if(!bot.alive) return;
  bot.hp -= dmg;
  spawnHitParticles(bot.x,bot.y);
  spawnDmgText(bot.x,bot.y,dmg,'#ffe36b');
  sfx.hit();
  G.player.ult = Math.min(100, G.player.ult + 12);
  if(bot.hp<=0){ botDied(bot); }
}
function damageAlly(ally, dmg){
  if(!ally.alive) return;
  ally.hp -= dmg;
  spawnHitParticles(ally.x,ally.y);
  spawnDmgText(ally.x,ally.y,dmg,'#9be0ff');
  sfx.hit();
  if(ally.hp<=0){ ally.alive=false; spawnHitParticles(ally.x,ally.y,true); sfx.death(); }
}
function playerDied(){
  G.player.deaths++; sfx.death();
  spawnHitParticles(G.player.x,G.player.y,true);
  screenShake(12, 0.45);
  G.flashAlpha = 0.55;
  G.player.hp = 0;
  if(G.mode==='survival' && G.player.deaths>=G.lives){
    setTimeout(()=>{ if(G && !G.ended) endMatch(false); }, 900);
    return;
  }
  setTimeout(()=>{
    if(!G || G.ended) return;
    G.player.x = ARENA_W/2; G.player.y = ARENA_H-70;
    G.player.hp = G.player.maxHp; G.player.evasiveUntil = performance.now()/1000+1;
  }, 1800);
}
function botDied(bot){
  bot.alive = false; G.player.kills++;
  spawnHitParticles(bot.x,bot.y,true);
  G.particles.push({type:'koText', x:bot.x, y:bot.y-20, life:0.9, maxLife:0.9});
  sfx.death();
  if(G.mode==='boss'){
    setTimeout(()=>{ if(G && !G.ended) endMatch(true); }, 600);
    return;
  }
  const delay = G.mode==='timeattack' ? 900 : 2200;
  setTimeout(()=>{ if(G && !G.ended) respawnBot(bot); }, delay);
}
function spawnHitParticles(x,y,big){
  const n = big?14:6;
  for(let i=0;i<n;i++){
    const a = rand(0,TAU), sp = rand(40,big?220:120);
    G.particles.push({type:'spark', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:big?0.5:0.25, maxLife:big?0.5:0.25, color: big?'#e6483a':'#ffd76b'});
  }
}
function spawnDmgText(x,y,dmg,color){
  G.particles.push({type:'dmgText', x:x+rand(-6,6), y:y-14, vx:0, vy:-38, life:0.7, maxLife:0.7, text:Math.round(dmg), color});
}
function spawnDust(x,y){
  const sky = G.map && G.map.id==='sky';
  G.particles.push({type:'dust', x:x+rand(-4,4), y:y+rand(6,12), vx:rand(-8,8), vy:rand(-14,-4), life:0.4, maxLife:0.4, sky});
}

/* ---------- collision helpers ---------- */
function resolveObstacles(entity, r){
  G.obstacles.forEach(o=>{
    const d = dist(entity.x,entity.y,o.x,o.y);
    const minD = o.r*0.7 + r;
    if(d < minD && d>0.01){
      const push = (minD-d);
      entity.x += (entity.x-o.x)/d*push;
      entity.y += (entity.y-o.y)/d*push;
    }
  });
  entity.x = clamp(entity.x, 20, ARENA_W-20);
  entity.y = clamp(entity.y, 20, ARENA_H-20);
}

/* ---------- main loop ---------- */
function gameLoop(ts){
  if(!G || !G.running) return;
  if(!G.lastTs) G.lastTs = ts;
  let dt = (ts - G.lastTs)/1000; G.lastTs = ts;
  dt = Math.min(dt, 0.05);
  if(!G.ended) update(dt);
  render();
  requestAnimationFrame(gameLoop);
}
function update(dt){
  const p = G.player, st = G.hero.stats, now = performance.now()/1000;
  // movement input (keyboard + joystick)
  let mx = G.move.x||0, my = G.move.y||0;
  if(keys['w']||keys['arrowup']) my = -1;
  if(keys['s']||keys['arrowdown']) my = 1;
  if(keys['a']||keys['arrowleft']) mx = -1;
  if(keys['d']||keys['arrowright']) mx = 1;
  const mlen = Math.hypot(mx,my);
  if(mlen>0.05){
    const spd = st.speed * (p.buffUntil>now?p.buffSpeed:1);
    p.x += (mx/mlen)*spd*dt; p.y += (my/mlen)*spd*dt;
    p.facing = Math.atan2(my,mx);
    G.dustTimer -= dt;
    if(G.dustTimer<=0){ spawnDust(p.x,p.y); G.dustTimer = 0.09; }
  }
  resolveObstacles(p, 13);
  if(!keys['w']&&!keys['a']&&!keys['s']&&!keys['d']&&!keys['arrowup']&&!keys['arrowleft']&&!keys['arrowdown']&&!keys['arrowright']){
    // mouse aim overrides facing when idle-ish
  }
  p.facing = G.aimAngle;
  if(p.cooldown>0) p.cooldown -= dt;
  if((G.firing || keys[' ']) && p.hp>0) playerShoot();
  if(p.regenUntil>now) p.hp = Math.min(p.maxHp, p.hp + p.regenRate*dt);
  if(G.hero.id==='h5') p.hp = Math.min(p.maxHp, p.hp + 1*dt); // medic passive
  p.ult = Math.min(100, p.ult + 2.4*dt);

  // bots AI
  const bs = G.botStats;
  G.bots.forEach(b=>{
    if(!b.alive) return;
    const d = dist(b.x,b.y,p.x,p.y);
    const angleToPlayer = Math.atan2(p.y-b.y, p.x-b.x);
    b.facing = angleToPlayer;
    if(d > bs.shootRange*0.7){
      b.x += Math.cos(angleToPlayer)*bs.speed*dt;
      b.y += Math.sin(angleToPlayer)*bs.speed*dt;
    } else if(d < bs.shootRange*0.4){
      b.x -= Math.cos(angleToPlayer)*bs.speed*0.6*dt;
      b.y -= Math.sin(angleToPlayer)*bs.speed*0.6*dt;
    } else {
      b.x += Math.cos(angleToPlayer+Math.PI/2)*bs.speed*0.4*dt;
      b.y += Math.sin(angleToPlayer+Math.PI/2)*bs.speed*0.4*dt;
    }
    b.dustTimer -= dt;
    if(b.dustTimer<=0){ spawnDust(b.x,b.y); b.dustTimer = 0.11; }
    resolveObstacles(b, 13);
    if(b.cooldown>0) b.cooldown -= dt;
    if(d < bs.detect && b.cooldown<=0 && p.hp>0){ botShoot(b, angleToPlayer); }
  });

  // allies AI (team mode)
  if(G.allies && G.allies.length){
    G.allies.forEach(a=>{
      if(!a.alive) return;
      let target=null, bestD=Infinity;
      G.bots.forEach(b=>{ if(b.alive){ const dd=dist(a.x,a.y,b.x,b.y); if(dd<bestD){ bestD=dd; target=b; } } });
      a.dustTimer -= dt;
      if(a.dustTimer<=0){ spawnDust(a.x,a.y); a.dustTimer = 0.11; }
      if(target){
        const ang = Math.atan2(target.y-a.y, target.x-a.x);
        a.facing = ang;
        if(bestD > bs.shootRange*0.7){ a.x += Math.cos(ang)*bs.speed*dt; a.y += Math.sin(ang)*bs.speed*dt; }
        else if(bestD < bs.shootRange*0.4){ a.x -= Math.cos(ang)*bs.speed*0.6*dt; a.y -= Math.sin(ang)*bs.speed*0.6*dt; }
        resolveObstacles(a, 13);
        if(a.cooldown>0) a.cooldown -= dt;
        if(bestD < bs.detect && a.cooldown<=0){ allyShoot(a, ang); }
      } else {
        const dd = dist(a.x,a.y,p.x,p.y);
        if(dd > 90){
          const ang = Math.atan2(p.y-a.y, p.x-a.x);
          a.facing = ang;
          a.x += Math.cos(ang)*bs.speed*0.7*dt; a.y += Math.sin(ang)*bs.speed*0.7*dt;
          resolveObstacles(a, 13);
        }
      }
    });
  }

  // survival wave scaling
  if(G.mode==='survival'){
    G.waveTimer -= dt;
    if(G.waveTimer<=0){
      G.waveTimer = 15; G.wave++;
      G.botStats.hp = Math.round(G.botStats.hp*1.12);
      G.botStats.dmg = Math.round(G.botStats.dmg*1.08);
      showToast('🌊 الموجة ' + G.wave + '!');
    }
  }

  // bullets
  for(let i=G.bullets.length-1;i>=0;i--){
    const bl = G.bullets[i];
    bl.x += bl.vx*dt; bl.y += bl.vy*dt; bl.life -= dt;
    let remove = bl.life<=0 || bl.x<0||bl.x>ARENA_W||bl.y<0||bl.y>ARENA_H;
    if(!remove){
      for(const o of G.obstacles){
        if(dist(bl.x,bl.y,o.x,o.y) < o.r*0.7){
          if(bl.grenade) explodeGrenade(bl);
          remove = true; break;
        }
      }
    }
    if(!remove){
      if(bl.side==='blue'){
        for(const b of G.bots){
          if(!b.alive) continue;
          if(dist(bl.x,bl.y,b.x,b.y) < 14){
            if(bl.grenade){ explodeGrenade(bl); }
            else { damageBot(b, bl.dmg); }
            if(!bl.pierce) remove = true;
            break;
          }
        }
      } else {
        if(dist(bl.x,bl.y,p.x,p.y) < 14 && p.hp>0){
          damagePlayer(bl.dmg); remove = true;
        }
        if(!remove && G.allies){
          for(const a of G.allies){
            if(!a.alive) continue;
            if(dist(bl.x,bl.y,a.x,a.y) < 14){
              damageAlly(a, bl.dmg); remove = true; break;
            }
          }
        }
      }
    }
    if(remove) G.bullets.splice(i,1);
  }

  // particles
  for(let i=G.particles.length-1;i>=0;i--){
    const pt = G.particles[i];
    pt.life -= dt;
    if(pt.vx!==undefined){ pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx*=0.9; pt.vy*=0.9; }
    if(pt.life<=0) G.particles.splice(i,1);
  }

  // shake & flash decay
  if(G.shake.time>0){ G.shake.time -= dt; if(G.shake.time<=0) G.shake.mag = 0; }
  if(G.flashAlpha>0){ G.flashAlpha = Math.max(0, G.flashAlpha - dt*1.6); }

  // ult button visual
  const ultBtn = document.getElementById('ultBtn');
  ultBtn.classList.toggle('ready', p.ult>=100);

  // HUD
  const hpPct = clamp(p.hp/p.maxHp*100,0,100);
  document.getElementById('hpFill').style.width = hpPct+'%';
  document.getElementById('ultFill').style.width = clamp(p.ult,0,100)+'%';
  if(G.mode==='survival'){
    document.getElementById('hudScore').textContent = `❤️ ${Math.max(0,G.lives-p.deaths)}  🎯 ${p.kills}`;
  } else if(G.mode==='timeattack'){
    document.getElementById('hudScore').textContent = `🎯 ${p.kills}`;
  } else if(G.mode==='boss'){
    const boss = G.bots[0];
    document.getElementById('hudScore').textContent = boss && boss.alive ? `👹 ${Math.max(0,Math.round(boss.hp/boss.maxHp*100))}%` : '👹 —';
  } else {
    document.getElementById('hudScore').textContent = `أنت ${p.kills} - ${p.deaths} بوتات`;
  }
  const vignette = document.getElementById('lowHpVignette');
  if(vignette) vignette.style.opacity = hpPct<30 ? (0.55*(1-hpPct/30)) : 0;
  G.timeLeft += G.timeDir*dt;
  const mm = Math.max(0,Math.floor(G.timeLeft/60)), ss = Math.max(0,Math.floor(G.timeLeft%60));
  document.getElementById('hudTimer').textContent = `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;

  if(G.mode==='survival'){
    // ends via playerDied() when lives run out
  } else if(G.mode==='timeattack'){
    if(G.timeLeft<=0) endMatch(true);
  } else if(G.mode==='boss'){
    if(G.timeLeft<=0) endMatch(false); // boss survived
  } else {
    if(p.kills>=10){ endMatch(true); }
    else if(p.deaths>=10){ endMatch(false); }
    else if(G.timeLeft<=0){ endMatch(p.kills>p.deaths); }
  }
}
function explodeGrenade(bl){
  sfx.explode();
  screenShake(7, 0.3);
  G.particles.push({type:'explosion', x:bl.x, y:bl.y, life:0.3, maxLife:0.3});
  G.bots.forEach(b=>{
    if(b.alive && dist(bl.x,bl.y,b.x,b.y) < (bl.aoe||60)) damageBot(b, bl.dmg);
  });
  if(bl.owner!=='player' && dist(bl.x,bl.y,G.player.x,G.player.y) < (bl.aoe||60)) damagePlayer(bl.dmg);
}

function render(){
  gctx.clearRect(0,0,ARENA_W,ARENA_H);
  gctx.save();
  if(G.shake.time>0){
    const f = G.shake.time * G.shake.mag;
    gctx.translate(rand(-f,f), rand(-f,f));
  }

  if(bgCanvas) gctx.drawImage(bgCanvas,0,0);
  G.obstacles.forEach(o=> drawObstacle(gctx,o));

  // bullets (with short trail)
  G.bullets.forEach(bl=>{
    const len = bl.grenade ? 0 : 14;
    if(len){
      const bs = Math.hypot(bl.vx,bl.vy)||1;
      gctx.strokeStyle = bl.side==='blue' ? 'rgba(255,227,107,.55)' : 'rgba(255,90,74,.55)';
      gctx.lineWidth = 2.4;
      gctx.beginPath();
      gctx.moveTo(bl.x, bl.y);
      gctx.lineTo(bl.x - bl.vx/bs*len, bl.y - bl.vy/bs*len);
      gctx.stroke();
    }
    gctx.fillStyle = bl.grenade ? '#3a2414' : (bl.side==='blue' ? '#ffe36b' : '#ff5a4a');
    gctx.beginPath(); gctx.arc(bl.x,bl.y, bl.grenade?5:3, 0, TAU); gctx.fill();
  });

  // bots
  G.bots.forEach(b=>{
    if(!b.alive) return;
    const sc = b.scale||1;
    drawPixelChar(gctx, b.x, b.y, b.facing, 1.6*sc, ENEMY_PALETTES[G.enemyKind], 'rifle', {kind:G.enemyKind});
    drawMiniHpBar(b.x, b.y-24*sc, b.hp/b.maxHp, 26*sc);
  });

  // allies
  if(G.allies) G.allies.forEach(a=>{
    if(!a.alive) return;
    drawPixelChar(gctx, a.x, a.y, a.facing, 1.6, {primary:'#3a8fd9', secondary:'#1e5c99', accent:'#bfe0ff', skin:'#c98f5e'}, 'rifle', {kind:G.playerKind});
    drawMiniHpBar(a.x, a.y-24, a.hp/a.maxHp, 26);
  });

  // player
  if(G.player.hp>0){
    const now = performance.now()/1000;
    if(SKINS.some(s=>s.heroId===G.hero.id && s.rarity==='legendary' && save.equipped[G.hero.id]===s.id)){
      gctx.save(); gctx.globalAlpha = 0.35 + Math.sin(now*6)*0.12;
      gctx.fillStyle = G.pal.accent;
      gctx.beginPath(); gctx.arc(G.player.x, G.player.y, 22, 0, TAU); gctx.fill();
      gctx.restore();
    }
    drawPixelChar(gctx, G.player.x, G.player.y, G.player.facing, 1.7, G.pal, G.hero.weapon, {shield:G.player.shield, evasive:G.player.evasiveUntil>now, kind:G.playerKind});
  }

  // particles
  G.particles.forEach(pt=>{
    const t = clamp(pt.life/pt.maxLife,0,1);
    if(pt.type==='spark'){ gctx.fillStyle = pt.color; gctx.globalAlpha = t; gctx.fillRect(pt.x-2,pt.y-2,4,4); gctx.globalAlpha=1; }
    else if(pt.type==='dust'){ gctx.fillStyle= pt.sky? 'rgba(255,255,255,'+(t*0.6)+')' : 'rgba(219,160,92,'+(t*0.5)+')'; gctx.beginPath(); gctx.arc(pt.x,pt.y,3,0,TAU); gctx.fill(); }
    else if(pt.type==='flash'){
      const grd = gctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,10);
      grd.addColorStop(0,'rgba(255,246,192,'+t+')'); grd.addColorStop(1,'rgba(255,246,192,0)');
      gctx.fillStyle=grd; gctx.beginPath(); gctx.arc(pt.x,pt.y,10,0,TAU); gctx.fill();
    }
    else if(pt.type==='explosion'){ gctx.fillStyle='rgba(255,140,60,'+(0.7*t)+')'; gctx.beginPath(); gctx.arc(pt.x,pt.y,60*(1-t)+10,0,TAU); gctx.fill(); }
    else if(pt.type==='beam'){
      gctx.save(); gctx.translate(pt.x,pt.y); gctx.rotate(pt.angle);
      gctx.fillStyle = 'rgba(155,224,255,'+(0.8*t)+')';
      gctx.fillRect(0,-6,ARENA_W*1.2,12);
      gctx.restore();
    }
    else if(pt.type==='ultRing'){
      const r = (1-t)*70+6;
      gctx.strokeStyle = (pt.color||'#ffe36b'); gctx.globalAlpha = t; gctx.lineWidth = 4;
      gctx.beginPath(); gctx.arc(pt.x,pt.y,r,0,TAU); gctx.stroke(); gctx.globalAlpha=1;
    }
    else if(pt.type==='dmgText'){
      gctx.globalAlpha = t; gctx.fillStyle = pt.color||'#fff';
      gctx.font = 'bold 13px monospace'; gctx.textAlign='center';
      gctx.fillText(pt.text, pt.x, pt.y);
      gctx.globalAlpha = 1;
    }
    else if(pt.type==='koText'){
      gctx.globalAlpha = t; gctx.fillStyle = '#ffcf5c';
      gctx.font = 'bold 15px monospace'; gctx.textAlign='center';
      gctx.fillText('KO!', pt.x, pt.y - (1-t)*20);
      gctx.globalAlpha = 1;
    }
  });

  gctx.restore();

  if(G.flashAlpha>0){
    gctx.fillStyle = 'rgba(255,255,255,'+G.flashAlpha+')';
    gctx.fillRect(0,0,ARENA_W,ARENA_H);
  }
}
function drawMiniHpBar(x,y,pct,w){
  gctx.fillStyle='rgba(0,0,0,.5)'; gctx.fillRect(x-w/2,y,w,5);
  gctx.fillStyle = pct>0.5?'#4caf6b':(pct>0.25?'#e0a020':'#e6483a');
  gctx.fillRect(x-w/2,y,w*clamp(pct,0,1),5);
}

/* ---------- pause / end match ---------- */
document.getElementById('btnPause').addEventListener('click', ()=>{
  if(!G || G.ended) return;
  G.running = false; openOverlay('pauseOverlay');
});
document.getElementById('btnResume').addEventListener('click', ()=>{
  closeOverlay('pauseOverlay'); G.running = true; G.lastTs = 0; requestAnimationFrame(gameLoop);
});
document.getElementById('btnQuitMatch').addEventListener('click', ()=>{
  closeOverlay('pauseOverlay'); endMatch(false, true);
});
function endMatch(won, quit){
  if(!G || G.ended) return;
  G.ended = true; G.running = false;
  const p = G.player;
  const mult = G.botStats.rewardMult;
  let coinsEarned, title, titleClass, statsHtml;

  if(quit){
    coinsEarned = Math.max(20, p.kills*8);
    title = '🚪 خروج'; titleClass = 'lose';
    statsHtml = `عدد القتلات: <b>${p.kills}</b>`;
  } else if(G.mode==='boss'){
    coinsEarned = Math.round((won?300:60)*mult);
    if(won) save.stats.wins++; else save.stats.losses++;
    title = won ? '🏆 هزمت الزعيم!' : '💀 نجا الزعيم منك';
    titleClass = won?'win':'lose';
    statsHtml = `مرات الموت: <b>${p.deaths}</b>`;
  } else if(G.mode==='survival'){
    coinsEarned = Math.round((30*G.wave + p.kills*8)*mult);
    save.stats.losses++;
    title = '💀 انتهت أرواحك';
    titleClass = 'lose';
    statsHtml = `الموجة التي وصلت لها: <b>${G.wave}</b><br>عدد القتلات: <b>${p.kills}</b>`;
  } else if(G.mode==='timeattack'){
    coinsEarned = Math.round((50 + p.kills*18)*mult);
    save.stats.wins++;
    const best = save.stats.bestTimeAttack||0;
    const isRecord = p.kills > best;
    if(isRecord) save.stats.bestTimeAttack = p.kills;
    title = isRecord ? '🏆 رقم قياسي جديد!' : '⏱️ انتهى الوقت';
    titleClass = 'win';
    statsHtml = `عدد القتلات: <b>${p.kills}</b><br>أفضل رقم: <b>${Math.max(p.kills,best)}</b>`;
  } else {
    coinsEarned = Math.round((won ? 100+p.kills*15 : 40+p.kills*10)*mult);
    if(won) save.stats.wins++; else save.stats.losses++;
    title = won? '🏆 فوز!' : '💀 خسارة';
    titleClass = won?'win':'lose';
    statsHtml = `عدد القتلات: <b>${p.kills}</b><br>مرات الموت: <b>${p.deaths}</b>`;
  }
  save.stats.kills += p.kills; save.stats.deaths += p.deaths;
  addCoins(coinsEarned); persist();

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultTitle').className = 'result-title ' + titleClass;
  document.getElementById('resultStats').innerHTML = statsHtml;
  document.getElementById('resultCoins').textContent = '+' + coinsEarned;
  const confettiLayer = document.getElementById('confettiLayer');
  confettiLayer.innerHTML = '';
  if(titleClass==='win') spawnConfetti(confettiLayer);
  openOverlay('resultOverlay');
}
function spawnConfetti(layer){
  const colors = ['#ffcf5c','#ff8a4c','#4fa8ff','#8fdb9a','#b565f0','#ffffff'];
  for(let i=0;i<48;i++){
    const c = document.createElement('div');
    c.className = 'confetto';
    const size = rand(6,11);
    c.style.width = size+'px'; c.style.height = size*rand(0.5,1)+'px';
    c.style.left = rand(0,100)+'%';
    c.style.background = colors[randInt(0,colors.length-1)];
    c.style.animationDuration = rand(1.6,3)+'s';
    c.style.animationDelay = rand(0,0.6)+'s';
    layer.appendChild(c);
  }
}
document.getElementById('btnBackToMenu').addEventListener('click', ()=>{
  closeOverlay('resultOverlay');
  document.getElementById('confettiLayer').innerHTML = '';
  G = null;
  showScreen('screen-menu');
});

function initSandParticles(){
  const holder = document.getElementById('sandParticles');
  if(!holder) return;
  const n = 22;
  for(let i=0;i<n;i++){
    const m = document.createElement('div');
    m.className = 'sand-mote';
    const size = rand(2,5);
    m.style.width = size+'px'; m.style.height = size+'px';
    m.style.left = rand(0,100)+'%';
    m.style.setProperty('--drift', rand(-40,40)+'px');
    m.style.animationDuration = rand(9,20)+'s';
    m.style.animationDelay = '-' + rand(0,18)+'s';
    holder.appendChild(m);
  }
}
initSandParticles();
refreshCoinDisplays();
renderMenuHero();
